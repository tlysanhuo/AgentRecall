<svg width="1240" height="360" viewBox="0 0 1240 360" xmlns="http://www.w3.org/2000/svg">
  <!-- Defs for Arrowheads -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="#646a73" />
    </marker>
    <marker id="arrow-loop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="#8569cb" />
    </marker>
  </defs>

  <!-- Background / Group Containers -->
  <!-- 计划阶段 (Plan) Container -->
  <rect x="145" y="90" width="300" height="150" rx="12" fill="none" stroke="#8569cb" stroke-width="2" stroke-dasharray="6 4" />
  <text x="160" y="120" font-size="14" font-weight="bold" fill="#8569cb">计划阶段 (Plan)</text>

  <!-- 执行阶段 (Execute) Container -->
  <rect x="445" y="90" width="625" height="150" rx="12" fill="none" stroke="#5178c6" stroke-width="2" stroke-dasharray="6 4" />
  <text x="460" y="120" font-size="14" font-weight="bold" fill="#5178c6">执行阶段 (Execute)</text>

  <!-- Connectors / Flow Lines (Drawn before nodes to stay behind them) -->
  <!-- Main Flow -->
  <path d="M 125 180 L 165 180" stroke="#646a73" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 275 180 L 315 180" stroke="#646a73" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 425 180 L 465 180" stroke="#646a73" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 575 180 L 615 180" stroke="#646a73" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 725 180 L 770 180" stroke="#646a73" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 890 180 L 930 180" stroke="#646a73" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 1050 180 L 1095 180" stroke="#646a73" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Loop 1: New Info -> Replan -->
  <path d="M 830 140 L 830 50 L 260 50 L 260 150" stroke="#8569cb" stroke-width="1.5" fill="none" marker-end="url(#arrow-loop)" />

  <!-- Loop 2: Not Done -> Task List -->
  <path d="M 990 220 L 990 310 L 370 310 L 370 210" stroke="#646a73" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- Edge Labels -->
  <text x="910" y="172" font-size="12" fill="#646a73" text-anchor="middle">否</text>
  <text x="1072" y="172" font-size="12" fill="#646a73" text-anchor="middle">是</text>
  <text x="545" y="42" font-size="12" fill="#8569cb" text-anchor="middle">是 (遇到新信息，触发重规划)</text>
  <text x="680" y="302" font-size="12" fill="#646a73" text-anchor="middle">否 (继续执行下一任务)</text>

  <!-- Nodes -->
  <!-- N1: User Goal -->
  <rect x="15" y="150" width="110" height="60" rx="8" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="70" y="185" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">用户目标</text>

  <!-- N2: Planner -->
  <rect x="165" y="150" width="110" height="60" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="220" y="172" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">规划器</text>
  <text x="220" y="192" font-size="12" fill="#646a73" text-anchor="middle">分解并排期</text>

  <!-- N3: Task List -->
  <rect x="315" y="150" width="110" height="60" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="370" y="172" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">任务列表</text>
  <text x="370" y="192" font-size="12" fill="#646a73" text-anchor="middle">管理执行队列</text>

  <!-- N4: Executor -->
  <rect x="465" y="150" width="110" height="60" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="520" y="172" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">执行器</text>
  <text x="520" y="192" font-size="12" fill="#646a73" text-anchor="middle">调用具体工具</text>

  <!-- N5: Update State -->
  <rect x="615" y="150" width="110" height="60" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="670" y="172" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">更新状态</text>
  <text x="670" y="192" font-size="12" fill="#646a73" text-anchor="middle">记录执行反馈</text>

  <!-- N6: New Info? (Rhombus) -->
  <polygon points="770,180 830,140 890,180 830,220" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="830" y="184" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">遇到新信息?</text>

  <!-- N7: All Done? (Rhombus) -->
  <polygon points="930,180 990,140 1050,180 990,220" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="990" y="184" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">全部完成?</text>

  <!-- N8: Output -->
  <rect x="1095" y="150" width="110" height="60" rx="8" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="1150" y="185" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">汇总输出</text>
</svg>
