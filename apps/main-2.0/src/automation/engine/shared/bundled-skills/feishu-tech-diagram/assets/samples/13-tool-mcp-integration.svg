<svg width="1000" height="820" viewBox="0 0 1000 820" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 灰色箭头，用于主干流程连线 -->
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#bbbfc4" />
    </marker>
    <!-- 红色箭头，用于异常和降级连线 -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#d25d5a" />
    </marker>
  </defs>

  <!-- 图表标题 -->
  <text x="500" y="40" font-size="20" font-weight="bold" fill="#1f2329" text-anchor="middle">Agent Tool/MCP 接入时序流程</text>

  <!-- 泳道头部 (Headers) -->
  <!-- Agent 泳道 (紫色系) -->
  <rect x="50" y="80" width="280" height="40" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="190" y="105" font-size="16" font-weight="bold" fill="#8569cb" text-anchor="middle">Agent</text>

  <!-- MCP Client 泳道 (蓝色系) -->
  <rect x="360" y="80" width="280" height="40" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="500" y="105" font-size="16" font-weight="bold" fill="#5178c6" text-anchor="middle">MCP Client</text>

  <!-- Tool Server 泳道 (绿色系) -->
  <rect x="670" y="80" width="280" height="40" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="810" y="105" font-size="16" font-weight="bold" fill="#509863" text-anchor="middle">Tool Server</text>

  <!-- 泳道物理边界与协议边界分割线 -->
  <line x1="345" y1="130" x2="345" y2="760" stroke="#dee0e3" stroke-width="1.5" stroke-dasharray="4 4" />
  <line x1="655" y1="130" x2="655" y2="760" stroke="#dee0e3" stroke-width="1.5" stroke-dasharray="4 4" />

  <!-- ==================== Phase 1: 需求与定义 ==================== -->
  <line x1="50" y1="130" x2="950" y2="130" stroke="#dee0e3" stroke-width="1" stroke-dasharray="2 2" />
  <text x="50" y="150" font-size="14" font-weight="bold" fill="#646a73">Phase 1: 需求与定义</text>

  <!-- Row 1 (Y=170) -->
  <g>
    <rect x="100" y="170" width="180" height="44" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
    <text x="190" y="197" font-size="14" fill="#1f2329" text-anchor="middle">业务需求与场景</text>
  </g>
  <g>
    <rect x="720" y="170" width="180" height="44" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
    <text x="810" y="197" font-size="14" fill="#1f2329" text-anchor="middle">Tool 服务实现</text>
  </g>

  <!-- Row 2 (Y=240) -->
  <g>
    <rect x="410" y="240" width="180" height="44" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
    <text x="500" y="267" font-size="14" fill="#1f2329" text-anchor="middle">MCP Schema 定义</text>
  </g>
  <g>
    <rect x="720" y="240" width="180" height="44" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
    <text x="810" y="267" font-size="14" fill="#1f2329" text-anchor="middle">服务权限配置</text>
  </g>

  <!-- Phase 1 内部连线 -->
  <path d="M 190 214 L 190 227 L 500 227 L 500 234" stroke="#bbbfc4" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)" />
  <line x1="810" y1="214" x2="810" y2="234" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-gray)" />

  <!-- 跨 Phase 依赖连线 -->
  <line x1="500" y1="284" x2="500" y2="334" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <line x1="810" y1="284" x2="810" y2="334" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-gray)" />

  <!-- ==================== Phase 2: 工具注册与联调 ==================== -->
  <line x1="50" y1="300" x2="950" y2="300" stroke="#dee0e3" stroke-width="1" stroke-dasharray="2 2" />
  <text x="50" y="320" font-size="14" font-weight="bold" fill="#646a73">Phase 2: 工具注册与联调</text>

  <!-- Row 3 (Y=340) 工具注册流 -->
  <g>
    <rect x="720" y="340" width="180" height="44" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
    <text x="810" y="367" font-size="14" fill="#1f2329" text-anchor="middle">触发工具注册</text>
  </g>
  <g>
    <rect x="410" y="340" width="180" height="44" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
    <text x="500" y="367" font-size="14" fill="#1f2329" text-anchor="middle">解析与注册 Tool</text>
  </g>
  <g>
    <rect x="100" y="340" width="180" height="44" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
    <text x="190" y="367" font-size="14" fill="#1f2329" text-anchor="middle">加载 Tool 能力</text>
  </g>

  <!-- 工具注册横向连线 (从右向左) -->
  <line x1="720" y1="362" x2="600" y2="362" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <text x="660" y="354" font-size="12" fill="#646a73" text-anchor="middle">提交注册信息</text>

  <line x1="410" y1="362" x2="290" y2="362" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <text x="350" y="354" font-size="12" fill="#646a73" text-anchor="middle">暴露能力</text>

  <!-- Row 4 (Y=410) 联调流 -->
  <g>
    <rect x="100" y="410" width="180" height="44" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
    <text x="190" y="437" font-size="14" fill="#1f2329" text-anchor="middle">发起联调验证</text>
  </g>
  <g>
    <rect x="410" y="410" width="180" height="44" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
    <text x="500" y="437" font-size="14" fill="#1f2329" text-anchor="middle">转发与日志记录</text>
  </g>
  <g>
    <rect x="720" y="410" width="180" height="44" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
    <text x="810" y="437" font-size="14" fill="#1f2329" text-anchor="middle">响应验证请求</text>
  </g>

  <!-- 联调横向连线 (从左向右) -->
  <line x1="280" y1="432" x2="400" y2="432" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <text x="340" y="424" font-size="12" fill="#646a73" text-anchor="middle">测试调用</text>

  <line x1="590" y1="432" x2="710" y2="432" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <text x="650" y="424" font-size="12" fill="#646a73" text-anchor="middle">RPC / HTTP</text>


  <!-- ==================== Phase 3: 运行期调用 ==================== -->
  <line x1="50" y1="470" x2="950" y2="470" stroke="#dee0e3" stroke-width="1" stroke-dasharray="2 2" />
  <text x="50" y="490" font-size="14" font-weight="bold" fill="#646a73">Phase 3: 运行期交互</text>

  <!-- Row 5 (Y=510) Request -->
  <g>
    <rect x="100" y="510" width="180" height="44" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
    <text x="190" y="537" font-size="14" fill="#1f2329" text-anchor="middle">发起 Tool 调用</text>
  </g>
  <g>
    <rect x="410" y="510" width="180" height="44" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
    <text x="500" y="537" font-size="14" fill="#1f2329" text-anchor="middle">协议校验与路由</text>
  </g>
  <g>
    <rect x="720" y="510" width="180" height="44" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
    <text x="810" y="537" font-size="14" fill="#1f2329" text-anchor="middle">执行核心逻辑</text>
  </g>

  <!-- 正常请求横向连线 (从左向右) -->
  <line x1="280" y1="532" x2="400" y2="532" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <text x="340" y="524" font-size="12" fill="#646a73" text-anchor="middle">Invoke Tool</text>

  <line x1="590" y1="532" x2="710" y2="532" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <text x="650" y="524" font-size="12" fill="#646a73" text-anchor="middle">转发执行</text>


  <!-- Row 6 (Y=580) Response -->
  <g>
    <rect x="720" y="580" width="180" height="44" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
    <text x="810" y="607" font-size="14" fill="#1f2329" text-anchor="middle">正常返回结果</text>
  </g>
  <g>
    <rect x="410" y="580" width="180" height="44" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
    <text x="500" y="607" font-size="14" fill="#1f2329" text-anchor="middle">格式化响应</text>
  </g>
  <g>
    <rect x="100" y="580" width="180" height="44" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
    <text x="190" y="607" font-size="14" fill="#1f2329" text-anchor="middle">消费响应数据</text>
  </g>

  <!-- 正常响应横向连线 (从右向左) -->
  <line x1="720" y1="602" x2="600" y2="602" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <text x="660" y="594" font-size="12" fill="#646a73" text-anchor="middle">Response</text>

  <line x1="410" y1="602" x2="290" y2="602" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <text x="350" y="594" font-size="12" fill="#646a73" text-anchor="middle">返回标准结果</text>


  <!-- ==================== Phase 4: 容错与降级 ==================== -->
  <line x1="50" y1="640" x2="950" y2="640" stroke="#dee0e3" stroke-width="1" stroke-dasharray="2 2" />
  <text x="50" y="660" font-size="14" font-weight="bold" fill="#d25d5a">Phase 4: 容错与降级</text>

  <!-- Row 7 (Y=680) Error & Fallback -->
  <!-- 错误处理 (黄色警示) -->
  <g>
    <rect x="410" y="680" width="180" height="44" rx="6" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
    <text x="500" y="707" font-size="14" fill="#1f2329" text-anchor="middle">超时错误处理</text>
  </g>
  <!-- 降级策略 (红色预警) -->
  <g>
    <rect x="100" y="680" width="180" height="44" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
    <text x="190" y="707" font-size="14" fill="#1f2329" text-anchor="middle">触发降级策略</text>
  </g>

  <!-- 容错分支垂线 (协议校验与路由 -> 超时错误处理) -->
  <line x1="500" y1="554" x2="500" y2="674" stroke="#d25d5a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-red)" />
  <text x="508" y="610" font-size="12" fill="#d25d5a">等待请求超时</text>
  <text x="508" y="626" font-size="12" fill="#d25d5a">触发异常流程</text>

  <!-- 降级连线 (从右向左) -->
  <line x1="410" y1="702" x2="290" y2="702" stroke="#d25d5a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow-red)" />
  <text x="350" y="694" font-size="12" fill="#d25d5a" text-anchor="middle">返回 Error 状态</text>
</svg>
