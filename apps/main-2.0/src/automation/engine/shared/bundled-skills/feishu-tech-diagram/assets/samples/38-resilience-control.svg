<svg width="1300" height="650" viewBox="0 0 1300 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 通用箭头标记 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#646a73" />
    </marker>
  </defs>

  <!-- 全局背景 -->
  <rect width="1300" height="650" fill="#ffffff" />

  <!-- 标题与描述 -->
  <text x="40" y="50" font-size="22" fill="#1f2329" font-weight="bold">服务韧性控制流程 (Service Resiliency Control)</text>
  <text x="40" y="75" font-size="14" fill="#8f959e">容量检查 · 依赖监控 · 熔断降级</text>

  <!-- ==================== 区域：熔断状态机 (Dashed Box) ==================== -->
  <rect x="690" y="470" width="560" height="150" fill="none" stroke="#bbbfc4" stroke-width="2" stroke-dasharray="6 4" rx="8" />
  <text x="705" y="495" font-size="14" fill="#8f959e" font-weight="bold">熔断状态机 (Circuit Breaker)</text>

  <!-- ==================== 连线与分支路由 ==================== -->
  <!-- 外部请求 -> 容量检查 -->
  <line x1="140" y1="250" x2="160" y2="250" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 容量检查 -> 限流 (分支：否) -->
  <polyline points="250,210 250,145 710,145" fill="none" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="480" y="135" font-size="12" fill="#8f959e" text-anchor="middle">否 (请求超限)</text>

  <!-- 容量检查 -> 依赖健康检查 (分支：是) -->
  <line x1="330" y1="250" x2="430" y2="250" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="380" y="240" font-size="12" fill="#8f959e" text-anchor="middle">是 (充足)</text>

  <!-- 依赖健康检查 -> 放行 (分支：是) -->
  <line x1="600" y1="250" x2="710" y2="250" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="655" y="240" font-size="12" fill="#8f959e" text-anchor="middle">是 (健康)</text>

  <!-- 依赖健康检查 向下主干线 (分支：否) -->
  <line x1="520" y1="290" x2="520" y2="535" stroke="#646a73" stroke-width="1.5" />

  <!-- 依赖异常 -> 降级 -->
  <line x1="520" y1="405" x2="710" y2="405" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="615" y="395" font-size="12" fill="#8f959e" text-anchor="middle">否 (非核心依赖异常)</text>

  <!-- 依赖异常 -> 熔断 -->
  <line x1="520" y1="535" x2="710" y2="535" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="615" y="525" font-size="12" fill="#8f959e" text-anchor="middle">否 (核心依赖异常)</text>

  <!-- 熔断 -> 半开探测 -->
  <line x1="840" y1="535" x2="910" y2="535" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="875" y="525" font-size="12" fill="#8f959e" text-anchor="middle">熔断期满</text>

  <!-- 半开探测 -> 恢复 (成功) -->
  <line x1="1040" y1="535" x2="1110" y2="535" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="1075" y="525" font-size="12" fill="#8f959e" text-anchor="middle">探测成功</text>

  <!-- 半开探测 -> 熔断 (失败，回流反馈线) -->
  <polyline points="980,560 980,600 780,600 780,560" fill="none" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="880" y="590" font-size="12" fill="#8f959e" text-anchor="middle">探测失败 (继续阻断)</text>


  <!-- ==================== 节点：核心业务流 ==================== -->

  <!-- 节点：外部请求 -->
  <rect x="40" y="230" width="100" height="40" rx="20" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="90" y="255" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">外部请求</text>

  <!-- 节点：容量检查 (菱形决策) -->
  <polygon points="250,210 330,250 250,290 170,250" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="250" y="245" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">容量充足？</text>
  <text x="250" y="263" font-size="12" fill="#8f959e" text-anchor="middle">Capacity</text>

  <!-- 节点：依赖健康检查 (菱形决策) -->
  <polygon points="520,210 600,250 520,290 440,250" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="520" y="245" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">依赖健康？</text>
  <text x="520" y="263" font-size="12" fill="#8f959e" text-anchor="middle">Health</text>


  <!-- ==================== 节点：策略执行结果 ==================== -->

  <!-- 节点：限流 -->
  <rect x="720" y="120" width="120" height="50" rx="6" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="780" y="140" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">限流</text>
  <text x="780" y="156" font-size="12" fill="#d48e5b" text-anchor="middle">Rate Limit</text>

  <!-- 节点：放行 -->
  <rect x="720" y="225" width="120" height="50" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="780" y="245" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">正常放行</text>
  <text x="780" y="261" font-size="12" fill="#509863" text-anchor="middle">Pass</text>

  <!-- 节点：降级 -->
  <rect x="720" y="380" width="120" height="50" rx="6" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="780" y="400" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">降级</text>
  <text x="780" y="416" font-size="12" fill="#d48e5b" text-anchor="middle">Fallback</text>


  <!-- ==================== 节点：熔断状态流转 ==================== -->

  <!-- 节点：熔断 (Open) -->
  <rect x="720" y="510" width="120" height="50" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
  <text x="780" y="530" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">熔断</text>
  <text x="780" y="546" font-size="12" fill="#d25d5a" text-anchor="middle">Open State</text>

  <!-- 节点：半开探测 (Half-Open) -->
  <rect x="920" y="510" width="120" height="50" rx="6" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="980" y="530" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">半开探测</text>
  <text x="980" y="546" font-size="12" fill="#d48e5b" text-anchor="middle">Half-Open</text>

  <!-- 节点：恢复 (Closed) -->
  <rect x="1120" y="510" width="100" height="50" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="1170" y="530" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">恢复</text>
  <text x="1170" y="546" font-size="12" fill="#509863" text-anchor="middle">Closed State</text>

</svg>
