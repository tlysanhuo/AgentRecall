<svg width="1320" height="460" viewBox="0 0 1320 460" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 标准单向箭头 (用于主流程) -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 2 2 L 8 5 L 2 8 Z" fill="#646a73" />
    </marker>
    <!-- 反向箭头 (用于双向数据流的起点) -->
    <marker id="arrow-rev" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 2 L 2 5 L 8 8 Z" fill="#646a73" />
    </marker>
  </defs>

  <!-- ================= 核心处理层 (背景容器) ================= -->
  <!-- 第 1 组 (紫色): 核心容器 -->
  <rect x="340" y="60" width="620" height="340" rx="12" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="360" y="95" font-size="16" font-weight="bold" fill="#8569cb">核心内部处理模块组 (Core Engine)</text>
  <text x="360" y="115" font-size="12" fill="#8569cb">提供隔离的计算环境，各阶段模块解耦并共享上下文状态</text>

  <!-- ================= 主链路节点 ================= -->

  <!-- 第 4 组 (绿色): 原始输入 -->
  <rect x="40" y="140" width="100" height="80" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="90" y="175" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">原始输入</text>
  <text x="90" y="195" font-size="12" fill="#1f2329" text-anchor="middle">Raw Data</text>

  <!-- 第 6 组 (粉色): 预处理 -->
  <rect x="180" y="140" width="120" height="80" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
  <text x="240" y="175" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">预处理</text>
  <text x="240" y="195" font-size="12" fill="#1f2329" text-anchor="middle">参数清洗与校验</text>

  <!-- 第 2 组 (浅蓝): 核心内部模块 A, B, C -->
  <rect x="370" y="140" width="110" height="80" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="425" y="175" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">阶段 I: 解析</text>
  <text x="425" y="195" font-size="12" fill="#1f2329" text-anchor="middle">结构化重组</text>

  <rect x="510" y="140" width="110" height="80" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="565" y="175" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">阶段 II: 计算</text>
  <text x="565" y="195" font-size="12" fill="#1f2329" text-anchor="middle">核心业务逻辑</text>

  <rect x="650" y="140" width="110" height="80" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="705" y="175" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">阶段 III: 转换</text>
  <text x="705" y="195" font-size="12" fill="#1f2329" text-anchor="middle">产物协议适配</text>

  <!-- 独立节点 (核心区出口): 中间结果 (使用白色以示数据产物) -->
  <rect x="790" y="140" width="140" height="220" rx="6" fill="#ffffff" stroke="#8569cb" stroke-width="1.5" stroke-dasharray="4 4" />
  <text x="860" y="235" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">中间结果</text>
  <text x="860" y="255" font-size="12" fill="#1f2329" text-anchor="middle">Intermediate</text>
  <text x="860" y="275" font-size="12" fill="#1f2329" text-anchor="middle">Data Snapshot</text>

  <!-- 第 3 组 (灰蓝): 共享状态 -->
  <rect x="370" y="280" width="390" height="80" rx="6" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
  <text x="565" y="315" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">共享状态字典 (Shared Context / State)</text>
  <text x="565" y="335" font-size="12" fill="#1f2329" text-anchor="middle">提供跨模块的实时数据共享、缓存支持与状态追踪</text>

  <!-- 第 6 组 (粉色): 后处理 -->
  <rect x="1000" y="140" width="120" height="80" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
  <text x="1060" y="175" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">后处理</text>
  <text x="1060" y="195" font-size="12" fill="#1f2329" text-anchor="middle">结果过滤与封装</text>

  <!-- 第 4 组 (绿色): 最终输出 -->
  <rect x="1160" y="140" width="100" height="80" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="1210" y="175" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">最终输出</text>
  <text x="1210" y="195" font-size="12" fill="#1f2329" text-anchor="middle">Final Result</text>

  <!-- ================= 第 5 组 (黄色): 侧边标注带 (关键不变量) ================= -->
  <rect x="1000" y="240" width="260" height="160" rx="8" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="1020" y="275" font-size="15" font-weight="bold" fill="#1f2329">关键不变量 (Key Invariants)</text>
  <line x1="1020" y1="290" x2="1240" y2="290" stroke="#d4b45b" stroke-width="1" />

  <text x="1020" y="320" font-size="13" fill="#1f2329">1. 状态一致性保证</text>
  <text x="1035" y="340" font-size="12" fill="#646a73">事务隔离，确保失败时数据回滚</text>

  <text x="1020" y="365" font-size="13" fill="#1f2329">2. 数据流严格单向</text>
  <text x="1035" y="385" font-size="12" fill="#646a73">控制流不可逆，降低耦合复杂度</text>

  <!-- ================= 连线与路由 ================= -->

  <!-- 1. 主干串行数据流连线 -->
  <line x1="140" y1="180" x2="172" y2="180" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="160" y="170" font-size="12" fill="#8f959e" text-anchor="middle">进入</text>

  <line x1="300" y1="180" x2="362" y2="180" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="331" y="170" font-size="12" fill="#8f959e" text-anchor="middle">分发调度</text>

  <line x1="480" y1="180" x2="502" y2="180" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="620" y1="180" x2="642" y2="180" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />

  <line x1="760" y1="180" x2="782" y2="180" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="771" y="170" font-size="12" fill="#8f959e" text-anchor="middle">聚合</text>

  <line x1="930" y1="180" x2="992" y2="180" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="961" y="170" font-size="12" fill="#8f959e" text-anchor="middle">提取产物</text>

  <line x1="1120" y1="180" x2="1152" y2="180" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="1136" y="170" font-size="12" fill="#8f959e" text-anchor="middle">响应</text>

  <!-- 2. 模块与共享状态的双向虚线交互 -->
  <!-- 模块 A -->
  <line x1="425" y1="228" x2="425" y2="272" stroke="#646a73" stroke-width="1.5" stroke-dasharray="4 4" marker-start="url(#arrow-rev)" marker-end="url(#arrow)" />
  <text x="415" y="254" font-size="11" fill="#8f959e" text-anchor="end">读/写</text>

  <!-- 模块 B -->
  <line x1="565" y1="228" x2="565" y2="272" stroke="#646a73" stroke-width="1.5" stroke-dasharray="4 4" marker-start="url(#arrow-rev)" marker-end="url(#arrow)" />
  <text x="555" y="254" font-size="11" fill="#8f959e" text-anchor="end">读/写</text>

  <!-- 模块 C -->
  <line x1="705" y1="228" x2="705" y2="272" stroke="#646a73" stroke-width="1.5" stroke-dasharray="4 4" marker-start="url(#arrow-rev)" marker-end="url(#arrow)" />
  <text x="695" y="254" font-size="11" fill="#8f959e" text-anchor="end">读/写</text>

  <!-- 3. 状态快照同步到中间结果 -->
  <line x1="760" y1="320" x2="782" y2="320" stroke="#646a73" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <text x="771" y="312" font-size="11" fill="#8f959e" text-anchor="middle">更新</text>

</svg>
