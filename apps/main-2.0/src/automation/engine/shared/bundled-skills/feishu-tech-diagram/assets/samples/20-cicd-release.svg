<svg width="1580" height="640" viewBox="0 0 1580 640" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Arrow Markers -->
  <defs>
    <!-- Main Trunk Flow Arrow -->
    <marker id="arrow-main" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bbbfc4" />
    </marker>
    <!-- Data/Artifact Bus Arrow -->
    <marker id="arrow-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8569cb" />
    </marker>
    <!-- Feedback/Reject Arrow -->
    <marker id="arrow-reject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d25d5a" />
    </marker>
  </defs>

  <!-- ==================== BACKGROUNDS & ZONES ==================== -->

  <!-- CI (Continuous Integration) Zone -->
  <rect x="30" y="80" width="580" height="460" rx="12" fill="#f0f4fc" />
  <text x="60" y="125" fill="#5178c6" font-size="20" font-weight="bold">持续集成阶段 (Continuous Integration)</text>
  <text x="60" y="145" fill="#5263a5" font-size="12">代码提交 -> 构建 -> 自动化测试 -> 安全扫描</text>

  <!-- CD (Continuous Deployment) Zone -->
  <rect x="820" y="80" width="730" height="460" rx="12" fill="#eae2fe" />
  <text x="850" y="125" fill="#8569cb" font-size="20" font-weight="bold">持续部署阶段 (Continuous Deployment)</text>
  <text x="850" y="145" fill="#8569cb" font-size="12">部署测试 -> UAT验收 -> 小流量灰度 -> 全量发布</text>

  <!-- ==================== ARTIFACT HERO CONTAINER ==================== -->
  <!-- Surrounding dashed container to emphasize "Single Source of Truth" -->
  <rect x="640" y="190" width="160" height="200" rx="12" fill="#ffffff" stroke="#8569cb" stroke-width="2" stroke-dasharray="6,4" />
  <rect x="670" y="206" width="100" height="24" rx="4" fill="#eae2fe" />
  <text x="720" y="223" fill="#8569cb" font-size="12" font-weight="bold" text-anchor="middle">核心枢纽节点</text>

  <!-- ==================== MAIN PIPELINE CONNECTIONS (CONTROL FLOW) ==================== -->
  <path d="M 160 320 L 192 320" fill="none" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow-main)" />
  <path d="M 300 320 L 332 320" fill="none" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow-main)" />
  <path d="M 440 320 L 472 320" fill="none" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow-main)" />
  <path d="M 580 320 L 632 320" fill="none" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow-main)" />
  <!-- Arrow from Artifact Container to Deploy Test -->
  <path d="M 800 320 L 852 320" fill="none" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow-main)" />
  <text x="826" y="312" fill="#646a73" font-size="12" text-anchor="middle">触发</text>

  <path d="M 960 320 L 992 320" fill="none" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow-main)" />

  <path d="M 1100 320 L 1142 320" fill="none" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow-main)" />
  <text x="1121" y="312" fill="#509863" font-size="12" text-anchor="middle" font-weight="bold">通过</text>

  <path d="M 1250 320 L 1282 320" fill="none" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow-main)" />

  <path d="M 1390 320 L 1422 320" fill="none" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow-main)" />
  <text x="1406" y="312" fill="#509863" font-size="12" text-anchor="middle" font-weight="bold">达标扩量</text>


  <!-- ==================== ARTIFACT DATA DISTRIBUTION BUS (TOP) ==================== -->
  <!-- Top horizontal bus line -->
  <path d="M 720 270 L 720 160 L 1480 160 L 1480 282" fill="none" stroke="#8569cb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-data)" />
  <!-- Drop to Deploy Test -->
  <path d="M 910 160 L 910 282" fill="none" stroke="#8569cb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-data)" />
  <!-- Drop to Canary -->
  <path d="M 1200 160 L 1200 282" fill="none" stroke="#8569cb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-data)" />

  <!-- Bus Label Pill -->
  <rect x="1000" y="148" width="160" height="24" rx="12" fill="#8569cb" />
  <text x="1080" y="165" fill="#ffffff" font-size="12" text-anchor="middle" font-weight="bold">部署相同制品 (Pull Artifact)</text>


  <!-- ==================== FEEDBACK / REJECT BUS (BOTTOM) ==================== -->
  <!-- Monitor Rollback path -->
  <path d="M 1340 360 L 1340 480 L 110 480 L 110 358" fill="none" stroke="#d25d5a" stroke-width="2" marker-end="url(#arrow-reject)" />
  <!-- UAT Reject merging path -->
  <path d="M 1050 360 L 1050 480" fill="none" stroke="#d25d5a" stroke-width="2" />

  <!-- Reject/Rollback Labels -->
  <rect x="1350" y="405" width="70" height="24" rx="4" fill="#ffffff" stroke="#d25d5a" stroke-width="1" />
  <text x="1385" y="422" fill="#d25d5a" font-size="12" text-anchor="middle">指标异常</text>

  <rect x="1065" y="405" width="80" height="24" rx="4" fill="#ffffff" stroke="#d25d5a" stroke-width="1" />
  <text x="1105" y="422" fill="#d25d5a" font-size="12" text-anchor="middle">验收不通过</text>

  <!-- Return Bus Label -->
  <rect x="530" y="468" width="160" height="24" rx="4" fill="#ffffff" stroke="#d25d5a" stroke-width="1" />
  <text x="610" y="485" fill="#d25d5a" font-size="12" font-weight="bold" text-anchor="middle">代码回滚与重新触发修复</text>


  <!-- ==================== PIPELINE NODES ==================== -->

  <!-- C1: Commit -->
  <rect x="60" y="290" width="100" height="60" rx="8" fill="#5178c6" />
  <text x="110" y="315" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">代码提交</text>
  <text x="110" y="335" fill="#ffffff" font-size="12" text-anchor="middle">Commit</text>

  <!-- C2: Build -->
  <rect x="200" y="290" width="100" height="60" rx="8" fill="#5178c6" />
  <text x="250" y="315" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">项目构建</text>
  <text x="250" y="335" fill="#ffffff" font-size="12" text-anchor="middle">Build</text>

  <!-- C3: Unit Test -->
  <rect x="340" y="290" width="100" height="60" rx="8" fill="#5178c6" />
  <text x="390" y="315" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">单元测试</text>
  <text x="390" y="335" fill="#ffffff" font-size="12" text-anchor="middle">Unit Test</text>

  <!-- C4: Security Scan -->
  <rect x="480" y="290" width="100" height="60" rx="8" fill="#5178c6" />
  <text x="530" y="315" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">安全扫描</text>
  <text x="530" y="335" fill="#ffffff" font-size="12" text-anchor="middle">Sec Scan</text>

  <!-- C5: UNIQUE ARTIFACT (HERO NODE) -->
  <!-- 3D offset drop-shadow for emphasis -->
  <rect x="664" y="284" width="120" height="80" rx="8" fill="#eae2fe" />
  <rect x="660" y="280" width="120" height="80" rx="8" fill="#8569cb" />
  <text x="720" y="310" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">唯一制品</text>
  <text x="720" y="330" fill="#ffffff" font-size="12" text-anchor="middle">Artifact</text>
  <text x="720" y="348" fill="#eae2fe" font-size="10" text-anchor="middle">不可重复构建</text>

  <!-- C6: Deploy Test Env -->
  <rect x="860" y="290" width="100" height="60" rx="8" fill="#5178c6" />
  <text x="910" y="315" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">部署测试</text>
  <text x="910" y="335" fill="#ffffff" font-size="12" text-anchor="middle">Test Env</text>

  <!-- GATE 1: UAT (Diamond Node) -->
  <!-- Center: 1050, 320. Width: 100, Height: 80 -->
  <polygon points="1050,280 1100,320 1050,360 1000,320" fill="#fef1ce" stroke="#d4b45b" stroke-width="2" />
  <text x="1050" y="316" fill="#1f2329" font-size="14" font-weight="bold" text-anchor="middle">验收通过?</text>
  <text x="1050" y="334" fill="#1f2329" font-size="12" text-anchor="middle">UAT Gate</text>

  <!-- C7: Canary Release -->
  <rect x="1150" y="290" width="100" height="60" rx="8" fill="#5178c6" />
  <text x="1200" y="315" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">灰度发布</text>
  <text x="1200" y="335" fill="#ffffff" font-size="12" text-anchor="middle">Canary</text>

  <!-- GATE 2: Metric Monitor (Diamond Node) -->
  <!-- Center: 1340, 320. Width: 100, Height: 80 -->
  <polygon points="1340,280 1390,320 1340,360 1290,320" fill="#fef1ce" stroke="#d4b45b" stroke-width="2" />
  <text x="1340" y="316" fill="#1f2329" font-size="14" font-weight="bold" text-anchor="middle">指标正常?</text>
  <text x="1340" y="334" fill="#1f2329" font-size="12" text-anchor="middle">Monitor</text>

  <!-- C8: Full Rollout -->
  <rect x="1430" y="290" width="100" height="60" rx="8" fill="#509863" />
  <text x="1480" y="315" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">全量发布</text>
  <text x="1480" y="335" fill="#ffffff" font-size="12" text-anchor="middle">Rollout</text>

</svg>
