<svg width="1160" height="600" viewBox="0 0 1160 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for Arrow Markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#bbbfc4" />
    </marker>
  </defs>

  <!-- Global Background -->
  <rect width="1160" height="600" fill="#ffffff" />

  <!-- Diagram Title -->
  <text x="40" y="40" font-size="20" font-weight="bold" fill="#1f2329">系统级架构选型决策树</text>
  <text x="40" y="60" font-size="12" fill="#646a73">通过评估业务规模、一致性、实时性与运维成本，推导最适配的架构形态</text>

  <!-- ======================== -->
  <!-- 连线路径 (Paths)         -->
  <!-- ======================== -->

  <!-- 1. 规模与复杂度 -> 一致性要求 -->
  <polyline points="170,252 170,130 332,130" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 2. 规模与复杂度 -> 团队经验与运维 -->
  <polyline points="170,308 170,460 332,460" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 3. 一致性要求 -> 方案 A -->
  <line x1="480" y1="130" x2="852" y2="130" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 4. 一致性要求 -> 实时性要求 -->
  <polyline points="410,158 410,280 572,280" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 5. 实时性要求 -> 方案 B -->
  <line x1="720" y1="280" x2="852" y2="280" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 6. 实时性要求 -> 方案 C -->
  <polyline points="650,308 650,440 852,440" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 7. 团队经验与运维 -> 方案 C -->
  <line x1="480" y1="460" x2="852" y2="460" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 8. 团队经验与运维 -> 方案 B -->
  <polyline points="410,432 410,320 852,320" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />


  <!-- ======================== -->
  <!-- 路径标签 (带有白色背景遮盖) -->
  <!-- ======================== -->

  <!-- Path 1 Label -->
  <rect x="190" y="118" width="110" height="24" fill="#ffffff" />
  <text x="245" y="134" font-size="12" fill="#646a73" text-anchor="middle">极高 / 核心链路</text>

  <!-- Path 2 Label -->
  <rect x="190" y="448" width="110" height="24" fill="#ffffff" />
  <text x="245" y="464" font-size="12" fill="#646a73" text-anchor="middle">中低 / 敏捷业务</text>

  <!-- Path 3 Label -->
  <rect x="610" y="118" width="130" height="24" fill="#ffffff" />
  <text x="675" y="134" font-size="12" fill="#646a73" text-anchor="middle">要求强一致 (事务级)</text>

  <!-- Path 4 Label -->
  <rect x="430" y="268" width="120" height="24" fill="#ffffff" />
  <text x="490" y="284" font-size="12" fill="#646a73" text-anchor="middle">允许最终一致性</text>

  <!-- Path 5 Label -->
  <rect x="735" y="268" width="100" height="24" fill="#ffffff" />
  <text x="785" y="284" font-size="12" fill="#646a73" text-anchor="middle">毫秒级极速</text>

  <!-- Path 6 Label -->
  <rect x="710" y="428" width="110" height="24" fill="#ffffff" />
  <text x="765" y="444" font-size="12" fill="#646a73" text-anchor="middle">宽容 / 秒级离线</text>

  <!-- Path 7 Label -->
  <rect x="610" y="448" width="130" height="24" fill="#ffffff" />
  <text x="675" y="464" font-size="12" fill="#646a73" text-anchor="middle">无专职运维 / 求托管</text>

  <!-- Path 8 Label -->
  <rect x="480" y="308" width="120" height="24" fill="#ffffff" />
  <text x="540" y="324" font-size="12" fill="#646a73" text-anchor="middle">资深团队 / 强自控</text>


  <!-- ======================== -->
  <!-- 决策节点 (Decision Nodes) -->
  <!-- ======================== -->

  <!-- N1: 规模与复杂度 -->
  <rect x="100" y="252" width="140" height="56" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="170" y="285" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">规模与复杂度</text>

  <!-- N2: 一致性要求 -->
  <rect x="340" y="102" width="140" height="56" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="410" y="135" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">一致性要求</text>

  <!-- N3: 实时性要求 -->
  <rect x="580" y="252" width="140" height="56" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="650" y="285" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">实时性要求</text>

  <!-- N4: 团队经验与运维 -->
  <rect x="340" y="432" width="140" height="56" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="410" y="465" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">团队经验与运维</text>


  <!-- ======================== -->
  <!-- 叶子节点 (Leaf Nodes)      -->
  <!-- ======================== -->

  <!-- 方案 A：强基建高可用架构 -->
  <g>
    <rect x="860" y="60" width="260" height="140" rx="6" fill="#ffffff" stroke="#bbbfc4" stroke-width="1.5" />
    <line x1="860" y1="96" x2="1120" y2="96" stroke="#dee0e3" stroke-width="1" />
    <text x="990" y="83" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">方案 A：强基建高可用架构</text>

    <circle cx="876" cy="116" r="3" fill="#5178c6" />
    <text x="886" y="120" font-size="12" fill="#1f2329">适用：金融交易 / 零丢数据核心系统</text>

    <circle cx="876" cy="136" r="3" fill="#5178c6" />
    <text x="886" y="140" font-size="12" fill="#1f2329">适用：团队具备深厚底座运维经验</text>

    <circle cx="876" cy="164" r="3" fill="#d25d5a" />
    <text x="886" y="168" font-size="12" fill="#646a73">风险：基础设施成本偏高</text>

    <circle cx="876" cy="184" r="3" fill="#d25d5a" />
    <text x="886" y="188" font-size="12" fill="#646a73">风险：重度耦合架构，扩容周期较长</text>
  </g>

  <!-- 方案 B：高性能实时架构 -->
  <g>
    <rect x="860" y="210" width="260" height="140" rx="6" fill="#ffffff" stroke="#bbbfc4" stroke-width="1.5" />
    <line x1="860" y1="246" x2="1120" y2="246" stroke="#dee0e3" stroke-width="1" />
    <text x="990" y="233" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">方案 B：高性能实时架构</text>

    <circle cx="876" cy="266" r="3" fill="#5178c6" />
    <text x="886" y="270" font-size="12" fill="#1f2329">适用：读写吞吐极高 / 延迟极度敏感</text>

    <circle cx="876" cy="286" r="3" fill="#5178c6" />
    <text x="886" y="290" font-size="12" fill="#1f2329">适用：允许阶段性数据不一致</text>

    <circle cx="876" cy="314" r="3" fill="#d25d5a" />
    <text x="886" y="318" font-size="12" fill="#646a73">风险：引入过多组件，排查链路拉长</text>

    <circle cx="876" cy="334" r="3" fill="#d25d5a" />
    <text x="886" y="338" font-size="12" fill="#646a73">风险：极端下需应用层手动对齐数据</text>
  </g>

  <!-- 方案 C：轻量级托管架构 -->
  <g>
    <rect x="860" y="390" width="260" height="140" rx="6" fill="#ffffff" stroke="#bbbfc4" stroke-width="1.5" />
    <line x1="860" y1="426" x2="1120" y2="426" stroke="#dee0e3" stroke-width="1" />
    <text x="990" y="413" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">方案 C：轻量级托管架构</text>

    <circle cx="876" cy="446" r="3" fill="#5178c6" />
    <text x="886" y="450" font-size="12" fill="#1f2329">适用：业务快速试错 / 结构迭代频繁</text>

    <circle cx="876" cy="466" r="3" fill="#5178c6" />
    <text x="886" y="470" font-size="12" fill="#1f2329">适用：无专职运维，追求极速上线</text>

    <circle cx="876" cy="494" r="3" fill="#d25d5a" />
    <text x="886" y="498" font-size="12" fill="#646a73">风险：深度绑定特定厂商 Serverless 生态</text>

    <circle cx="876" cy="514" r="3" fill="#d25d5a" />
    <text x="886" y="518" font-size="12" fill="#646a73">风险：遇底层疑难杂症时排查受限</text>
  </g>

</svg>
