<svg width="820" height="540" viewBox="0 0 820 540" fill="#ffffff" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 默认连线箭头 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#646a73" />
    </marker>
    <!-- 重试连线高亮箭头 -->
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#8569cb" />
    </marker>
  </defs>

  <!-- 全局标题 -->
  <text x="40" y="44" font-size="18" font-weight="bold" fill="#1f2329">任务生命周期状态机</text>

  <!-- ================= 核心流转连线 ================= -->
  <!-- 1. Created -> Running (开始) -->
  <line x1="200" y1="280" x2="320" y2="280" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 2. Running -> Waiting (等待外部结果) -->
  <line x1="360" y1="254" x2="360" y2="146" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 3. Waiting -> Running (收到结果) -->
  <line x1="420" y1="146" x2="420" y2="254" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 4. Running -> Succeeded (执行成功) -->
  <line x1="460" y1="280" x2="620" y2="280" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 5. Waiting -> Failed (超时) -->
  <line x1="460" y1="120" x2="620" y2="120" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 6. Running -> Failed (执行失败) -->
  <polyline points="460,265 560,265 560,140 620,140" stroke="#646a73" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- 7. Running -> Cancelled (取消) -->
  <polyline points="460,295 540,295 540,440 620,440" stroke="#646a73" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- ================= 独立高亮重试回边 ================= -->
  <!-- 8. Failed -> Running (重试) -->
  <path d="M 690 94 L 690 60 Q 690 50 680 50 L 270 50 Q 260 50 260 60 L 260 255 Q 260 265 270 265 L 320 265" stroke="#8569cb" stroke-width="2" fill="none" marker-end="url(#arrow-purple)" />

  <!-- ================= 连线标签与防穿字背景 ================= -->
  <rect x="240" y="268" width="32" height="24" rx="4" fill="#ffffff" />
  <text x="256" y="284" font-size="12" fill="#646a73" text-anchor="middle">开始</text>

  <rect x="320" y="192" width="80" height="24" rx="4" fill="#ffffff" />
  <text x="360" y="208" font-size="12" fill="#646a73" text-anchor="middle">等待外部结果</text>

  <rect x="392" y="192" width="56" height="24" rx="4" fill="#ffffff" />
  <text x="420" y="208" font-size="12" fill="#646a73" text-anchor="middle">收到结果</text>

  <rect x="508" y="268" width="56" height="24" rx="4" fill="#ffffff" />
  <text x="536" y="284" font-size="12" fill="#646a73" text-anchor="middle">执行成功</text>

  <rect x="520" y="108" width="32" height="24" rx="4" fill="#ffffff" />
  <text x="536" y="124" font-size="12" fill="#646a73" text-anchor="middle">超时</text>

  <rect x="532" y="190" width="56" height="24" rx="4" fill="#ffffff" />
  <text x="560" y="206" font-size="12" fill="#646a73" text-anchor="middle">执行失败</text>

  <rect x="524" y="355" width="32" height="24" rx="4" fill="#ffffff" />
  <text x="540" y="371" font-size="12" fill="#646a73" text-anchor="middle">取消</text>

  <rect x="459" y="38" width="32" height="24" rx="4" fill="#ffffff" />
  <text x="475" y="54" font-size="13" font-weight="bold" fill="#8569cb" text-anchor="middle">重试</text>

  <!-- ================= 状态机节点 ================= -->
  <!-- 左侧：起点状态 -->
  <g>
    <rect x="60" y="254" width="140" height="52" rx="6" fill="#f5f5f5" stroke="#bbbfc4" stroke-width="1.5" />
    <text x="130" y="285" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Created</text>
  </g>

  <!-- 中间：核心活跃状态 -->
  <g>
    <rect x="320" y="254" width="140" height="52" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
    <text x="390" y="285" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Running</text>
  </g>

  <!-- 正上方：异步等待状态（浅紫色提亮） -->
  <g>
    <rect x="320" y="94" width="140" height="52" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
    <text x="390" y="125" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Waiting</text>
  </g>

  <!-- 右侧纵向：终态集群（加粗边框强化语义） -->
  <g>
    <rect x="620" y="94" width="140" height="52" rx="6" fill="#f5f5f5" stroke="#d25d5a" stroke-width="2" />
    <text x="690" y="125" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Failed</text>
  </g>

  <g>
    <rect x="620" y="254" width="140" height="52" rx="6" fill="#f5f5f5" stroke="#509863" stroke-width="2" />
    <text x="690" y="285" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Succeeded</text>
  </g>

  <g>
    <rect x="620" y="414" width="140" height="52" rx="6" fill="#f5f5f5" stroke="#646a73" stroke-width="2" />
    <text x="690" y="445" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Cancelled</text>
  </g>
</svg>
