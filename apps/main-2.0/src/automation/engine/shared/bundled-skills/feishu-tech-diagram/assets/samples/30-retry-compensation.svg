<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="740" viewBox="0 0 1250 740">
  <defs>
    <!-- 通用实心箭头 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#bbbfc4" />
    </marker>
    <!-- 告警/红色实心箭头 -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#d25d5a" />
    </marker>
    <!-- 成功/绿色实心箭头 -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#509863" />
    </marker>
  </defs>

  <!-- 异常分类与降级策略 专属背景区 -->
  <rect x="30" y="190" width="1190" height="510" rx="12" fill="#f5f5f5" stroke="#dee0e3" stroke-dasharray="6 4" stroke-width="1.5" />
  <text x="60" y="225" font-size="14" font-weight="bold" fill="#646a73">异常分类与处理策略 (Exception Classification &amp; Fallback Zone)</text>

  <!-- ==================== 连线路由 (置于底层) ==================== -->

  <!-- 1. 主干正常路径连线 -->
  <line x1="150" y1="104" x2="202" y2="104" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="350" y1="104" x2="402" y2="104" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="490" y1="104" x2="1072" y2="104" stroke="#509863" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <text x="520" y="96" font-size="12" fill="#509863">成功 (Success)</text>

  <!-- 2. 异常总线下沉连线 -->
  <polyline points="450,136 450,532" stroke="#bbbfc4" stroke-width="1.5" fill="none" />
  <text x="460" y="170" font-size="12" fill="#d25d5a">异常 (Exception)</text>

  <!-- 3. 瞬时错误分支连线 (y=272) -->
  <line x1="450" y1="272" x2="512" y2="272" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="660" y1="272" x2="712" y2="272" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="860" y1="272" x2="1072" y2="272" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="940" y="264" font-size="12" fill="#8f959e">超过重试阈值</text>

  <!-- 退避重试 回流通道 -->
  <polyline points="790,240 790,30 280,30 280,64" stroke="#bbbfc4" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="500" y="22" font-size="12" fill="#8f959e">发起重试 (Max Retries &amp; Backoff)</text>

  <!-- 4. 依赖不可用分支连线 (y=402) -->
  <line x1="450" y1="402" x2="512" y2="402" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="660" y1="402" x2="712" y2="402" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="860" y1="402" x2="1072" y2="402" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 5. 业务逻辑失败分支连线 (y=532) -->
  <line x1="450" y1="532" x2="512" y2="532" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="660" y1="532" x2="712" y2="532" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="860" y1="532" x2="912" y2="532" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 业务补偿 判定连线 -->
  <!-- 补偿成功 -->
  <line x1="1000" y1="532" x2="1072" y2="532" stroke="#509863" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <text x="1025" y="524" font-size="12" fill="#509863">成功</text>
  <!-- 补偿失败下沉 -->
  <line x1="960" y1="564" x2="960" y2="622" stroke="#d25d5a" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <text x="970" y="595" font-size="12" fill="#d25d5a">失败</text>
  <!-- 告警至终态 -->
  <line x1="1030" y1="662" x2="1072" y2="662" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- ==================== 节点绘制 (置于顶层) ==================== -->

  <!-- [Row 1] 主干路径: 起点 -> 执行 -> 判定 -> 成功终态 -->
  <!-- 起点 -->
  <rect x="50" y="80" width="100" height="48" rx="24" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="100" y="109" font-size="14" fill="#1f2329" text-anchor="middle">触发执行</text>

  <!-- 执行节点 -->
  <rect x="210" y="72" width="140" height="64" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="280" y="103" font-size="14" fill="#1f2329" text-anchor="middle">执行核心业务</text>
  <text x="280" y="123" font-size="12" fill="#8f959e" text-anchor="middle">(Execute Task)</text>

  <!-- 执行结果判定 (菱形) -->
  <polygon points="450,72 490,104 450,136 410,104" fill="#ffffff" stroke="#5178c6" stroke-width="1.5" />
  <text x="450" y="108" font-size="14" fill="#1f2329" text-anchor="middle">状态</text>

  <!-- 正常终态 -->
  <rect x="1080" y="80" width="120" height="48" rx="24" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="1140" y="109" font-size="14" font-weight="bold" fill="#509863" text-anchor="middle">业务成功</text>

  <!-- [Row 2] 异常分支 1: 瞬时错误 -->
  <!-- 错误分类 -->
  <rect x="520" y="240" width="140" height="64" rx="6" fill="#ffffff" stroke="#d4b45b" stroke-width="1.5" />
  <text x="590" y="267" font-size="14" fill="#1f2329" text-anchor="middle">瞬时错误</text>
  <text x="590" y="287" font-size="12" fill="#8f959e" text-anchor="middle">(网络抖动/超时)</text>

  <!-- 应对动作 -->
  <rect x="720" y="240" width="140" height="64" rx="6" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="790" y="267" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">退避重试</text>
  <text x="790" y="287" font-size="12" fill="#d48e5b" text-anchor="middle">(Backoff Retry)</text>

  <!-- 失败终态 -->
  <rect x="1080" y="248" width="120" height="48" rx="24" fill="#ffffff" stroke="#d25d5a" stroke-width="1.5" />
  <text x="1140" y="277" font-size="14" font-weight="bold" fill="#d25d5a" text-anchor="middle">系统异常终止</text>

  <!-- [Row 3] 异常分支 2: 依赖不可用 -->
  <!-- 错误分类 -->
  <rect x="520" y="370" width="140" height="64" rx="6" fill="#ffffff" stroke="#d4b45b" stroke-width="1.5" />
  <text x="590" y="397" font-size="14" fill="#1f2329" text-anchor="middle">依赖不可用</text>
  <text x="590" y="417" font-size="12" fill="#8f959e" text-anchor="middle">(下游熔断/限流)</text>

  <!-- 应对动作 -->
  <rect x="720" y="370" width="140" height="64" rx="6" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="790" y="397" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">服务降级</text>
  <text x="790" y="417" font-size="12" fill="#d48e5b" text-anchor="middle">(返回默认值/缓存)</text>

  <!-- 降级终态 -->
  <rect x="1080" y="378" width="120" height="48" rx="24" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="1140" y="407" font-size="14" font-weight="bold" fill="#5178c6" text-anchor="middle">降级成功</text>

  <!-- [Row 4] 异常分支 3: 业务失败 -->
  <!-- 错误分类 -->
  <rect x="520" y="500" width="140" height="64" rx="6" fill="#ffffff" stroke="#d4b45b" stroke-width="1.5" />
  <text x="590" y="527" font-size="14" fill="#1f2329" text-anchor="middle">业务逻辑失败</text>
  <text x="590" y="547" font-size="12" fill="#8f959e" text-anchor="middle">(数据校验不通过等)</text>

  <!-- 应对动作 -->
  <rect x="720" y="500" width="140" height="64" rx="6" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="790" y="527" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">业务补偿</text>
  <text x="790" y="547" font-size="12" fill="#d48e5b" text-anchor="middle">(逆向回滚/状态重置)</text>

  <!-- 补偿结果判定 (菱形) -->
  <polygon points="960,500 1000,532 960,564 920,532" fill="#ffffff" stroke="#d4b45b" stroke-width="1.5" />
  <text x="960" y="536" font-size="14" fill="#1f2329" text-anchor="middle">校验</text>

  <!-- 补偿成功终态 -->
  <rect x="1080" y="508" width="120" height="48" rx="24" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="1140" y="537" font-size="14" font-weight="bold" fill="#5178c6" text-anchor="middle">补偿成功</text>

  <!-- [Row 5] 补偿失败兜底: 告警与干预 -->
  <rect x="890" y="630" width="140" height="64" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
  <text x="960" y="657" font-size="14" font-weight="bold" fill="#d25d5a" text-anchor="middle">触发告警</text>
  <text x="960" y="677" font-size="12" fill="#d25d5a" text-anchor="middle">及人工介入</text>

  <!-- 最终异常终态 -->
  <rect x="1080" y="638" width="120" height="48" rx="24" fill="#ffffff" stroke="#d25d5a" stroke-width="1.5" />
  <text x="1140" y="667" font-size="14" font-weight="bold" fill="#d25d5a" text-anchor="middle">待人工干预</text>

</svg>
