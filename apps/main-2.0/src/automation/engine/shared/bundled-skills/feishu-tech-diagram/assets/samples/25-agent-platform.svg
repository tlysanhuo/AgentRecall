<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 全局连线箭头 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#8f959e" />
    </marker>
  </defs>

  <!-- 全局背景 -->
  <rect width="1280" height="720" fill="#ffffff" />

  <!-- 主标题 -->
  <text x="140" y="45" font-size="24" font-weight="bold" fill="#1f2329">Agent 平台整体架构图</text>

  <!-- ========================================== -->
  <!-- 治理边界与层级划分 (虚线框与标签)              -->
  <!-- ========================================== -->

  <!-- 接入层边界 -->
  <rect x="140" y="80" width="840" height="110" rx="8" fill="none" stroke="#bbbfc4" stroke-width="1" stroke-dasharray="4,4" />
  <rect x="140" y="80" width="70" height="24" rx="4" fill="#eff0f1" />
  <text x="175" y="96" font-size="12" font-weight="bold" fill="#646a73" text-anchor="middle">接入层</text>

  <!-- 编排层边界 -->
  <rect x="140" y="210" width="840" height="160" rx="8" fill="none" stroke="#bbbfc4" stroke-width="1" stroke-dasharray="4,4" />
  <rect x="140" y="210" width="70" height="24" rx="4" fill="#eff0f1" />
  <text x="175" y="226" font-size="12" font-weight="bold" fill="#646a73" text-anchor="middle">编排层</text>

  <!-- 底座支撑层边界 -->
  <rect x="140" y="390" width="840" height="280" rx="8" fill="none" stroke="#bbbfc4" stroke-width="1" stroke-dasharray="4,4" />
  <rect x="140" y="390" width="70" height="24" rx="4" fill="#eff0f1" />
  <text x="175" y="406" font-size="12" font-weight="bold" fill="#646a73" text-anchor="middle">底座层</text>


  <!-- ========================================== -->
  <!-- 1. 应用入口层 (第 2 组：浅蓝)                  -->
  <!-- ========================================== -->
  <rect x="160" y="105" width="800" height="70" rx="8" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="250" y="145" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">应用入口</text>

  <rect x="340" y="120" width="130" height="40" rx="4" fill="#ffffff" stroke="#5178c6" stroke-width="1" />
  <text x="405" y="145" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Web UI</text>

  <rect x="490" y="120" width="130" height="40" rx="4" fill="#ffffff" stroke="#5178c6" stroke-width="1" />
  <text x="555" y="145" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">API 接口</text>

  <rect x="640" y="120" width="130" height="40" rx="4" fill="#ffffff" stroke="#5178c6" stroke-width="1" />
  <text x="705" y="145" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">SDK 接入</text>

  <rect x="790" y="120" width="130" height="40" rx="4" fill="#ffffff" stroke="#5178c6" stroke-width="1" />
  <text x="855" y="145" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">企微 / 钉钉</text>


  <!-- ========================================== -->
  <!-- 2. Agent 编排层 (第 1 组：紫色)                -->
  <!-- ========================================== -->
  <rect x="160" y="235" width="800" height="110" rx="8" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="250" y="285" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">Agent 编排</text>
  <text x="250" y="305" font-size="12" fill="#646a73" text-anchor="middle">Orchestration</text>

  <rect x="340" y="250" width="130" height="80" rx="4" fill="#ffffff" stroke="#8569cb" stroke-width="1" />
  <text x="405" y="285" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">意图识别</text>
  <text x="405" y="310" font-size="12" fill="#646a73" text-anchor="middle">意图与槽位提取</text>

  <rect x="490" y="250" width="130" height="80" rx="4" fill="#ffffff" stroke="#8569cb" stroke-width="1" />
  <text x="555" y="285" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">任务规划</text>
  <text x="555" y="310" font-size="12" fill="#646a73" text-anchor="middle">DAG 与依赖解析</text>

  <rect x="640" y="250" width="130" height="80" rx="4" fill="#ffffff" stroke="#8569cb" stroke-width="1" />
  <text x="705" y="285" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Prompt 组装</text>
  <text x="705" y="310" font-size="12" fill="#646a73" text-anchor="middle">上下文模板构建</text>

  <rect x="790" y="250" width="130" height="80" rx="4" fill="#ffffff" stroke="#8569cb" stroke-width="1" />
  <text x="855" y="285" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">多轮控制</text>
  <text x="855" y="310" font-size="12" fill="#646a73" text-anchor="middle">状态机与会话路由</text>


  <!-- ========================================== -->
  <!-- 3. 能力支撑层 (并列四个模块)                   -->
  <!-- ========================================== -->

  <!-- 3.1 模型服务 (第 4 组：绿色) -->
  <rect x="160" y="420" width="170" height="100" rx="8" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="245" y="445" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">模型服务</text>
  <rect x="175" y="460" width="140" height="22" rx="4" fill="#ffffff" />
  <text x="245" y="475" font-size="12" fill="#1f2329" text-anchor="middle">大语言模型 (LLM)</text>
  <rect x="175" y="488" width="140" height="22" rx="4" fill="#ffffff" />
  <text x="245" y="503" font-size="12" fill="#1f2329" text-anchor="middle">Embedding 模型</text>

  <!-- 3.2 知识检索 (第 5 组：黄色) -->
  <rect x="370" y="420" width="170" height="100" rx="8" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="455" y="445" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">知识检索</text>
  <rect x="385" y="460" width="140" height="22" rx="4" fill="#ffffff" />
  <text x="455" y="475" font-size="12" fill="#1f2329" text-anchor="middle">向量相似度查询</text>
  <rect x="385" y="488" width="140" height="22" rx="4" fill="#ffffff" />
  <text x="455" y="503" font-size="12" fill="#1f2329" text-anchor="middle">混合检索 (RAG)</text>

  <!-- 3.3 工具平台 (第 3 组：灰蓝) -->
  <rect x="580" y="420" width="170" height="100" rx="8" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
  <text x="665" y="445" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">工具平台</text>
  <rect x="595" y="460" width="140" height="22" rx="4" fill="#ffffff" />
  <text x="665" y="475" font-size="12" fill="#1f2329" text-anchor="middle">内置 API 插件</text>
  <rect x="595" y="488" width="140" height="22" rx="4" fill="#ffffff" />
  <text x="665" y="503" font-size="12" fill="#1f2329" text-anchor="middle">外部沙盒执行</text>

  <!-- 3.4 记忆服务 (第 2 组复用：浅蓝) -->
  <rect x="790" y="420" width="170" height="100" rx="8" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="875" y="445" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">记忆服务</text>
  <rect x="805" y="460" width="140" height="22" rx="4" fill="#ffffff" />
  <text x="875" y="475" font-size="12" fill="#1f2329" text-anchor="middle">短期会话 (Session)</text>
  <rect x="805" y="488" width="140" height="22" rx="4" fill="#ffffff" />
  <text x="875" y="503" font-size="12" fill="#1f2329" text-anchor="middle">长期记忆 (Vector)</text>


  <!-- ========================================== -->
  <!-- 4. 数据存储层 (第 3 组：灰蓝)                  -->
  <!-- ========================================== -->
  <rect x="160" y="560" width="800" height="80" rx="8" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
  <text x="250" y="595" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">数据存储</text>
  <text x="250" y="615" font-size="12" fill="#646a73" text-anchor="middle">Infrastructure</text>

  <rect x="340" y="580" width="130" height="40" rx="4" fill="#ffffff" stroke="#5263a5" stroke-width="1" />
  <text x="405" y="605" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">关系型数据库</text>

  <rect x="490" y="580" width="130" height="40" rx="4" fill="#ffffff" stroke="#5263a5" stroke-width="1" />
  <text x="555" y="605" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">向量数据库</text>

  <rect x="640" y="580" width="130" height="40" rx="4" fill="#ffffff" stroke="#5263a5" stroke-width="1" />
  <text x="705" y="605" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">对象存储</text>

  <rect x="790" y="580" width="130" height="40" rx="4" fill="#ffffff" stroke="#5263a5" stroke-width="1" />
  <text x="855" y="605" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">缓存与日志</text>


  <!-- ========================================== -->
  <!-- 5. 侧边栏：运行与评测 (第 6 组：粉红色)          -->
  <!-- ========================================== -->
  <rect x="1000" y="80" width="160" height="590" rx="8" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
  <text x="1080" y="120" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">运行与评测</text>
  <line x1="1020" y1="135" x2="1140" y2="135" stroke="#d25d5a" stroke-width="1" stroke-dasharray="2,2" />

  <rect x="1020" y="150" width="120" height="40" rx="4" fill="#ffffff" stroke="#d25d5a" stroke-width="1" />
  <text x="1080" y="175" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">链路追踪</text>

  <rect x="1020" y="220" width="120" height="40" rx="4" fill="#ffffff" stroke="#d25d5a" stroke-width="1" />
  <text x="1080" y="245" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">日志监控</text>

  <rect x="1020" y="290" width="120" height="40" rx="4" fill="#ffffff" stroke="#d25d5a" stroke-width="1" />
  <text x="1080" y="315" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">质量评测</text>

  <rect x="1020" y="360" width="120" height="40" rx="4" fill="#ffffff" stroke="#d25d5a" stroke-width="1" />
  <text x="1080" y="385" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">版本与模型管理</text>

  <rect x="1020" y="430" width="120" height="40" rx="4" fill="#ffffff" stroke="#d25d5a" stroke-width="1" />
  <text x="1080" y="455" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">权限与安全</text>

  <rect x="1020" y="500" width="120" height="40" rx="4" fill="#ffffff" stroke="#d25d5a" stroke-width="1" />
  <text x="1080" y="525" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">统计分析报表</text>


  <!-- ========================================== -->
  <!-- 核心调用连接线 (主链路)                        -->
  <!-- ========================================== -->

  <!-- 入口 -> 编排 -->
  <line x1="560" y1="175" x2="560" y2="225" stroke="#8f959e" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 编排 -> 支撑层 (4条垂线) -->
  <line x1="245" y1="345" x2="245" y2="410" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="455" y1="345" x2="455" y2="410" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="665" y1="345" x2="665" y2="410" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="875" y1="345" x2="875" y2="410" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 支撑层 -> 数据存储 (4条垂线) -->
  <line x1="245" y1="520" x2="245" y2="550" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="455" y1="520" x2="455" y2="550" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="665" y1="520" x2="665" y2="550" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="875" y1="520" x2="875" y2="550" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow)" />


  <!-- ========================================== -->
  <!-- 旁路连接线 (指向运行与评测的虚线)                -->
  <!-- ========================================== -->

  <!-- 各层与侧边栏的横向监控关联线 -->
  <line x1="960" y1="140" x2="990" y2="140" stroke="#8f959e" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  <line x1="960" y1="290" x2="990" y2="290" stroke="#8f959e" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  <line x1="960" y1="470" x2="990" y2="470" stroke="#8f959e" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />
  <line x1="960" y1="600" x2="990" y2="600" stroke="#8f959e" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow)" />

</svg>
