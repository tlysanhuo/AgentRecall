<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,1 8,5 0,9" fill="#dee0e3" />
    </marker>
  </defs>

  <!-- Section 1: 一句话定义 (Header) -->
  <rect x="40" y="40" width="1200" height="90" rx="8" fill="#eae2fe" stroke="#dee0e3" stroke-width="1" />
  <text x="80" y="90" font-size="18" font-weight="bold" fill="#8569cb">一句话定义</text>

  <rect x="220" y="55" width="980" height="60" rx="6" fill="#ffffff" />
  <text x="240" y="76" font-size="14" font-weight="bold" fill="#1f2329">模板占位：在此处用一句话简明扼要地描述该技术的核心本质、定位与解决的主要问题。</text>
  <text x="240" y="100" font-size="13" fill="#646a73">例如：一种基于流批一体架构的高效异构数据流转、清洗过滤与实时计算处理方案。</text>

  <!-- Section 2: 核心组件 (Middle Left) -->
  <rect x="40" y="150" width="380" height="340" rx="8" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1" />
  <text x="60" y="185" font-size="16" font-weight="bold" fill="#1f2329">核心组件</text>
  <text x="135" y="185" font-size="12" fill="#8f959e">Core Components</text>

  <!-- Component Card 1 -->
  <rect x="60" y="205" width="340" height="70" rx="6" fill="#ffffff" />
  <rect x="75" y="226" width="28" height="28" rx="6" fill="#f0f4fc" />
  <circle cx="89" cy="240" r="4" fill="#5178c6" />
  <text x="115" y="240" font-size="14" font-weight="bold" fill="#1f2329">组件 A: 数据入口网关</text>
  <text x="115" y="262" font-size="12" fill="#646a73">负责高吞吐量多源并发接入与初始格式校验</text>

  <!-- Component Card 2 -->
  <rect x="60" y="285" width="340" height="70" rx="6" fill="#ffffff" />
  <rect x="75" y="306" width="28" height="28" rx="6" fill="#f0f4fc" />
  <circle cx="89" cy="320" r="4" fill="#5178c6" />
  <text x="115" y="320" font-size="14" font-weight="bold" fill="#1f2329">组件 B: 实时处理引擎</text>
  <text x="115" y="342" font-size="12" fill="#646a73">提供极低延迟的流式分析与复杂事件计算能力</text>

  <!-- Component Card 3 -->
  <rect x="60" y="365" width="340" height="70" rx="6" fill="#ffffff" />
  <rect x="75" y="386" width="28" height="28" rx="6" fill="#f0f4fc" />
  <circle cx="89" cy="400" r="4" fill="#5178c6" />
  <text x="115" y="400" font-size="14" font-weight="bold" fill="#1f2329">组件 C: 分布式存储池</text>
  <text x="115" y="422" font-size="12" fill="#646a73">保障异构数据的多副本持久化分层存储与检索</text>

  <!-- Section 3: 工作流程 (Middle Right) -->
  <rect x="440" y="150" width="800" height="340" rx="8" fill="#dff5e5" stroke="#dee0e3" stroke-width="1" />
  <text x="470" y="185" font-size="16" font-weight="bold" fill="#1f2329">工作流程</text>
  <text x="545" y="185" font-size="12" fill="#8f959e">Workflow Pipeline</text>

  <!-- Workflow Step 1 -->
  <rect x="470" y="240" width="150" height="70" rx="6" fill="#ffffff" />
  <rect x="590" y="250" width="20" height="20" rx="4" fill="#dff5e5" />
  <circle cx="600" cy="260" r="3" fill="#509863" />
  <text x="485" y="263" font-size="14" font-weight="bold" fill="#509863">01 采集</text>
  <line x1="485" y1="276" x2="605" y2="276" stroke="#dee0e3" stroke-width="1" />
  <text x="485" y="296" font-size="12" fill="#646a73">多数据源实时抽取接入</text>

  <!-- Arrow 1 to 2 -->
  <line x1="626" y1="275" x2="652" y2="275" stroke="#dee0e3" stroke-width="2" marker-end="url(#arrow)" />
  <text x="639" y="268" font-size="11" fill="#8f959e" text-anchor="middle">流转</text>

  <!-- Workflow Step 2 -->
  <rect x="660" y="240" width="150" height="70" rx="6" fill="#ffffff" />
  <rect x="780" y="250" width="20" height="20" rx="4" fill="#dff5e5" />
  <circle cx="790" cy="260" r="3" fill="#509863" />
  <text x="675" y="263" font-size="14" font-weight="bold" fill="#509863">02 过滤</text>
  <line x1="675" y1="276" x2="795" y2="276" stroke="#dee0e3" stroke-width="1" />
  <text x="675" y="296" font-size="12" fill="#646a73">脏数据清洗与去重处理</text>

  <!-- Arrow 2 to 3 -->
  <line x1="816" y1="275" x2="842" y2="275" stroke="#dee0e3" stroke-width="2" marker-end="url(#arrow)" />
  <text x="829" y="268" font-size="11" fill="#8f959e" text-anchor="middle">解析</text>

  <!-- Workflow Step 3 -->
  <rect x="850" y="240" width="150" height="70" rx="6" fill="#ffffff" />
  <rect x="970" y="250" width="20" height="20" rx="4" fill="#dff5e5" />
  <circle cx="980" cy="260" r="3" fill="#509863" />
  <text x="865" y="263" font-size="14" font-weight="bold" fill="#509863">03 分析</text>
  <line x1="865" y1="276" x2="985" y2="276" stroke="#dee0e3" stroke-width="1" />
  <text x="865" y="296" font-size="12" fill="#646a73">核心聚合与复杂事件计算</text>

  <!-- Arrow 3 to 4 -->
  <line x1="1006" y1="275" x2="1032" y2="275" stroke="#dee0e3" stroke-width="2" marker-end="url(#arrow)" />
  <text x="1019" y="268" font-size="11" fill="#8f959e" text-anchor="middle">输出</text>

  <!-- Workflow Step 4 -->
  <rect x="1040" y="240" width="150" height="70" rx="6" fill="#ffffff" />
  <rect x="1160" y="250" width="20" height="20" rx="4" fill="#dff5e5" />
  <circle cx="1170" cy="260" r="3" fill="#509863" />
  <text x="1055" y="263" font-size="14" font-weight="bold" fill="#509863">04 呈现</text>
  <line x1="1055" y1="276" x2="1175" y2="276" stroke="#dee0e3" stroke-width="1" />
  <text x="1055" y="296" font-size="12" fill="#646a73">业务指标与可视化大屏</text>

  <!-- Error Feedback Path -->
  <line x1="735" y1="316" x2="735" y2="332" stroke="#dee0e3" stroke-width="2" marker-end="url(#arrow)" />
  <text x="742" y="328" font-size="11" fill="#8f959e">校验失败</text>

  <rect x="660" y="340" width="150" height="60" rx="6" fill="#ffffff" />
  <rect x="780" y="350" width="20" height="20" rx="4" fill="#fee3e2" />
  <circle cx="790" cy="360" r="3" fill="#d25d5a" />
  <text x="675" y="363" font-size="14" font-weight="bold" fill="#d25d5a">异常处理</text>
  <line x1="675" y1="374" x2="795" y2="374" stroke="#dee0e3" stroke-width="1" />
  <text x="675" y="390" font-size="12" fill="#646a73">拦截并记录异常错误日志</text>

  <!-- Section 4: 典型场景 (Bottom Left) -->
  <rect x="40" y="510" width="380" height="170" rx="8" fill="#fef1ce" stroke="#dee0e3" stroke-width="1" />
  <text x="60" y="540" font-size="16" font-weight="bold" fill="#1f2329">典型场景</text>
  <text x="135" y="540" font-size="12" fill="#8f959e">Scenarios</text>

  <rect x="60" y="560" width="340" height="45" rx="6" fill="#ffffff" />
  <rect x="68" y="575" width="4" height="14" rx="2" fill="#d4b45b" />
  <text x="82" y="587" font-size="13" fill="#1f2329">场景 A: 金融级高并发实时流处理与风控监控</text>

  <rect x="60" y="615" width="340" height="45" rx="6" fill="#ffffff" />
  <rect x="68" y="630" width="4" height="14" rx="2" fill="#d4b45b" />
  <text x="82" y="642" font-size="13" fill="#1f2329">场景 B: 跨地域大规模多节点离线数据同步</text>

  <!-- Section 5: 主要优点 (Bottom Middle) -->
  <rect x="440" y="510" width="380" height="170" rx="8" fill="#fee3e2" stroke="#dee0e3" stroke-width="1" />
  <text x="460" y="540" font-size="16" font-weight="bold" fill="#1f2329">主要优点</text>
  <text x="535" y="540" font-size="12" fill="#8f959e">Advantages</text>

  <rect x="460" y="560" width="340" height="45" rx="6" fill="#ffffff" />
  <rect x="468" y="575" width="4" height="14" rx="2" fill="#d25d5a" />
  <text x="482" y="587" font-size="13" fill="#1f2329">优势 A: 毫秒级端到端极低系统延迟与高效吞吐</text>

  <rect x="460" y="615" width="340" height="45" rx="6" fill="#ffffff" />
  <rect x="468" y="630" width="4" height="14" rx="2" fill="#d25d5a" />
  <text x="482" y="642" font-size="13" fill="#1f2329">优势 B: 基于云原生容器的无缝动态弹性扩缩容</text>

  <!-- Section 6: 限制与注意事项 (Bottom Right) -->
  <rect x="840" y="510" width="400" height="170" rx="8" fill="#d6dcf3" stroke="#dee0e3" stroke-width="1" />
  <text x="860" y="540" font-size="16" font-weight="bold" fill="#1f2329">限制与注意事项</text>
  <text x="990" y="540" font-size="12" fill="#8f959e">Limitations</text>

  <rect x="860" y="560" width="360" height="45" rx="6" fill="#ffffff" />
  <rect x="868" y="575" width="4" height="14" rx="2" fill="#5263a5" />
  <text x="882" y="587" font-size="13" fill="#1f2329">限制 A: 对跨 IDC 网络专线带宽质量与抖动要求极高</text>

  <rect x="860" y="615" width="360" height="45" rx="6" fill="#ffffff" />
  <rect x="868" y="630" width="4" height="14" rx="2" fill="#5263a5" />
  <text x="882" y="642" font-size="13" fill="#1f2329">限制 B: 强一致性事务要求场景下可能引发性能退化</text>
</svg>
