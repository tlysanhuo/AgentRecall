<svg width="920" height="940" viewBox="0 0 920 940" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="250" height="940" fill="#f0f4fc" />
  <rect x="250" y="0" width="200" height="940" fill="#dff5e5" />
  <rect x="450" y="0" width="470" height="940" fill="#fee3e2" />

  <rect x="30" y="24" width="310" height="44" fill="#ffffff" rx="6" />
  <text x="185" y="52" font-size="18" font-weight="bold" fill="#1f2329" text-anchor="middle">质量属性效用树 (Utility Tree)</text>

  <text x="125" y="105" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">业务目标</text>
  <text x="350" y="105" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">质量属性</text>
  <text x="685" y="105" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">可验证场景 (Scenarios)</text>

  <path d="M 200 510 L 240 510 L 240 190 L 280 190" stroke="#bbbfc4" stroke-width="1.5" fill="none" />
  <path d="M 200 510 L 240 510 L 240 350 L 280 350" stroke="#bbbfc4" stroke-width="1.5" fill="none" />
  <path d="M 200 510 L 280 510" stroke="#bbbfc4" stroke-width="1.5" fill="none" />
  <path d="M 200 510 L 240 510 L 240 670 L 280 670" stroke="#bbbfc4" stroke-width="1.5" fill="none" />
  <path d="M 200 510 L 240 510 L 240 830 L 280 830" stroke="#bbbfc4" stroke-width="1.5" fill="none" />

  <line x1="420" y1="190" x2="490" y2="190" stroke="#bbbfc4" stroke-width="1.5" />
  <line x1="420" y1="350" x2="490" y2="350" stroke="#bbbfc4" stroke-width="1.5" />
  <line x1="420" y1="510" x2="490" y2="510" stroke="#bbbfc4" stroke-width="1.5" />
  <line x1="420" y1="670" x2="490" y2="670" stroke="#bbbfc4" stroke-width="1.5" />
  <line x1="420" y1="830" x2="490" y2="830" stroke="#bbbfc4" stroke-width="1.5" />

  <rect x="50" y="480" width="150" height="60" fill="#ffffff" rx="8" />
  <text x="125" y="516" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">业务成功</text>

  <rect x="280" y="165" width="140" height="50" fill="#ffffff" rx="8" />
  <text x="350" y="195" font-size="15" font-weight="bold" fill="#1f2329" text-anchor="middle">性能</text>

  <rect x="280" y="325" width="140" height="50" fill="#ffffff" rx="8" />
  <text x="350" y="355" font-size="15" font-weight="bold" fill="#1f2329" text-anchor="middle">可用性</text>

  <rect x="280" y="485" width="140" height="50" fill="#ffffff" rx="8" />
  <text x="350" y="515" font-size="15" font-weight="bold" fill="#1f2329" text-anchor="middle">安全</text>

  <rect x="280" y="645" width="140" height="50" fill="#ffffff" rx="8" />
  <text x="350" y="675" font-size="15" font-weight="bold" fill="#1f2329" text-anchor="middle">可演进性</text>

  <rect x="280" y="805" width="140" height="50" fill="#ffffff" rx="8" />
  <text x="350" y="835" font-size="15" font-weight="bold" fill="#1f2329" text-anchor="middle">成本</text>

  <rect x="490" y="123" width="390" height="134" fill="#ffffff" rx="8" />
  <text x="510" y="151" font-size="15" font-weight="bold" fill="#1f2329">秒杀/大促高并发场景</text>
  <rect x="740" y="136" width="56" height="22" fill="#fee3e2" rx="4" />
  <text x="768" y="151" font-size="12" font-weight="bold" fill="#d25d5a" text-anchor="middle">重要 H</text>
  <rect x="804" y="136" width="56" height="22" fill="#fee3e2" rx="4" />
  <text x="832" y="151" font-size="12" font-weight="bold" fill="#d25d5a" text-anchor="middle">风险 H</text>
  <text x="510" y="183" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">刺激：</tspan>瞬时并发请求量激增至平时 10 倍以上</text>
  <text x="510" y="203" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">环境：</tspan>双十一大促或核心秒杀活动期间</text>
  <text x="510" y="223" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">响应：</tspan>系统能够平滑处理请求，核心服务不断线</text>
  <text x="510" y="243" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">指标：</tspan>P99 延迟 &lt; 200ms，吞吐量 ≥ 10万 TPS</text>

  <rect x="490" y="283" width="390" height="134" fill="#ffffff" rx="8" />
  <text x="510" y="311" font-size="15" font-weight="bold" fill="#1f2329">核心机房/可用区故障场景</text>
  <rect x="740" y="296" width="56" height="22" fill="#fee3e2" rx="4" />
  <text x="768" y="311" font-size="12" font-weight="bold" fill="#d25d5a" text-anchor="middle">重要 H</text>
  <rect x="804" y="296" width="56" height="22" fill="#fef1ce" rx="4" />
  <text x="832" y="311" font-size="12" font-weight="bold" fill="#d48e5b" text-anchor="middle">风险 M</text>
  <text x="510" y="343" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">刺激：</tspan>核心计算节点或单可用区网络整体瘫痪</text>
  <text x="510" y="363" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">环境：</tspan>系统日常高负载运行期间发生的不可预知故障</text>
  <text x="510" y="383" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">响应：</tspan>自动触发容灾切换，备用节点无缝接管核心流量</text>
  <text x="510" y="403" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">指标：</tspan>RTO &lt; 5 分钟，RPO = 0（数据零丢失）</text>

  <rect x="490" y="443" width="390" height="134" fill="#ffffff" rx="8" />
  <text x="510" y="471" font-size="15" font-weight="bold" fill="#1f2329">恶意 CC / 爬虫高频攻击防御</text>
  <rect x="740" y="456" width="56" height="22" fill="#fef1ce" rx="4" />
  <text x="768" y="471" font-size="12" font-weight="bold" fill="#d48e5b" text-anchor="middle">重要 M</text>
  <rect x="804" y="456" width="56" height="22" fill="#dff5e5" rx="4" />
  <text x="832" y="471" font-size="12" font-weight="bold" fill="#509863" text-anchor="middle">风险 L</text>
  <text x="510" y="503" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">刺激：</tspan>黑客或竞争对手发起大量高频爬虫与 CC 攻击</text>
  <text x="510" y="523" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">环境：</tspan>开放互联网接口，未登录及登录态混合访问</text>
  <text x="510" y="543" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">响应：</tspan>网关层自动识别异常特征并阻断恶意流量</text>
  <text x="510" y="563" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">指标：</tspan>恶意流量拦截率 &gt; 99%，正常请求误杀率 &lt; 0.1%</text>

  <rect x="490" y="603" width="390" height="134" fill="#ffffff" rx="8" />
  <text x="510" y="631" font-size="15" font-weight="bold" fill="#1f2329">新增第三方支付渠道接入</text>
  <rect x="740" y="616" width="56" height="22" fill="#fef1ce" rx="4" />
  <text x="768" y="631" font-size="12" font-weight="bold" fill="#d48e5b" text-anchor="middle">重要 M</text>
  <rect x="804" y="616" width="56" height="22" fill="#fef1ce" rx="4" />
  <text x="832" y="631" font-size="12" font-weight="bold" fill="#d48e5b" text-anchor="middle">风险 M</text>
  <text x="510" y="663" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">刺激：</tspan>业务侧要求一周内新增一种第三方支付方式</text>
  <text x="510" y="683" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">环境：</tspan>主交易链路处于日常敏捷迭代与维护周期内</text>
  <text x="510" y="703" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">响应：</tspan>开发团队仅需新增配置和少量实现类即可完成接入</text>
  <text x="510" y="723" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">指标：</tspan>开发及测试总耗时 &lt; 3 人天，对原有逻辑零侵入</text>

  <rect x="490" y="763" width="390" height="134" fill="#ffffff" rx="8" />
  <text x="510" y="791" font-size="15" font-weight="bold" fill="#1f2329">资源闲置期弹性缩容</text>
  <rect x="740" y="776" width="56" height="22" fill="#dff5e5" rx="4" />
  <text x="768" y="791" font-size="12" font-weight="bold" fill="#509863" text-anchor="middle">重要 L</text>
  <rect x="804" y="776" width="56" height="22" fill="#dff5e5" rx="4" />
  <text x="832" y="791" font-size="12" font-weight="bold" fill="#509863" text-anchor="middle">风险 L</text>
  <text x="510" y="823" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">刺激：</tspan>业务低谷期（如凌晨）请求量降至峰值的 10%</text>
  <text x="510" y="843" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">环境：</tspan>云原生微服务架构下的日常低负载运行态</text>
  <text x="510" y="863" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">响应：</tspan>系统自动识别低负载状态并平滑回收冗余计算资源</text>
  <text x="510" y="883" font-size="12" fill="#646a73"><tspan fill="#1f2329" font-weight="bold">指标：</tspan>集群 CPU 整体利用率维持在 40%~60%，硬件成本降 30%</text>

  </svg>
