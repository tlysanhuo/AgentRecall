<svg width="870" height="480" viewBox="0 0 870 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 前置依赖箭头 (深灰) -->
    <marker id="arrow_gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#646a73" />
    </marker>
    <!-- 组成关系箭头 (浅灰) -->
    <marker id="arrow_light" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#bbbfc4" />
    </marker>
  </defs>

  <!-- 全局标题 -->
  <text x="80" y="44" font-size="20" font-weight="bold" fill="#1f2329">概念依赖 DAG 模板</text>

  <!-- 列标题区域 -->
  <text x="165" y="80" font-size="12" font-weight="bold" fill="#8f959e" text-anchor="middle">基础层</text>
  <text x="435" y="80" font-size="12" font-weight="bold" fill="#8f959e" text-anchor="middle">中间层</text>
  <text x="705" y="80" font-size="12" font-weight="bold" fill="#8f959e" text-anchor="middle">高阶层</text>

  <!-- 连线层 (提前渲染，避免覆盖卡片层文字) -->

  <!-- 1. 前置依赖 (水平实线) -->
  <line x1="250" y1="135" x2="350" y2="135" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow_gray)" />
  <line x1="250" y1="295" x2="350" y2="295" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow_gray)" />

  <!-- 2. 组成关系 (斜事实线) -->
  <line x1="250" y1="160" x2="350" y2="270" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow_light)" />
  <line x1="250" y1="270" x2="350" y2="160" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow_light)" />

  <!-- 3. 前置依赖 (折线汇总) -->
  <polyline points="520,148 570,148 570,207 620,207" fill="none" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow_gray)" />
  <polyline points="520,298 570,298 570,239 620,239" fill="none" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow_gray)" />

  <!-- 4. 相关/对比 (纵向虚线) -->
  <line x1="165" y1="196" x2="165" y2="250" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="173" y="227" font-size="12" fill="#8f959e">对比</text>

  <line x1="435" y1="196" x2="435" y2="250" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="443" y="227" font-size="12" fill="#8f959e">对比</text>


  <!-- 卡片层 -->

  <!-- 节点 A -->
  <rect x="80" y="100" width="170" height="96" rx="6" fill="#eae2fe" stroke="#dee0e3" />
  <text x="165" y="124" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">基础概念 A</text>
  <line x1="90" y1="136" x2="240" y2="136" stroke="#ffffff" stroke-width="1" />
  <text x="90" y="156" font-size="12" fill="#646a73">
    <tspan x="90" dy="0">提供底层数据与前置</tspan>
    <tspan x="90" dy="18">计算逻辑支撑</tspan>
  </text>

  <!-- 节点 B -->
  <rect x="80" y="250" width="170" height="96" rx="6" fill="#eae2fe" stroke="#dee0e3" />
  <text x="165" y="274" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">基础概念 B</text>
  <line x1="90" y1="286" x2="240" y2="286" stroke="#ffffff" stroke-width="1" />
  <text x="90" y="306" font-size="12" fill="#646a73">
    <tspan x="90" dy="0">作为核心依赖模块</tspan>
    <tspan x="90" dy="18">保障流转的独立性</tspan>
  </text>

  <!-- 节点 C -->
  <rect x="350" y="100" width="170" height="96" rx="6" fill="#f0f4fc" stroke="#dee0e3" />
  <text x="435" y="124" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">中间概念 C</text>
  <line x1="360" y1="136" x2="510" y2="136" stroke="#ffffff" stroke-width="1" />
  <text x="360" y="156" font-size="12" fill="#646a73">
    <tspan x="360" dy="0">汇聚上游依赖，完成</tspan>
    <tspan x="360" dy="18">初级业务形态转换</tspan>
  </text>

  <!-- 节点 D -->
  <rect x="350" y="250" width="170" height="96" rx="6" fill="#f0f4fc" stroke="#dee0e3" />
  <text x="435" y="274" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">中间概念 D</text>
  <line x1="360" y1="286" x2="510" y2="286" stroke="#ffffff" stroke-width="1" />
  <text x="360" y="306" font-size="12" fill="#646a73">
    <tspan x="360" dy="0">加工组合底层元素，</tspan>
    <tspan x="360" dy="18">抽象出中阶语义</tspan>
  </text>

  <!-- 节点 E -->
  <rect x="620" y="175" width="170" height="96" rx="6" fill="#f5f5f5" stroke="#dee0e3" />
  <text x="705" y="199" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">高阶概念 E</text>
  <line x1="630" y1="211" x2="780" y2="211" stroke="#ffffff" stroke-width="1" />
  <text x="630" y="231" font-size="12" fill="#646a73">
    <tspan x="630" dy="0">沉淀顶层业务价值，</tspan>
    <tspan x="630" dy="18">对外输出统一接口</tspan>
  </text>


  <!-- 辅助图例层 -->
  <line x1="80" y1="410" x2="110" y2="410" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow_gray)" />
  <text x="118" y="414" font-size="12" fill="#646a73">前置依赖 (主干)</text>

  <line x1="240" y1="410" x2="270" y2="410" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow_light)" />
  <text x="278" y="414" font-size="12" fill="#8f959e">组成关系 (成分)</text>

  <line x1="400" y1="410" x2="430" y2="410" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="438" y="414" font-size="12" fill="#8f959e">相关/对比</text>
</svg>
