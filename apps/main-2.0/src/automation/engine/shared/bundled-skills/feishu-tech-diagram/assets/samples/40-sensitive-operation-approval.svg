<svg width="1240" height="740" viewBox="0 0 1240 740" xmlns="http://www.w3.org/2000/svg">
  <!-- 箭头与复用定义 -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bbbfc4" />
    </marker>
  </defs>

  <!-- 背景泳道 -->
  <g id="swimlanes">
    <!-- 申请人泳道 -->
    <rect x="40" y="60" width="1160" height="100" fill="#f5f5f5" />
    <!-- 系统泳道 -->
    <rect x="40" y="160" width="1160" height="180" fill="#ffffff" />
    <!-- 风险引擎泳道 -->
    <rect x="40" y="340" width="1160" height="120" fill="#f5f5f5" />
    <!-- 审批人泳道 -->
    <rect x="40" y="460" width="1160" height="120" fill="#ffffff" />
    <!-- 审计平台泳道 -->
    <rect x="40" y="580" width="1160" height="100" fill="#f5f5f5" />

    <!-- 泳道分割线 -->
    <line x1="40" y1="160" x2="1200" y2="160" stroke="#dee0e3" stroke-width="1.5" />
    <line x1="40" y1="340" x2="1200" y2="340" stroke="#dee0e3" stroke-width="1.5" />
    <line x1="40" y1="460" x2="1200" y2="460" stroke="#dee0e3" stroke-width="1.5" />
    <line x1="40" y1="580" x2="1200" y2="580" stroke="#dee0e3" stroke-width="1.5" />

    <!-- 左侧表头竖线 -->
    <line x1="120" y1="60" x2="120" y2="680" stroke="#dee0e3" stroke-width="1.5" />
    <!-- 整个泳道外边框 -->
    <rect x="40" y="60" width="1160" height="620" fill="none" stroke="#dee0e3" stroke-width="1.5" />

    <!-- 泳道标题文字 -->
    <text x="80" y="115" fill="#1f2329" font-size="14" font-weight="bold" text-anchor="middle">申请人</text>
    <text x="80" y="255" fill="#1f2329" font-size="14" font-weight="bold" text-anchor="middle">系统</text>
    <text x="80" y="405" fill="#1f2329" font-size="14" font-weight="bold" text-anchor="middle">风险引擎</text>
    <text x="80" y="525" fill="#1f2329" font-size="14" font-weight="bold" text-anchor="middle">审批人</text>
    <text x="80" y="635" fill="#1f2329" font-size="14" font-weight="bold" text-anchor="middle">审计平台</text>
  </g>

  <!-- 连线与路由 -->
  <g id="lines">
    <!-- N1 -> N2 (发起 -> 身份校验) -->
    <polyline points="230,110 360,110 360,220" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- N2 -> N3 (身份校验 -> 权限校验) -->
    <polyline points="420,250 480,250" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- N3 -> N_Reject (权限校验 -> 无权限拒绝) -->
    <polyline points="540,220 540,170 1060,170 1060,180" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- N3 -> N4 (权限校验 -> 风险评估) -->
    <polyline points="540,280 540,400 660,400" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- N4 -> N_Execute (风险评估 -> 低风险自动允许) -->
    <polyline points="720,370 720,300 1010,300" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- N4 -> N5 (风险评估 -> 高风险人工审批) -->
    <polyline points="720,430 720,520 840,520" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- N5 -> N_Reject (人工审批 -> 拒绝) -->
    <polyline points="900,490 900,200 1010,200" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- N5 -> N_Execute (人工审批 -> 通过) -->
    <polyline points="960,520 1060,520 1060,320" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- N_Reject / N_Execute -> N_Audit (汇聚至审计日志) -->
    <!-- N_Reject 汇入主总线 -->
    <polyline points="1110,200 1140,200" fill="none" stroke="#bbbfc4" stroke-width="1.5" />
    <!-- N_Execute 汇入主总线 -->
    <polyline points="1110,300 1140,300" fill="none" stroke="#bbbfc4" stroke-width="1.5" />
    <!-- 垂直总线下降至审计平台 -->
    <polyline points="1140,200 1140,610" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

  <!-- 连线标签 -->
  <g id="line-labels">
    <!-- 身份校验通过 -->
    <rect x="430" y="240" width="40" height="20" fill="#ffffff" rx="2" />
    <text x="450" y="254" fill="#646a73" font-size="12" text-anchor="middle">通过</text>

    <!-- 无权限 -->
    <rect x="620" y="160" width="48" height="20" fill="#ffffff" rx="2" />
    <text x="644" y="174" fill="#646a73" font-size="12" text-anchor="middle">无权限</text>

    <!-- 有权限 -->
    <rect x="580" y="390" width="48" height="20" fill="#ffffff" rx="2" />
    <text x="604" y="404" fill="#646a73" font-size="12" text-anchor="middle">有权限</text>

    <!-- 低风险 -->
    <rect x="730" y="290" width="48" height="20" fill="#ffffff" rx="2" />
    <text x="754" y="304" fill="#646a73" font-size="12" text-anchor="middle">低风险</text>

    <!-- 高风险 -->
    <rect x="730" y="510" width="48" height="20" fill="#ffffff" rx="2" />
    <text x="754" y="524" fill="#646a73" font-size="12" text-anchor="middle">高风险</text>

    <!-- 拒绝 -->
    <rect x="914" y="420" width="36" height="20" fill="#ffffff" rx="2" />
    <text x="932" y="434" fill="#646a73" font-size="12" text-anchor="middle">拒绝</text>

    <!-- 通过 -->
    <rect x="984" y="510" width="36" height="20" fill="#ffffff" rx="2" />
    <text x="1002" y="524" fill="#646a73" font-size="12" text-anchor="middle">通过</text>
  </g>

  <!-- 节点层 -->
  <g id="nodes">
    <!-- N1: 发起请求 -->
    <rect x="130" y="90" width="100" height="40" rx="4" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
    <text x="180" y="115" fill="#1f2329" font-size="14" text-anchor="middle">发起操作</text>

    <!-- N2: 身份校验 -->
    <polygon points="360,220 420,250 360,280 300,250" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
    <text x="360" y="255" fill="#1f2329" font-size="14" text-anchor="middle">身份校验</text>

    <!-- N3: 权限校验 -->
    <polygon points="540,220 600,250 540,280 480,250" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
    <text x="540" y="255" fill="#1f2329" font-size="14" text-anchor="middle">权限校验</text>

    <!-- N4: 风险评估 (黄色系) -->
    <polygon points="720,370 780,400 720,430 660,400" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
    <text x="720" y="405" fill="#1f2329" font-size="14" text-anchor="middle">风险评估</text>

    <!-- N5: 人工审批 (黄色系) -->
    <polygon points="900,490 960,520 900,550 840,520" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
    <text x="900" y="525" fill="#1f2329" font-size="14" text-anchor="middle">人工审批</text>

    <!-- N_Reject: 拒绝请求 (红色系) -->
    <rect x="1010" y="180" width="100" height="40" rx="4" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
    <text x="1060" y="205" fill="#d25d5a" font-size="14" font-weight="bold" text-anchor="middle">拒绝请求</text>

    <!-- N_Execute: 允许执行 (绿色系) -->
    <rect x="1010" y="280" width="100" height="40" rx="4" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
    <text x="1060" y="305" fill="#509863" font-size="14" font-weight="bold" text-anchor="middle">允许执行</text>

    <!-- N_Audit: 记录审计 (蓝色系) -->
    <rect x="1080" y="610" width="120" height="40" rx="4" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
    <text x="1140" y="635" fill="#1f2329" font-size="14" text-anchor="middle">记录审计</text>
  </g>
</svg>
