<svg width="1020" height="360" viewBox="0 0 1020 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主干流程箭头 -->
    <marker id="arrow-main" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 8 5 L 0 8 Z" fill="#8f959e" />
    </marker>
    <!-- 成功/通过连线箭头 -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 8 5 L 0 8 Z" fill="#509863" />
    </marker>
    <!-- 驳回/回流连线箭头 -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 8 5 L 0 8 Z" fill="#d25d5a" />
    </marker>
  </defs>

  <!-- 全局标题区 -->
  <text x="40" y="40" font-size="20" font-weight="bold" fill="#1f2329">Generator–Reviewer Agent 闭环架构</text>
  <text x="40" y="65" font-size="14" fill="#8f959e">通过多维度审查与自动反馈机制，实现任务输出的多轮自我优化 (Max = 3)</text>

  <!-- ================= 连线区（置于底层） ================= -->
  <!-- 1. 需求 -> Generator -->
  <line x1="130" y1="150" x2="204" y2="150" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow-main)" />
  <text x="167" y="142" font-size="12" fill="#8f959e" text-anchor="middle">任务需求</text>

  <!-- 2. Generator -> Reviewer -->
  <line x1="370" y1="150" x2="444" y2="150" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow-main)" />
  <text x="410" y="142" font-size="12" fill="#8f959e" text-anchor="middle">提交草稿</text>

  <!-- 3. Reviewer -> 判定 -->
  <line x1="620" y1="150" x2="674" y2="150" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow-main)" />
  <text x="650" y="142" font-size="12" fill="#8f959e" text-anchor="middle">打分结果</text>

  <!-- 4. 判定 -> 输出 -->
  <line x1="820" y1="150" x2="884" y2="150" stroke="#509863" stroke-width="1.5" marker-end="url(#arrow-green)" />
  <text x="855" y="142" font-size="12" font-weight="bold" fill="#509863" text-anchor="middle">Yes</text>

  <!-- 5. 判定 -> 回流到 Generator (驳回) -->
  <polyline points="750,210 750,290 290,290 290,196" fill="none" stroke="#d25d5a" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <!-- 回流线标签 -->
  <rect x="360" y="272" width="320" height="24" rx="4" fill="#ffffff" stroke="none" />
  <text x="520" y="288" font-size="12" font-weight="bold" fill="#d25d5a" text-anchor="middle">未通过：附带评审反馈并打回（累计 &lt; 3 轮）</text>

  <!-- ================= 节点区 ================= -->

  <!-- 输入节点 -->
  <rect x="40" y="130" width="90" height="40" rx="4" fill="#f5f5f5" stroke="#bbbfc4" stroke-width="1.5" />
  <text x="85" y="155" font-size="14" fill="#1f2329" text-anchor="middle">业务需求</text>

  <!-- Generator Agent 卡片 -->
  <rect x="210" y="110" width="160" height="80" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <!-- AI 生成/星星 Icon -->
  <path d="M 285 125 L 295 125 M 290 120 L 290 130 M 286.5 121.5 L 293.5 128.5 M 286.5 128.5 L 293.5 121.5" stroke="#5178c6" stroke-width="1.5" />
  <text x="290" y="150" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Generator Agent</text>
  <text x="290" y="168" font-size="12" fill="#646a73" text-anchor="middle">(生成任务草稿)</text>

  <!-- Reviewer Agent 卡片 -->
  <rect x="450" y="90" width="170" height="120" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <!-- 放大镜 Icon -->
  <circle cx="475" cy="112" r="6" stroke="#8569cb" stroke-width="1.5" fill="none" />
  <line x1="479" y1="116" x2="484" y2="121" stroke="#8569cb" stroke-width="1.5" />
  <!-- 卡片头部标题 -->
  <text x="492" y="117" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="start">Reviewer Agent</text>
  <!-- 分割线 -->
  <line x1="460" y1="130" x2="610" y2="130" stroke="#8569cb" stroke-width="1" />
  <!-- 评审维度列表 -->
  <circle cx="472" cy="151" r="2.5" fill="#8569cb" />
  <text x="482" y="155" font-size="12" fill="#1f2329" text-anchor="start">维度一：正确性</text>
  <circle cx="472" cy="171" r="2.5" fill="#8569cb" />
  <text x="482" y="175" font-size="12" fill="#1f2329" text-anchor="start">维度二：完整性</text>
  <circle cx="472" cy="191" r="2.5" fill="#8569cb" />
  <text x="482" y="195" font-size="12" fill="#1f2329" text-anchor="start">维度三：格式合规</text>

  <!-- 判定节点 (菱形) -->
  <polygon points="750,90 820,150 750,210 680,150" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="750" y="145" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">是否评审通过?</text>
  <text x="750" y="165" font-size="12" fill="#d48e5b" text-anchor="middle">(或达3轮上限)</text>

  <!-- 输出节点 -->
  <rect x="890" y="130" width="90" height="40" rx="4" fill="#ffffff" stroke="#bbbfc4" stroke-width="1.5" />
  <text x="935" y="155" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">最终输出</text>
</svg>
