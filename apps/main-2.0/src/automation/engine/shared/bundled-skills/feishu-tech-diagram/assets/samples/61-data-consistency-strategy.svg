  <line x1="380" y1="470" x2="322" y2="470" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-dashed)" />
  <line x1="620" y1="470" x2="678" y2="470" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arrow-dashed)" />

  </svg>
