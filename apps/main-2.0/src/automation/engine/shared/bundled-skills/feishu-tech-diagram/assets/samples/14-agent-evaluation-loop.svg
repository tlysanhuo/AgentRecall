<svg xmlns="http://www.w3.org/2000/svg" width="980" height="460" viewBox="0 0 980 460">
  <defs>
    <!-- 主干连线箭头 (深灰) -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#646a73" />
    </marker>
    <!-- 小巧连接箭头 (浅灰) -->
    <marker id="arrow-small" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#bbbfc4" />
    </marker>
    <!-- 回流连接箭头 (蓝色) -->
    <marker id="arrow-feedback" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#5178c6" />
    </marker>
  </defs>

  <!-- 1. 顶部主节点组 -->
  <!-- 1.1 真实样本采集 -->
  <g id="node-collect">
    <rect x="60" y="100" width="140" height="60" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
    <text x="130" y="126" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">真实样本采集</text>
    <text x="130" y="146" font-size="12" fill="#5263a5" text-anchor="middle">线上日志 / 用户反馈</text>
  </g>

  <!-- 采集 到 数据处理 的连线 -->
  <line x1="200" y1="130" x2="234" y2="130" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 1.2 数据处理 (容器) -->
  <g id="node-data-process">
    <rect x="240" y="75" width="260" height="110" rx="8" fill="#f5f5f5" stroke="#bbbfc4" />
    <text x="256" y="98" font-size="14" font-weight="bold" fill="#646a73">数据处理</text>

    <!-- 子节点：清洗 -->
    <rect x="256" y="120" width="60" height="40" rx="4" fill="#ffffff" stroke="#bbbfc4" />
    <text x="286" y="145" font-size="13" fill="#1f2329" text-anchor="middle">清洗</text>
    <!-- 子连线 -->
    <line x1="318" y1="140" x2="336" y2="140" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-small)" />

    <!-- 子节点：脱敏 -->
    <rect x="340" y="120" width="60" height="40" rx="4" fill="#ffffff" stroke="#bbbfc4" />
    <text x="370" y="145" font-size="13" fill="#1f2329" text-anchor="middle">脱敏</text>
    <!-- 子连线 -->
    <line x1="402" y1="140" x2="420" y2="140" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-small)" />

    <!-- 子节点：标注 -->
    <rect x="424" y="120" width="60" height="40" rx="4" fill="#ffffff" stroke="#bbbfc4" />
    <text x="454" y="145" font-size="13" fill="#1f2329" text-anchor="middle">标注</text>
  </g>

  <!-- 数据处理 到 数据集版本化 的连线 -->
  <line x1="500" y1="130" x2="534" y2="130" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 1.3 数据集版本化 (核心强调) -->
  <g id="node-dataset-version">
    <rect x="540" y="75" width="180" height="110" rx="8" fill="#fef1ce" stroke="#d4b45b" stroke-width="2" />
    <text x="630" y="105" font-size="16" font-weight="bold" fill="#d48e5b" text-anchor="middle">数据集版本化</text>
    <line x1="560" y1="115" x2="700" y2="115" stroke="#d4b45b" stroke-width="1" stroke-dasharray="2,2" />
    <text x="630" y="140" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Release v1.0.0</text>
    <text x="630" y="165" font-size="12" fill="#8f959e" text-anchor="middle">打标签锁定，确保基线一致</text>
  </g>

  <!-- 数据集版本化 到 运行Agent 的连线 -->
  <line x1="720" y1="130" x2="764" y2="130" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 1.4 运行 Agent -->
  <g id="node-agent">
    <rect x="770" y="100" width="140" height="60" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
    <text x="840" y="126" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">运行 Agent</text>
    <text x="840" y="146" font-size="12" fill="#509863" text-anchor="middle">执行与生成结果</text>
  </g>

  <!-- 运行 Agent 到 评分 的下行连线 -->
  <line x1="840" y1="160" x2="840" y2="309" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 2. 底部回溯流程：评测分析环节 (容器) -->
  <g id="node-eval-container">
    <rect x="240" y="270" width="670" height="130" rx="8" fill="#f0f4fc" stroke="#5178c6" stroke-dasharray="4,4" />
    <text x="256" y="296" font-size="14" font-weight="bold" fill="#5263a5">评测分析环节</text>
    <text x="894" y="296" font-size="12" fill="#8f959e" text-anchor="end">闭环优化的核心步骤</text>
  </g>

  <!-- 2.1 规则与模型评分 -->
  <g id="node-eval-score">
    <rect x="730" y="315" width="160" height="60" rx="6" fill="#ffffff" stroke="#5178c6" />
    <text x="810" y="338" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">规则与模型评分</text>
    <text x="810" y="358" font-size="12" fill="#8f959e" text-anchor="middle">多维度评估</text>
  </g>

  <!-- 评分 到 聚类 的连线 (从右向左) -->
  <line x1="730" y1="345" x2="676" y2="345" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 2.2 失败聚类 -->
  <g id="node-eval-cluster">
    <rect x="530" y="315" width="140" height="60" rx="6" fill="#ffffff" stroke="#5178c6" />
    <text x="600" y="338" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">失败聚类</text>
    <text x="600" y="358" font-size="12" fill="#8f959e" text-anchor="middle">寻找共性特征</text>
  </g>

  <!-- 聚类 到 根因 的连线 (从右向左) -->
  <line x1="530" y1="345" x2="476" y2="345" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 2.3 根因分析 -->
  <g id="node-eval-rootcause">
    <rect x="330" y="315" width="140" height="60" rx="6" fill="#ffffff" stroke="#5178c6" />
    <text x="400" y="338" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">根因分析</text>
    <text x="400" y="358" font-size="12" fill="#8f959e" text-anchor="middle">定位 Bad Case</text>
  </g>

  <!-- 3. 闭环反馈回流线 -->
  <!-- 从根因分析左侧引出，向上折返回到采集节点底侧 -->
  <polyline points="330,345 130,345 130,166" fill="none" stroke="#5178c6" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-feedback)" />

  <!-- 回流说明文本标签卡 -->
  <g id="feedback-label">
    <rect x="140" y="240" width="180" height="30" rx="4" fill="#f0f4fc" stroke="#5178c6" />
    <text x="230" y="259" font-size="12" fill="#5263a5" text-anchor="middle">优化结果回流，形成新样本</text>
  </g>
</svg>
