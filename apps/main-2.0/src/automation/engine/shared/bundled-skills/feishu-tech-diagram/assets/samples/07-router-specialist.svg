<svg width="1180" height="480" viewBox="0 0 1180 480" xmlns="http://www.w3.org/2000/svg">
  <!-- Definitions for markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#bbbfc4" />
    </marker>
  </defs>

  <!-- Background / Container group for Specialists -->
  <g id="specialist-group">
    <!-- Group bounding box -->
    <rect x="640" y="50" width="200" height="380" rx="8" fill="none" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="6,4" />
    <text x="640" y="40" font-size="12" fill="#8f959e" font-weight="bold">专家 Agent 集群 (Specialist Agents)</text>
  </g>

  <!-- Connection Lines (Drawn before nodes to keep them behind) -->
  <g id="connections">
    <!-- Input to Router -->
    <polyline points="200,250 272,250" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Router to Specialists -->
    <polyline points="440,250 500,250 500,115 652,115" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
    <polyline points="440,250 500,250 500,205 652,205" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
    <polyline points="440,250 500,250 500,295 652,295" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
    <polyline points="440,250 500,250 500,385 652,385" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- Specialists to Output -->
    <polyline points="820,115 890,115 890,250 952,250" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
    <polyline points="820,205 890,205 890,250 952,250" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
    <polyline points="820,295 890,295 890,250 952,250" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
    <polyline points="820,385 890,385 890,250 952,250" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  </g>

  <!-- Routing Condition Labels -->
  <g id="routing-labels" font-size="12" fill="#646a73" text-anchor="middle">
    <text x="576" y="107">代码相关</text>
    <text x="576" y="197">数据分析</text>
    <text x="576" y="287">文档检索</text>
    <text x="576" y="377">未识别 / 其他</text>
  </g>

  <!-- Nodes -->
  <g id="nodes">
    <!-- Input Node -->
    <g id="node-input">
      <rect x="60" y="223" width="140" height="54" rx="6" fill="#f5f5f5" stroke="#bbbfc4" stroke-width="1.5" />
      <text x="130" y="244" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">用户请求</text>
      <text x="130" y="262" font-size="12" fill="#8f959e" text-anchor="middle">User Request</text>
    </g>

    <!-- Router Node -->
    <g id="node-router">
      <rect x="280" y="218" width="160" height="64" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
      <text x="360" y="244" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">意图识别与路由</text>
      <text x="360" y="264" font-size="12" fill="#5178c6" text-anchor="middle">Router Agent</text>
    </g>

    <!-- Specialist Node 1: Code -->
    <g id="node-spec-code">
      <rect x="660" y="88" width="160" height="54" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
      <text x="740" y="110" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">代码专家</text>
      <text x="740" y="128" font-size="12" fill="#8569cb" text-anchor="middle">Code Agent</text>
    </g>

    <!-- Specialist Node 2: Data -->
    <g id="node-spec-data">
      <rect x="660" y="178" width="160" height="54" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
      <text x="740" y="200" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">数据专家</text>
      <text x="740" y="218" font-size="12" fill="#8569cb" text-anchor="middle">Data Agent</text>
    </g>

    <!-- Specialist Node 3: Doc -->
    <g id="node-spec-doc">
      <rect x="660" y="268" width="160" height="54" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
      <text x="740" y="290" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">文档专家</text>
      <text x="740" y="308" font-size="12" fill="#8569cb" text-anchor="middle">Doc Agent</text>
    </g>

    <!-- Specialist Node 4: General -->
    <g id="node-spec-general">
      <rect x="660" y="358" width="160" height="54" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
      <text x="740" y="380" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">通用助手</text>
      <text x="740" y="398" font-size="12" fill="#8569cb" text-anchor="middle">General Agent</text>
    </g>

    <!-- Output Node -->
    <g id="node-output">
      <rect x="960" y="218" width="160" height="64" rx="6" fill="#f5f5f5" stroke="#bbbfc4" stroke-width="1.5" />
      <text x="1040" y="244" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">统一适配与输出</text>
      <text x="1040" y="264" font-size="12" fill="#8f959e" text-anchor="middle">Response Formatting</text>
    </g>
  </g>
</svg>
