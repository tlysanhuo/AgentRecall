<svg width="1400" height="540" viewBox="0 0 1400 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 基础中灰箭头 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bbbfc4" />
    </marker>
    <!-- 闭环反馈蓝色箭头 -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5178c6" />
    </marker>
  </defs>

  <!-- 画布底色 -->
  <rect width="1400" height="540" fill="#ffffff" />

  <!-- 顶部主标题 -->
  <text x="700" y="36" font-size="20" font-weight="bold" fill="#1f2329" text-anchor="middle">可观测性闭环架构图</text>

  <!-- ================= 分区底板层 ================= -->
  <!-- 区域1：数据产生 -->
  <rect x="30" y="70" width="300" height="340" rx="12" fill="none" stroke="#dee0e3" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="46" y="86" width="88" height="28" rx="4" fill="#ffffff" stroke="#dee0e3" />
  <text x="90" y="105" font-size="14" font-weight="bold" fill="#646a73" text-anchor="middle">数据产生</text>
  <text x="142" y="105" font-size="12" fill="#8f959e">Data Generation</text>

  <!-- 区域2：处理与观测 -->
  <rect x="340" y="70" width="430" height="340" rx="12" fill="none" stroke="#dee0e3" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="356" y="86" width="100" height="28" rx="4" fill="#f0f4fc" stroke="#dee0e3" />
  <text x="406" y="105" font-size="14" font-weight="bold" fill="#5178c6" text-anchor="middle">处理与分析</text>
  <text x="466" y="105" font-size="12" fill="#8f959e">Process &amp; Observe</text>

  <!-- 区域3：响应与行动闭环 -->
  <rect x="780" y="70" width="570" height="340" rx="12" fill="none" stroke="#dee0e3" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="796" y="86" width="120" height="28" rx="4" fill="#eae2fe" stroke="#dee0e3" />
  <text x="856" y="105" font-size="14" font-weight="bold" fill="#8569cb" text-anchor="middle">响应与行动闭环</text>
  <text x="926" y="105" font-size="12" fill="#8f959e">Action &amp; Response</text>

  <!-- ================= 连线层 ================= -->
  <!-- 服务到指标/日志/Trace -->
  <polyline points="165,268 185,268 185,168 202,168" fill="none" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="165,268 202,268" fill="none" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)" />
  <polyline points="165,268 185,268 185,368 202,368" fill="none" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 指标/日志/Trace 汇聚到采集 -->
  <polyline points="320,168 345,168 345,268" fill="none" stroke="#bbbfc4" stroke-width="2" />
  <polyline points="320,368 345,368 345,268" fill="none" stroke="#bbbfc4" stroke-width="2" />
  <line x1="320" y1="268" x2="345" y2="268" stroke="#bbbfc4" stroke-width="2" />
  <line x1="345" y1="268" x2="362" y2="268" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 采集到存储分析 -->
  <line x1="480" y1="268" x2="502" y2="268" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 存储分析到看板和告警 -->
  <polyline points="620,268 635,268 635,178 642,178" fill="none" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="620" y1="268" x2="642" y2="268" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 告警到行动链路 -->
  <line x1="760" y1="268" x2="792" y2="268" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="910" y1="268" x2="932" y2="268" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1050" y1="268" x2="1072" y2="268" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)" />
  <line x1="1190" y1="268" x2="1212" y2="268" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)" />

  <!-- 闭环长回流线 (验证 -> 规则/服务) -->
  <polyline points="1275,300 1275,460 110,460 110,304" fill="none" stroke="#5178c6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-blue)" />

  <!-- 回流线文本框 -->
  <rect x="557" y="444" width="240" height="32" rx="16" fill="#f0f4fc" stroke="#5178c6" />
  <text x="677" y="465" font-size="14" fill="#5178c6" font-weight="bold" text-anchor="middle">验证结果反馈到规则和服务</text>


  <!-- ================= 节点卡片层 ================= -->

  <!-- 1. 业务服务 -->
  <rect x="55" y="240" width="110" height="56" rx="6" fill="#f5f5f5" stroke="#bbbfc4" stroke-width="1.5" />
  <circle cx="69" cy="268" r="4" fill="#5178c6" />
  <text x="117" y="264" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">业务服务</text>
  <text x="117" y="282" font-size="12" fill="#8f959e" text-anchor="middle">Services</text>

  <!-- 2. 指标 -->
  <rect x="210" y="140" width="110" height="56" rx="6" fill="#f5f5f5" stroke="#dee0e3" />
  <circle cx="224" cy="168" r="4" fill="#5263a5" />
  <text x="272" y="164" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">指标</text>
  <text x="272" y="182" font-size="12" fill="#8f959e" text-anchor="middle">Metrics</text>

  <!-- 3. 日志 -->
  <rect x="210" y="240" width="110" height="56" rx="6" fill="#f5f5f5" stroke="#dee0e3" />
  <circle cx="224" cy="268" r="4" fill="#509863" />
  <text x="272" y="264" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">日志</text>
  <text x="272" y="282" font-size="12" fill="#8f959e" text-anchor="middle">Logs</text>

  <!-- 4. Trace -->
  <rect x="210" y="340" width="110" height="56" rx="6" fill="#f5f5f5" stroke="#dee0e3" />
  <circle cx="224" cy="368" r="4" fill="#d4b45b" />
  <text x="272" y="364" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Trace</text>
  <text x="272" y="382" font-size="12" fill="#8f959e" text-anchor="middle">Tracing</text>

  <!-- 5. 采集 -->
  <rect x="370" y="240" width="110" height="56" rx="6" fill="#f5f5f5" stroke="#dee0e3" />
  <circle cx="384" cy="268" r="4" fill="#646a73" />
  <text x="432" y="264" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">采集</text>
  <text x="432" y="282" font-size="12" fill="#8f959e" text-anchor="middle">Collector</text>

  <!-- 6. 存储分析 -->
  <rect x="510" y="240" width="110" height="56" rx="6" fill="#f0f4fc" stroke="#dee0e3" />
  <circle cx="524" cy="268" r="4" fill="#5178c6" />
  <text x="572" y="264" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">存储分析</text>
  <text x="572" y="282" font-size="12" fill="#8f959e" text-anchor="middle">Storage</text>

  <!-- 7. 看板 -->
  <rect x="650" y="150" width="110" height="56" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <circle cx="664" cy="178" r="4" fill="#5178c6" />
  <text x="712" y="174" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">数据看板</text>
  <text x="712" y="192" font-size="12" fill="#8f959e" text-anchor="middle">Dashboard</text>

  <!-- 8. 告警 -->
  <rect x="650" y="240" width="110" height="56" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <circle cx="664" cy="268" r="4" fill="#d25d5a" />
  <text x="712" y="264" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">监控告警</text>
  <text x="712" y="282" font-size="12" fill="#8f959e" text-anchor="middle">Alerting</text>

  <!-- 9. 值班响应 -->
  <rect x="800" y="236" width="110" height="64" rx="6" fill="#eae2fe" stroke="#dee0e3" />
  <circle cx="814" cy="268" r="4" fill="#8569cb" />
  <text x="862" y="264" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">值班响应</text>
  <text x="862" y="282" font-size="12" fill="#8f959e" text-anchor="middle">Response</text>

  <!-- 10. 定位分析 -->
  <rect x="940" y="236" width="110" height="64" rx="6" fill="#eae2fe" stroke="#dee0e3" />
  <circle cx="954" cy="268" r="4" fill="#8569cb" />
  <text x="1002" y="264" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">定位分析</text>
  <text x="1002" y="282" font-size="12" fill="#8f959e" text-anchor="middle">Root Cause</text>

  <!-- 11. 故障修复 -->
  <rect x="1080" y="236" width="110" height="64" rx="6" fill="#eae2fe" stroke="#dee0e3" />
  <circle cx="1094" cy="268" r="4" fill="#8569cb" />
  <text x="1142" y="264" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">故障修复</text>
  <text x="1142" y="282" font-size="12" fill="#8f959e" text-anchor="middle">Recovery</text>

  <!-- 12. 闭环验证 -->
  <rect x="1220" y="236" width="110" height="64" rx="6" fill="#eae2fe" stroke="#dee0e3" />
  <circle cx="1234" cy="268" r="4" fill="#509863" />
  <text x="1282" y="264" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">闭环验证</text>
  <text x="1282" y="282" font-size="12" fill="#8f959e" text-anchor="middle">Verification</text>

</svg>
