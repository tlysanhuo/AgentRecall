<svg width="1200" height="760" viewBox="0 0 1200 760" xmlns="http://www.w3.org/2000/svg">
  <!-- 纯白背景基底 -->
  <rect x="0" y="0" width="1200" height="760" fill="#ffffff" />

  <!-- 背景分色块（马卡龙糖果色底托） -->
  <!-- 左上：极浅蓝 -->
  <rect x="40" y="60" width="420" height="200" rx="24" fill="#f0f4fc" />
  <!-- 左中：极淡薄荷绿 -->
  <rect x="40" y="280" width="420" height="200" rx="24" fill="#dff5e5" />
  <!-- 左下：浅桃色 -->
  <rect x="40" y="500" width="420" height="200" rx="24" fill="#fee3e2" />

  <!-- 右上：浅桃色 -->
  <rect x="740" y="60" width="420" height="200" rx="24" fill="#fee3e2" />
  <!-- 右中：极浅蓝 -->
  <rect x="740" y="280" width="420" height="200" rx="24" fill="#f0f4fc" />
  <!-- 右下：极淡薄荷绿 -->
  <rect x="740" y="500" width="420" height="200" rx="24" fill="#dff5e5" />

  <!-- 中心区域底板：浅靛青色 -->
  <rect x="480" y="300" width="240" height="160" rx="32" fill="#d6dcf3" />

  <!-- ================= 核心连接线 ================= -->
  <!-- 公共线型配置 -->
  <g stroke="#dee0e3" stroke-width="2" fill="none" stroke-linejoin="round">

    <!-- ====== 中心发散到左侧分支 ====== -->
    <!-- 至左上 -->
    <polyline points="520,360 480,360 480,160 430,160" />
    <!-- 至左中 -->
    <line x1="520" y1="380" x2="430" y2="380" />
    <!-- 至左下 -->
    <polyline points="520,400 480,400 480,600 430,600" />

    <!-- ====== 中心发散到右侧分支 ====== -->
    <!-- 至右上 -->
    <polyline points="680,360 720,360 720,160 770,160" />
    <!-- 至右中 -->
    <line x1="680" y1="380" x2="770" y2="380" />
    <!-- 至右下 -->
    <polyline points="680,400 720,400 720,600 770,600" />

    <!-- ====== 左侧分支到子节点 ====== -->
    <!-- 左上 (核心概念) -->
    <polyline points="300,160 250,160 250,110 200,110" />
    <line x1="300" y1="160" x2="200" y2="160" />
    <polyline points="300,160 250,160 250,210 200,210" />
    <!-- 左中 (工作原理) -->
    <polyline points="300,380 250,380 250,330 200,330" />
    <line x1="300" y1="380" x2="200" y2="380" />
    <polyline points="300,380 250,380 250,430 200,430" />
    <!-- 左下 (关键组件) -->
    <polyline points="300,600 250,600 250,550 200,550" />
    <line x1="300" y1="600" x2="200" y2="600" />
    <polyline points="300,600 250,600 250,650 200,650" />

    <!-- ====== 右侧分支到子节点 ====== -->
    <!-- 右上 (实践方法) -->
    <polyline points="900,160 950,160 950,110 1000,110" />
    <line x1="900" y1="160" x2="1000" y2="160" />
    <polyline points="900,160 950,160 950,210 1000,210" />
    <!-- 右中 (常见问题) -->
    <polyline points="900,380 950,380 950,330 1000,330" />
    <line x1="900" y1="380" x2="1000" y2="380" />
    <polyline points="900,380 950,380 950,430 1000,430" />
    <!-- 右下 (生态工具) -->
    <polyline points="900,600 950,600 950,550 1000,550" />
    <line x1="900" y1="600" x2="1000" y2="600" />
    <polyline points="900,600 950,600 950,650 1000,650" />
  </g>

  <!-- ================= 纯白无边框卡片节点 ================= -->

  <!-- 左侧一级分支 -->
  <rect x="300" y="140" width="130" height="40" rx="12" fill="#ffffff" />
  <text x="365" y="165" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle" dominant-baseline="central">核心概念</text>

  <rect x="300" y="360" width="130" height="40" rx="12" fill="#ffffff" />
  <text x="365" y="385" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle" dominant-baseline="central">工作原理</text>

  <rect x="300" y="580" width="130" height="40" rx="12" fill="#ffffff" />
  <text x="365" y="605" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle" dominant-baseline="central">关键组件</text>

  <!-- 右侧一级分支 -->
  <rect x="770" y="140" width="130" height="40" rx="12" fill="#ffffff" />
  <text x="835" y="165" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle" dominant-baseline="central">实践方法</text>

  <rect x="770" y="360" width="130" height="40" rx="12" fill="#ffffff" />
  <text x="835" y="385" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle" dominant-baseline="central">常见问题</text>

  <rect x="770" y="580" width="130" height="40" rx="12" fill="#ffffff" />
  <text x="835" y="605" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle" dominant-baseline="central">生态工具</text>


  <!-- 左侧二级叶子节点 -->
  <g fill="#ffffff">
    <rect x="80" y="92" width="120" height="36" rx="8" />
    <rect x="80" y="142" width="120" height="36" rx="8" />
    <rect x="80" y="192" width="120" height="36" rx="8" />

    <rect x="80" y="312" width="120" height="36" rx="8" />
    <rect x="80" y="362" width="120" height="36" rx="8" />
    <rect x="80" y="412" width="120" height="36" rx="8" />

    <rect x="80" y="532" width="120" height="36" rx="8" />
    <rect x="80" y="582" width="120" height="36" rx="8" />
    <rect x="80" y="632" width="120" height="36" rx="8" />
  </g>

  <!-- 左侧二级叶子文字 -->
  <g font-size="14" fill="#646a73" text-anchor="middle" dominant-baseline="central">
    <text x="140" y="110">基础定义</text>
    <text x="140" y="160">核心架构</text>
    <text x="140" y="210">演进历程</text>

    <text x="140" y="330">请求链路</text>
    <text x="140" y="380">数据流转</text>
    <text x="140" y="430">调度机制</text>

    <text x="140" y="550">接入网关层</text>
    <text x="140" y="600">计算处理组</text>
    <text x="140" y="650">底层存储库</text>
  </g>

  <!-- 右侧二级叶子节点 -->
  <g fill="#ffffff">
    <rect x="1000" y="92" width="120" height="36" rx="8" />
    <rect x="1000" y="142" width="120" height="36" rx="8" />
    <rect x="1000" y="192" width="120" height="36" rx="8" />

    <rect x="1000" y="312" width="120" height="36" rx="8" />
    <rect x="1000" y="362" width="120" height="36" rx="8" />
    <rect x="1000" y="412" width="120" height="36" rx="8" />

    <rect x="1000" y="532" width="120" height="36" rx="8" />
    <rect x="1000" y="582" width="120" height="36" rx="8" />
    <rect x="1000" y="632" width="120" height="36" rx="8" />
  </g>

  <!-- 右侧二级叶子文字 -->
  <g font-size="14" fill="#646a73" text-anchor="middle" dominant-baseline="central">
    <text x="1060" y="110">部署方案</text>
    <text x="1060" y="160">性能调优</text>
    <text x="1060" y="210">安全策略</text>

    <text x="1060" y="330">网络抖动</text>
    <text x="1060" y="380">内存溢出</text>
    <text x="1060" y="430">数据防丢</text>

    <text x="1060" y="550">CLI 工具</text>
    <text x="1060" y="600">可视化面板</text>
    <text x="1060" y="650">官方插件库</text>
  </g>

  <!-- ================= 绝对中心节点 ================= -->
  <rect x="520" y="340" width="160" height="80" rx="16" fill="#ffffff" />
  <text x="600" y="372" font-size="20" font-weight="bold" fill="#1f2329" text-anchor="middle">某技术</text>
  <text x="600" y="400" font-size="14" fill="#8f959e" text-anchor="middle">全景知识脑图</text>

</svg>
