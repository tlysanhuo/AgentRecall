<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="600" viewBox="0 0 1680 600">
  <defs>
    <!-- 通用连线箭头 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#bbbfc4" />
    </marker>
  </defs>

  <!-- 全局标题 -->
  <text x="40" y="60" font-size="20" font-weight="bold" fill="#1f2329">Git Feature Branch &amp; PR Review 泳道图</text>

  <!-- 泳道背景框架 -->
  <rect x="40" y="100" width="1600" height="460" rx="8" fill="#ffffff" stroke="#bbbfc4" stroke-width="1.5" />

  <!-- 泳道分隔线 -->
  <line x1="40" y1="240" x2="1640" y2="240" stroke="#dee0e3" stroke-width="1.5" />
  <line x1="40" y1="400" x2="1640" y2="400" stroke="#dee0e3" stroke-width="1.5" />
  <line x1="140" y1="100" x2="140" y2="560" stroke="#dee0e3" stroke-width="1.5" />

  <!-- 泳道标题 (左侧) -->
  <g text-anchor="middle">
    <text x="90" y="165" font-size="14" font-weight="bold" fill="#1f2329">开发者</text>
    <text x="90" y="183" font-size="12" fill="#8f959e">Developer</text>

    <text x="90" y="315" font-size="14" font-weight="bold" fill="#1f2329">自动集成</text>
    <text x="90" y="333" font-size="12" fill="#8f959e">CI</text>

    <text x="90" y="475" font-size="14" font-weight="bold" fill="#1f2329">审核人</text>
    <text x="90" y="493" font-size="12" fill="#8f959e">Reviewer</text>
  </g>

  <!-- ==================== 连线层 (底层) ==================== -->

  <!-- 开发者泳道内部流转 -->
  <polyline points="270,170 310,170" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="430,170 470,170" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="590,170 630,170" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 跨泳道流转 -->
  <polyline points="750,170 860,170 860,270" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="920,320 950,320 950,480 970,480" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="1120,480 1170,480" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="1290,480 1315,480 1315,170 1330,170" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="1450,170 1490,170" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 回流反馈连线 (防遮挡正交路由) -->
  <!-- CI 失败回流 -->
  <polyline points="860,280 860,225 395,225 395,198" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- Review 修改回流 -->
  <polyline points="1050,440 1050,385 355,385 355,198" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 连线说明标签 -->
  <text x="805" y="162" font-size="12" fill="#8f959e" text-anchor="middle">触发检查</text>
  <text x="960" y="405" font-size="12" fill="#509863">通过 (Pass)</text>
  <text x="1325" y="325" font-size="12" fill="#509863">自动触发</text>

  <text x="620" y="218" font-size="12" fill="#d25d5a" text-anchor="middle">检查失败 (Fail)</text>
  <text x="700" y="378" font-size="12" fill="#d48e5b" text-anchor="middle">需修改 (Needs Work)</text>

  <!-- ==================== 节点层 ==================== -->

  <!-- [Developer] C1: Create Branch -->
  <g transform="translate(160, 146)">
    <rect x="0" y="0" width="110" height="48" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
    <text x="55" y="19" font-size="14" fill="#5178c6" font-weight="bold" text-anchor="middle">创建分支</text>
    <text x="55" y="37" font-size="12" fill="#5178c6" text-anchor="middle">Create branch</text>
  </g>

  <!-- [Developer] C2: Commit -->
  <g transform="translate(320, 146)">
    <rect x="0" y="0" width="110" height="48" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
    <text x="55" y="19" font-size="14" fill="#5178c6" font-weight="bold" text-anchor="middle">提交代码</text>
    <text x="55" y="37" font-size="12" fill="#5178c6" text-anchor="middle">commit</text>
  </g>

  <!-- [Developer] C3: Push -->
  <g transform="translate(480, 146)">
    <rect x="0" y="0" width="110" height="48" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
    <text x="55" y="19" font-size="14" fill="#5178c6" font-weight="bold" text-anchor="middle">推送到远端</text>
    <text x="55" y="37" font-size="12" fill="#5178c6" text-anchor="middle">push</text>
  </g>

  <!-- [Developer] C4: Create PR (关键节点 - 紫色) -->
  <g transform="translate(640, 146)">
    <rect x="0" y="0" width="110" height="48" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
    <text x="55" y="19" font-size="14" fill="#8569cb" font-weight="bold" text-anchor="middle">发起合并请求</text>
    <text x="55" y="37" font-size="12" fill="#8569cb" text-anchor="middle">Create PR</text>
  </g>

  <!-- [CI] C5: Auto Check (分支条件 - 靛青色) -->
  <g transform="translate(800, 280)">
    <polygon points="60,0 120,40 60,80 0,40" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
    <text x="60" y="36" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">自动检查</text>
    <text x="60" y="54" font-size="12" fill="#1f2329" text-anchor="middle">Auto Check</text>
  </g>

  <!-- [Reviewer] C6: Manual Review (分支条件 - 黄色) -->
  <g transform="translate(980, 440)">
    <polygon points="70,0 140,40 70,80 0,40" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
    <text x="70" y="36" font-size="14" fill="#d4b45b" font-weight="bold" text-anchor="middle">人工 Review</text>
    <text x="70" y="54" font-size="12" fill="#d4b45b" text-anchor="middle">Manual Review</text>
  </g>

  <!-- [Reviewer] C7: Approve (成功节点 - 绿色) -->
  <g transform="translate(1180, 456)">
    <rect x="0" y="0" width="110" height="48" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
    <text x="55" y="19" font-size="14" fill="#509863" font-weight="bold" text-anchor="middle">审核批准</text>
    <text x="55" y="37" font-size="12" fill="#509863" text-anchor="middle">Approve</text>
  </g>

  <!-- [Developer] C8: Merge (晋级节点 - 绿色) -->
  <g transform="translate(1340, 146)">
    <rect x="0" y="0" width="110" height="48" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
    <text x="55" y="19" font-size="14" fill="#509863" font-weight="bold" text-anchor="middle">合并代码</text>
    <text x="55" y="37" font-size="12" fill="#509863" text-anchor="middle">merge</text>
  </g>

  <!-- [Developer] C9: Delete Branch (完结/失败节点 - 红色) -->
  <g transform="translate(1500, 146)">
    <rect x="0" y="0" width="120" height="48" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
    <text x="60" y="19" font-size="14" fill="#d25d5a" font-weight="bold" text-anchor="middle">删除分支</text>
    <text x="60" y="37" font-size="12" fill="#d25d5a" text-anchor="middle">Delete branch</text>
  </g>

</svg>
