<svg width="1040" height="780" viewBox="0 0 1040 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 常规连线箭头 (灰) -->
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#bbbfc4" />
    </marker>
    <!-- 通道主线箭头 (灰蓝) -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <polygon points="0,0 10,5 0,10" fill="#5263a5" />
    </marker>
  </defs>

  <!-- 顶层 Client -->
  <rect x="440" y="40" width="160" height="50" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="520" y="70" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Client Applications</text>

  <!-- Client 到 Gateway 连线 -->
  <line x1="520" y1="90" x2="520" y2="135" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-gray)" />

  <!-- API Gateway 层 -->
  <rect x="220" y="140" width="600" height="50" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="520" y="170" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">API Gateway</text>

  <!-- 左侧大通道 (Cache Access) -->
  <polyline points="220,165 70,165 70,620 115,620" fill="none" stroke="#5263a5" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="15" y="320" font-size="12" fill="#5263a5">
    <tspan x="15" dy="0">Cache</tspan>
    <tspan x="15" dy="16">Access</tspan>
  </text>
  <circle cx="220" cy="165" r="3" fill="#5263a5" />

  <!-- 右侧大通道 (Telemetry Bus) -->
  <polyline points="820,165 970,165 970,700 925,700" fill="none" stroke="#5263a5" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="980" y="320" font-size="12" fill="#5263a5">
    <tspan x="980" dy="0">Telemetry</tspan>
    <tspan x="980" dy="16">&amp; Metrics</tspan>
  </text>
  <circle cx="820" cy="165" r="3" fill="#5263a5" />

  <!-- 网关到领域的下发连线 -->
  <line x1="240" y1="190" x2="240" y2="255" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <line x1="520" y1="190" x2="520" y2="255" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <line x1="800" y1="190" x2="800" y2="255" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-gray)" />

  <!-- 领域 1：User Domain (绿色组) -->
  <rect x="130" y="260" width="220" height="220" rx="8" fill="#ffffff" stroke="#509863" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="240" y="285" font-size="14" font-weight="bold" fill="#509863" text-anchor="middle">User Domain</text>

  <rect x="150" y="300" width="180" height="40" rx="4" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="240" y="325" font-size="14" fill="#1f2329" text-anchor="middle">User Service</text>

  <rect x="190" y="410" width="100" height="40" rx="4" fill="#ffffff" stroke="#509863" stroke-width="1.5" />
  <text x="240" y="435" font-size="12" fill="#1f2329" text-anchor="middle">[DB] User DB</text>

  <line x1="240" y1="340" x2="240" y2="405" stroke="#509863" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <!-- User 异步事件线 (完美避开 DB) -->
  <line x1="300" y1="340" x2="300" y2="515" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-gray)" />
  <text x="305" y="470" font-size="12" fill="#8f959e">Event</text>

  <!-- 领域 2：Order Domain (黄色组) -->
  <rect x="410" y="260" width="220" height="220" rx="8" fill="#ffffff" stroke="#d4b45b" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="520" y="285" font-size="14" font-weight="bold" fill="#d4b45b" text-anchor="middle">Order Domain</text>

  <rect x="430" y="300" width="180" height="40" rx="4" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="520" y="325" font-size="14" fill="#1f2329" text-anchor="middle">Order Service</text>

  <rect x="470" y="410" width="100" height="40" rx="4" fill="#ffffff" stroke="#d4b45b" stroke-width="1.5" />
  <text x="520" y="435" font-size="12" fill="#1f2329" text-anchor="middle">[DB] Order DB</text>

  <line x1="520" y1="340" x2="520" y2="405" stroke="#d4b45b" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <!-- Order 异步事件线 -->
  <line x1="580" y1="340" x2="580" y2="515" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-gray)" />
  <text x="585" y="470" font-size="12" fill="#8f959e">Event</text>

  <!-- 领域 3：Inventory Domain (红色组) -->
  <rect x="690" y="260" width="220" height="220" rx="8" fill="#ffffff" stroke="#d25d5a" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="800" y="285" font-size="14" font-weight="bold" fill="#d25d5a" text-anchor="middle">Inventory Domain</text>

  <rect x="710" y="300" width="180" height="40" rx="4" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
  <text x="800" y="325" font-size="14" fill="#1f2329" text-anchor="middle">Inventory Service</text>

  <rect x="750" y="410" width="100" height="40" rx="4" fill="#ffffff" stroke="#d25d5a" stroke-width="1.5" />
  <text x="800" y="435" font-size="12" fill="#1f2329" text-anchor="middle">[DB] Inv DB</text>

  <line x1="800" y1="340" x2="800" y2="405" stroke="#d25d5a" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <!-- Inventory 异步事件线 -->
  <line x1="860" y1="340" x2="860" y2="515" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrow-gray)" />
  <text x="865" y="470" font-size="12" fill="#8f959e">Event</text>
  <!-- Inventory 发送指标汇入右通道 -->
  <line x1="890" y1="320" x2="970" y2="320" stroke="#5263a5" stroke-width="1.5" />
  <circle cx="890" cy="320" r="3" fill="#5263a5" />

  <!-- 领域层服务之间的同步水平依赖线 -->
  <!-- Order 调 User -->
  <line x1="430" y1="320" x2="335" y2="320" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <text x="380" y="312" font-size="12" fill="#8f959e" text-anchor="middle">Sync API</text>
  <!-- Order 调 Inventory -->
  <line x1="610" y1="320" x2="705" y2="320" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <text x="660" y="312" font-size="12" fill="#8f959e" text-anchor="middle">Sync API</text>

  <!-- 公共基建层：三段大横条 (灰蓝色组) -->
  <!-- Message Bus 横条 -->
  <rect x="120" y="520" width="800" height="40" rx="4" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
  <text x="520" y="545" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Message Bus (Kafka / RabbitMQ)</text>
  <!-- Msg Bus 右端汇入遥测通道 -->
  <line x1="920" y1="540" x2="970" y2="540" stroke="#5263a5" stroke-width="1.5" />
  <circle cx="920" cy="540" r="3" fill="#5263a5" />

  <!-- Cache 横条 -->
  <rect x="120" y="600" width="800" height="40" rx="4" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
  <text x="520" y="625" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Distributed Cache Layer (Redis)</text>
  <!-- Cache 右端汇入遥测通道 -->
  <line x1="920" y1="620" x2="970" y2="620" stroke="#5263a5" stroke-width="1.5" />
  <circle cx="920" cy="620" r="3" fill="#5263a5" />

  <!-- Observability 横条 -->
  <rect x="120" y="680" width="800" height="40" rx="4" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
  <text x="520" y="705" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Observability Platform (Metrics / Tracing / Logs)</text>

</svg>
