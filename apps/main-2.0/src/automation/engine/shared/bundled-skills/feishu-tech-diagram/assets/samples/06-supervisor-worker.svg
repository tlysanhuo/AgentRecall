<svg width="960" height="600" viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg">
  <!-- 预定义箭头及阴影(如适用)，这里只使用基础Marker以符合约束 -->
  <defs>
    <!-- 主流程箭头 (派发/内部流转) - 紫色 -->
    <marker id="arrow-primary" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8569cb" />
    </marker>
    <!-- 回传箭头 - 蓝色 -->
    <marker id="arrow-return" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#5263a5" />
    </marker>
    <!-- 返工箭头 - 红色 -->
    <marker id="arrow-reject" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d25d5a" />
    </marker>
    <!-- 成功箭头 - 绿色 -->
    <marker id="arrow-success" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#509863" />
    </marker>
  </defs>

  <!-- 全局背景底色（白板默认透明或纯白） -->
  <rect x="0" y="0" width="960" height="600" fill="#ffffff" />

  <!-- =============================== -->
  <!-- 区域底板与外围逻辑框              -->
  <!-- =============================== -->

  <!-- Supervisor 逻辑域外框 -->
  <rect x="220" y="80" width="320" height="400" rx="8" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="380" y="115" font-size="16" font-weight="bold" fill="#5A4198" text-anchor="middle">Supervisor (主管中枢域)</text>
  <!-- Supervisor 内部装饰小说明 -->
  <rect x="235" y="240" width="105" height="50" rx="4" fill="none" stroke="#bbbfc4" stroke-width="1" stroke-dasharray="2,2" />
  <text x="287" y="260" font-size="11" fill="#646a73" text-anchor="middle">基于全局上下文的</text>
  <text x="287" y="275" font-size="11" fill="#646a73" text-anchor="middle">意图与调度控制</text>

  <!-- Workers 并发域外框 -->
  <rect x="630" y="80" width="220" height="400" rx="8" fill="#f5f5f5" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="740" y="115" font-size="16" font-weight="bold" fill="#646a73" text-anchor="middle">Worker (并发执行池)</text>

  <!-- =============================== -->
  <!-- 核心连线层 (放在节点下方避免遮挡)  -->
  <!-- =============================== -->
  <g id="connections">
    <!-- 1. 外部进入主管 -->
    <line x1="160" y1="180" x2="234" y2="180" fill="none" stroke="#8569cb" stroke-width="1.5" marker-end="url(#arrow-primary)" />

    <!-- 2. 主管内部流转 (接收 -> 拆分) -->
    <line x1="340" y1="180" x2="374" y2="180" fill="none" stroke="#8569cb" stroke-width="1.5" marker-end="url(#arrow-primary)" />

    <!-- 3. 主流程派发线 (紫线) 扇出 -->
    <polyline points="510,180 560,180 560,420" fill="none" stroke="#8569cb" stroke-width="1.5" />
    <circle cx="560" cy="180" r="3" fill="#8569cb" />
    <circle cx="560" cy="300" r="3" fill="#8569cb" />
    <!-- 派发分支至对应 Worker 左侧 -->
    <line x1="560" y1="180" x2="654" y2="180" fill="none" stroke="#8569cb" stroke-width="1.5" marker-end="url(#arrow-primary)" />
    <line x1="560" y1="300" x2="654" y2="300" fill="none" stroke="#8569cb" stroke-width="1.5" marker-end="url(#arrow-primary)" />
    <line x1="560" y1="420" x2="654" y2="420" fill="none" stroke="#8569cb" stroke-width="1.5" marker-end="url(#arrow-primary)" />
    <!-- 派发线说明 -->
    <rect x="566" y="244" width="2" height="12" fill="#8569cb" />
    <text x="572" y="254" font-size="12" fill="#8569cb">多路并行派发</text>

    <!-- 4. 结果回传线 (蓝线) 扇入包围 -->
    <!-- W 右侧汇聚支线 -->
    <line x1="820" y1="180" x2="880" y2="180" fill="none" stroke="#5263a5" stroke-width="1.5" />
    <line x1="820" y1="300" x2="880" y2="300" fill="none" stroke="#5263a5" stroke-width="1.5" />
    <circle cx="880" cy="180" r="3" fill="#5263a5" />
    <circle cx="880" cy="300" r="3" fill="#5263a5" />
    <!-- 回传下行包围外环线 -->
    <polyline points="820,420 880,420 880,520 440,520 440,431" fill="none" stroke="#5263a5" stroke-width="1.5" marker-end="url(#arrow-return)" />
    <!-- 回传线说明 -->
    <rect x="866" y="344" width="2" height="12" fill="#5263a5" />
    <text x="792" y="354" font-size="12" fill="#5263a5">上传节点输出</text>
    <rect x="600" y="508" width="12" height="2" fill="#5263a5" />
    <text x="616" y="514" font-size="12" fill="#5263a5">底层通道: 统一结果入流与映射</text>

    <!-- 5. 驳回返工线 (红线) 纵向干道及穿插 -->
    <polyline points="500,390 600,390 600,120" fill="none" stroke="#d25d5a" stroke-width="1.5" />
    <circle cx="600" cy="240" r="3" fill="#d25d5a" />
    <circle cx="600" cy="360" r="3" fill="#d25d5a" />
    <!-- 返工分支至对应 Worker 顶侧入口 -->
    <polyline points="600,120 740,120 740,134" fill="none" stroke="#d25d5a" stroke-width="1.5" marker-end="url(#arrow-reject)" />
    <polyline points="600,240 740,240 740,254" fill="none" stroke="#d25d5a" stroke-width="1.5" marker-end="url(#arrow-reject)" />
    <polyline points="600,360 740,360 740,374" fill="none" stroke="#d25d5a" stroke-width="1.5" marker-end="url(#arrow-reject)" />
    <!-- 驳回说明 -->
    <rect x="606" y="204" width="2" height="12" fill="#d25d5a" />
    <text x="612" y="214" font-size="12" fill="#d25d5a">阻断: 不通过则返工</text>

    <!-- 6. 最终结果输出 (绿线) 向左侧 -->
    <line x1="350" y1="390" x2="256" y2="390" fill="none" stroke="#509863" stroke-width="1.5" marker-end="url(#arrow-success)" />
  </g>

  <!-- =============================== -->
  <!-- 各独立业务卡片与节点              -->
  <!-- =============================== -->

  <!-- 输入：外部目标 -->
  <g id="input-target">
    <rect x="40" y="150" width="120" height="60" rx="6" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
    <!-- 内部装饰 -->
    <rect x="40" y="150" width="4" height="60" rx="2" fill="#d4b45b" />
    <text x="100" y="175" font-size="14" font-weight="bold" fill="#d4b45b" text-anchor="middle">业务目标</text>
    <text x="100" y="195" font-size="12" fill="#d4b45b" text-anchor="middle">(输入参数/Prompt)</text>
  </g>

  <!-- Supervisor 卡片 1：接收目标 -->
  <g id="node-receive">
    <rect x="240" y="145" width="100" height="70" rx="6" fill="#ffffff" stroke="#8569cb" stroke-width="1.5" />
    <rect x="240" y="145" width="4" height="70" rx="2" fill="#8569cb" />
    <text x="290" y="170" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">接收目标</text>
    <text x="290" y="195" font-size="12" fill="#646a73" text-anchor="middle">解析意图与约束</text>
  </g>

  <!-- Supervisor 卡片 2：规划与拆分 -->
  <g id="node-plan">
    <rect x="380" y="145" width="130" height="70" rx="6" fill="#ffffff" stroke="#8569cb" stroke-width="1.5" />
    <rect x="380" y="145" width="4" height="70" rx="2" fill="#8569cb" />
    <text x="445" y="170" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">规划与拆分</text>
    <text x="445" y="190" font-size="12" fill="#646a73" text-anchor="middle">生成执行子任务</text>
    <text x="445" y="205" font-size="12" fill="#646a73" text-anchor="middle">依赖关系编排</text>
  </g>

  <!-- Supervisor 卡片 3：汇总与验收 -->
  <g id="node-verify">
    <rect x="350" y="355" width="150" height="70" rx="6" fill="#ffffff" stroke="#8569cb" stroke-width="1.5" />
    <rect x="350" y="355" width="4" height="70" rx="2" fill="#8569cb" />
    <text x="425" y="380" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">汇总与验收</text>
    <text x="425" y="400" font-size="12" fill="#646a73" text-anchor="middle">聚合 Worker 产出</text>
    <text x="425" y="415" font-size="12" fill="#d25d5a" text-anchor="middle">校验标准及逻辑闭环</text>
  </g>

  <!-- 输出：验收通过节点 -->
  <g id="output-success">
    <rect x="140" y="375" width="110" height="30" rx="15" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
    <circle cx="155" cy="390" r="6" fill="#509863" />
    <!-- 对勾图标 -->
    <path d="M 152 390 L 154 392 L 158 387" stroke="#ffffff" stroke-width="1.5" fill="none" />
    <text x="202" y="394" font-size="13" font-weight="bold" fill="#509863" text-anchor="middle">最终结果输出</text>
  </g>

  <!-- Worker 卡片群 -->
  <g id="workers-group">
    <!-- W1：研究 Worker -->
    <rect x="660" y="140" width="160" height="80" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
    <rect x="660" y="140" width="4" height="80" rx="2" fill="#5178c6" />
    <text x="740" y="165" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">研究 Worker</text>
    <text x="740" y="185" font-size="12" fill="#646a73" text-anchor="middle">• 广度信息定向采集</text>
    <text x="740" y="200" font-size="12" fill="#646a73" text-anchor="middle">• 提供基础决策数据</text>

    <!-- W2：执行 Worker -->
    <rect x="660" y="260" width="160" height="80" rx="6" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
    <rect x="660" y="260" width="4" height="80" rx="2" fill="#5263a5" />
    <text x="740" y="285" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">执行 Worker</text>
    <text x="740" y="305" font-size="12" fill="#646a73" text-anchor="middle">• 核心任务指令推进</text>
    <text x="740" y="320" font-size="12" fill="#646a73" text-anchor="middle">• 产出结构化中间态</text>

    <!-- W3：验证 Worker -->
    <rect x="660" y="380" width="160" height="80" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
    <rect x="660" y="380" width="4" height="80" rx="2" fill="#509863" />
    <text x="740" y="405" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">验证 Worker</text>
    <text x="740" y="425" font-size="12" fill="#646a73" text-anchor="middle">• 交叉校验局部逻辑</text>
    <text x="740" y="440" font-size="12" fill="#646a73" text-anchor="middle">• 评估偏差与格式对齐</text>
  </g>

</svg>
