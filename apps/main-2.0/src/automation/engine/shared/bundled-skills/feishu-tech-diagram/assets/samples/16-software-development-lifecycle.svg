<svg width="1768" height="260" viewBox="0 0 1768 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 2 L 8 5 L 0 8 Z" fill="#bbbfc4"/>
    </marker>
  </defs>

  <!-- 全局标题 -->
  <text x="60" y="36" font-size="20" font-weight="bold" fill="#1f2329">软件研发全流程与产物门禁</text>

  <!-- 阶段连线层 -->
  <g id="flow-lines">
    <line x1="204" y1="125" x2="242" y2="125" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="392" y1="125" x2="430" y2="125" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="580" y1="125" x2="618" y2="125" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="768" y1="125" x2="806" y2="125" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="956" y1="125" x2="994" y2="125" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1144" y1="125" x2="1182" y2="125" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1332" y1="125" x2="1370" y2="125" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="1520" y1="125" x2="1558" y2="125" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- 阶段 1: 需求提出 (第1组 - 紫色) -->
  <g id="phase-01">
    <rect x="60" y="60" width="144" height="130" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5"/>
    <text x="132" y="82" font-size="12" fill="#8569cb" text-anchor="middle">Phase 01</text>
    <text x="132" y="104" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">需求提出</text>
    <line x1="72" y1="116" x2="192" y2="116" stroke="#8569cb" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="68" y="126" width="128" height="52" rx="4" fill="#ffffff" stroke="#8569cb" stroke-width="1"/>
    <text x="132" y="146" font-size="12" fill="#8f959e" text-anchor="middle">关键产物</text>
    <text x="132" y="166" font-size="13" font-weight="bold" fill="#8569cb" text-anchor="middle">原始需求池</text>
  </g>

  <!-- 阶段 2: 需求评审 (第1组 - 紫色) -->
  <g id="phase-02">
    <rect x="248" y="60" width="144" height="130" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5"/>
    <text x="320" y="82" font-size="12" fill="#8569cb" text-anchor="middle">Phase 02</text>
    <text x="320" y="104" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">需求评审</text>
    <line x1="260" y1="116" x2="380" y2="116" stroke="#8569cb" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="256" y="126" width="128" height="52" rx="4" fill="#ffffff" stroke="#8569cb" stroke-width="1"/>
    <text x="320" y="146" font-size="12" fill="#8f959e" text-anchor="middle">门禁条件</text>
    <text x="320" y="166" font-size="13" font-weight="bold" fill="#8569cb" text-anchor="middle">PRD 定稿基线</text>
  </g>

  <!-- 阶段 3: 技术设计 (第2组 - 蓝色) -->
  <g id="phase-03">
    <rect x="436" y="60" width="144" height="130" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5"/>
    <text x="508" y="82" font-size="12" fill="#5178c6" text-anchor="middle">Phase 03</text>
    <text x="508" y="104" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">技术设计</text>
    <line x1="448" y1="116" x2="568" y2="116" stroke="#5178c6" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="444" y="126" width="128" height="52" rx="4" fill="#ffffff" stroke="#5178c6" stroke-width="1"/>
    <text x="508" y="146" font-size="12" fill="#8f959e" text-anchor="middle">关键产物</text>
    <text x="508" y="166" font-size="13" font-weight="bold" fill="#5178c6" text-anchor="middle">技术设计文档</text>
  </g>

  <!-- 阶段 4: 开发阶段 (第2组 - 蓝色) -->
  <g id="phase-04">
    <rect x="624" y="60" width="144" height="130" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5"/>
    <text x="696" y="82" font-size="12" fill="#5178c6" text-anchor="middle">Phase 04</text>
    <text x="696" y="104" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">开发阶段</text>
    <line x1="636" y1="116" x2="756" y2="116" stroke="#5178c6" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="632" y="126" width="128" height="52" rx="4" fill="#ffffff" stroke="#5178c6" stroke-width="1"/>
    <text x="696" y="146" font-size="12" fill="#8f959e" text-anchor="middle">关键产物</text>
    <text x="696" y="166" font-size="13" font-weight="bold" fill="#5178c6" text-anchor="middle">功能代码提交</text>
  </g>

  <!-- 阶段 5: 代码评审 (第3组 - 靛青色) -->
  <g id="phase-05">
    <rect x="812" y="60" width="144" height="130" rx="6" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5"/>
    <text x="884" y="82" font-size="12" fill="#5263a5" text-anchor="middle">Phase 05</text>
    <text x="884" y="104" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">代码评审</text>
    <line x1="824" y1="116" x2="944" y2="116" stroke="#5263a5" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="820" y="126" width="128" height="52" rx="4" fill="#ffffff" stroke="#5263a5" stroke-width="1"/>
    <text x="884" y="146" font-size="12" fill="#8f959e" text-anchor="middle">门禁条件</text>
    <text x="884" y="166" font-size="13" font-weight="bold" fill="#5263a5" text-anchor="middle">CR 通过准入</text>
  </g>

  <!-- 阶段 6: 测试验证 (第4组 - 绿色) -->
  <g id="phase-06">
    <rect x="1000" y="60" width="144" height="130" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5"/>
    <text x="1072" y="82" font-size="12" fill="#509863" text-anchor="middle">Phase 06</text>
    <text x="1072" y="104" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">测试验证</text>
    <line x1="1012" y1="116" x2="1132" y2="116" stroke="#509863" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="1008" y="126" width="128" height="52" rx="4" fill="#ffffff" stroke="#509863" stroke-width="1"/>
    <text x="1072" y="146" font-size="12" fill="#8f959e" text-anchor="middle">关键产物</text>
    <text x="1072" y="166" font-size="13" font-weight="bold" fill="#509863" text-anchor="middle">测试通过报告</text>
  </g>

  <!-- 阶段 7: 灰度发布 (第5组 - 黄色) -->
  <g id="phase-07">
    <rect x="1188" y="60" width="144" height="130" rx="6" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5"/>
    <text x="1260" y="82" font-size="12" fill="#d4b45b" text-anchor="middle">Phase 07</text>
    <text x="1260" y="104" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">灰度发布</text>
    <line x1="1200" y1="116" x2="1320" y2="116" stroke="#d4b45b" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="1196" y="126" width="128" height="52" rx="4" fill="#ffffff" stroke="#d4b45b" stroke-width="1"/>
    <text x="1260" y="146" font-size="12" fill="#8f959e" text-anchor="middle">门禁条件</text>
    <text x="1260" y="166" font-size="13" font-weight="bold" fill="#d4b45b" text-anchor="middle">灰度指标达标</text>
  </g>

  <!-- 阶段 8: 全量上线 (第5组 - 黄色) -->
  <g id="phase-08">
    <rect x="1376" y="60" width="144" height="130" rx="6" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5"/>
    <text x="1448" y="82" font-size="12" fill="#d4b45b" text-anchor="middle">Phase 08</text>
    <text x="1448" y="104" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">全量上线</text>
    <line x1="1388" y1="116" x2="1508" y2="116" stroke="#d4b45b" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="1384" y="126" width="128" height="52" rx="4" fill="#ffffff" stroke="#d4b45b" stroke-width="1"/>
    <text x="1448" y="146" font-size="12" fill="#8f959e" text-anchor="middle">门禁条件</text>
    <text x="1448" y="166" font-size="13" font-weight="bold" fill="#d4b45b" text-anchor="middle">线上故障清零</text>
  </g>

  <!-- 阶段 9: 监控复盘 (第6组 - 红色) -->
  <g id="phase-09">
    <rect x="1564" y="60" width="144" height="130" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5"/>
    <text x="1636" y="82" font-size="12" fill="#d25d5a" text-anchor="middle">Phase 09</text>
    <text x="1636" y="104" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">监控复盘</text>
    <line x1="1576" y1="116" x2="1696" y2="116" stroke="#d25d5a" stroke-width="1" stroke-dasharray="3,3"/>
    <rect x="1572" y="126" width="128" height="52" rx="4" fill="#ffffff" stroke="#d25d5a" stroke-width="1"/>
    <text x="1636" y="146" font-size="12" fill="#8f959e" text-anchor="middle">关键产物</text>
    <text x="1636" y="166" font-size="13" font-weight="bold" fill="#d25d5a" text-anchor="middle">业务洞察报告</text>
  </g>
</svg>
