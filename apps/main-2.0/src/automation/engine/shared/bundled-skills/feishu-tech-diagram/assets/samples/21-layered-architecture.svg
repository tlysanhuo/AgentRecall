<svg width="1280" height="800" viewBox="0 0 1280 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 常规向下依赖箭头 -->
    <marker id="arrow-down" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 6 5 L 0 8 z" fill="#8f959e" />
    </marker>
    <!-- 跨层旁路高亮箭头 -->
    <marker id="arrow-cross" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 2 L 6 5 L 0 8 z" fill="#d48e5b" />
    </marker>
  </defs>

  <!-- 全局背景 -->
  <rect width="1280" height="800" fill="#ffffff" />

  <!-- 顶部标题区 (更新为主标题+换行副标题，避免重叠并增加留白) -->
  <text x="100" y="50" font-size="24" font-weight="bold" fill="#1f2329">经典分层系统架构</text>
  <text x="100" y="76" font-size="14" fill="#8f959e">遵循自上而下严格依赖与管控的旁路直通能力设计</text>

  <!-- ============================================== -->
  <!-- 核心结构层容器区 (整体下移40px) -->
  <!-- ============================================== -->

  <!-- L1: 客户端层 (紫色组) -->
  <g id="layer-client">
    <rect x="100" y="120" width="960" height="80" rx="8" fill="#eae2fe" />
    <text x="120" y="156" font-size="16" font-weight="bold" fill="#8569cb">客户端层</text>
    <text x="120" y="176" font-size="12" fill="#8f959e">Client Layer</text>

    <!-- 组件节点 -->
    <rect x="320" y="140" width="220" height="40" rx="6" fill="#ffffff" stroke="#8569cb" stroke-width="1.5" />
    <text x="430" y="166" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Web 客户端</text>

    <rect x="580" y="140" width="220" height="40" rx="6" fill="#ffffff" stroke="#8569cb" stroke-width="1.5" />
    <text x="690" y="166" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">移动端 App</text>

    <rect x="840" y="140" width="220" height="40" rx="6" fill="#ffffff" stroke="#8569cb" stroke-width="1.5" />
    <text x="950" y="166" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">开放平台 (Open API)</text>
  </g>

  <!-- L2: 接入层 (浅蓝组) -->
  <g id="layer-gateway">
    <rect x="100" y="230" width="960" height="80" rx="8" fill="#f0f4fc" />
    <text x="120" y="266" font-size="16" font-weight="bold" fill="#5178c6">接入层</text>
    <text x="120" y="286" font-size="12" fill="#8f959e">API Gateway</text>

    <!-- 组件节点 -->
    <rect x="320" y="250" width="220" height="40" rx="6" fill="#ffffff" stroke="#5178c6" stroke-width="1.5" />
    <text x="430" y="276" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">负载均衡 (LB)</text>

    <rect x="580" y="250" width="220" height="40" rx="6" fill="#ffffff" stroke="#5178c6" stroke-width="1.5" />
    <text x="690" y="276" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">API 网关 (流量入口)</text>

    <rect x="840" y="250" width="220" height="40" rx="6" fill="#ffffff" stroke="#5178c6" stroke-width="1.5" />
    <text x="950" y="276" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">身份与认证网关</text>
  </g>

  <!-- L3: 应用层 (靛青色组) -->
  <g id="layer-application">
    <rect x="100" y="340" width="960" height="80" rx="8" fill="#d6dcf3" />
    <text x="120" y="376" font-size="16" font-weight="bold" fill="#5263a5">应用层</text>
    <text x="120" y="396" font-size="12" fill="#8f959e">Application Layer</text>

    <!-- 组件节点 -->
    <rect x="320" y="360" width="220" height="40" rx="6" fill="#ffffff" stroke="#5263a5" stroke-width="1.5" />
    <text x="430" y="386" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">交易聚合服务</text>

    <rect x="580" y="360" width="220" height="40" rx="6" fill="#ffffff" stroke="#5263a5" stroke-width="1.5" />
    <text x="690" y="386" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">用户支撑服务</text>

    <rect x="840" y="360" width="220" height="40" rx="6" fill="#ffffff" stroke="#5263a5" stroke-width="1.5" />
    <text x="950" y="386" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">消息路由分发</text>
  </g>

  <!-- L4: 领域层 (绿色组) -->
  <g id="layer-domain">
    <rect x="100" y="450" width="960" height="80" rx="8" fill="#dff5e5" />
    <text x="120" y="486" font-size="16" font-weight="bold" fill="#509863">领域层</text>
    <text x="120" y="506" font-size="12" fill="#8f959e">Domain Layer</text>

    <!-- 组件节点 -->
    <rect x="320" y="470" width="220" height="40" rx="6" fill="#ffffff" stroke="#509863" stroke-width="1.5" />
    <text x="430" y="496" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">订单领域模型</text>

    <rect x="580" y="470" width="220" height="40" rx="6" fill="#ffffff" stroke="#509863" stroke-width="1.5" />
    <text x="690" y="496" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">会员等级领域</text>

    <rect x="840" y="470" width="220" height="40" rx="6" fill="#ffffff" stroke="#509863" stroke-width="1.5" />
    <text x="950" y="496" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">事件通知策略</text>
  </g>

  <!-- L5: 基础设施层 (黄色组) -->
  <g id="layer-infrastructure">
    <rect x="100" y="560" width="960" height="80" rx="8" fill="#fef1ce" />
    <text x="120" y="596" font-size="16" font-weight="bold" fill="#d4b45b">基础设施层</text>
    <text x="120" y="616" font-size="12" fill="#8f959e">Infrastructure</text>

    <!-- 组件节点 -->
    <rect x="320" y="580" width="220" height="40" rx="6" fill="#ffffff" stroke="#d4b45b" stroke-width="1.5" />
    <text x="430" y="606" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">分布式缓存 (Redis)</text>

    <rect x="580" y="580" width="220" height="40" rx="6" fill="#ffffff" stroke="#d4b45b" stroke-width="1.5" />
    <text x="690" y="606" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">消息队列 (MQ)</text>

    <rect x="840" y="580" width="220" height="40" rx="6" fill="#ffffff" stroke="#d4b45b" stroke-width="1.5" />
    <text x="950" y="606" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">调度执行器</text>
  </g>

  <!-- L6: 数据存储层 (红色/粉色组) -->
  <g id="layer-data">
    <rect x="100" y="670" width="960" height="80" rx="8" fill="#fee3e2" />
    <text x="120" y="706" font-size="16" font-weight="bold" fill="#d25d5a">数据存储层</text>
    <text x="120" y="726" font-size="12" fill="#8f959e">Data Storage</text>

    <!-- 组件节点 -->
    <rect x="320" y="690" width="220" height="40" rx="6" fill="#ffffff" stroke="#d25d5a" stroke-width="1.5" />
    <text x="430" y="716" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">关系型数据库 (MySQL)</text>

    <rect x="580" y="690" width="220" height="40" rx="6" fill="#ffffff" stroke="#d25d5a" stroke-width="1.5" />
    <text x="690" y="716" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">文档数据库 (NoSQL)</text>

    <rect x="840" y="690" width="220" height="40" rx="6" fill="#ffffff" stroke="#d25d5a" stroke-width="1.5" />
    <text x="950" y="716" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">对象存储 (OSS)</text>
  </g>


  <!-- ============================================== -->
  <!-- 依赖关系连线区 (严格使用直线与折线连结相邻层级) -->
  <!-- ============================================== -->
  <g id="vertical-links" stroke="#8f959e" stroke-width="1.5" fill="none" marker-end="url(#arrow-down)">
    <!-- L1 -> L2 -->
    <line x1="430" y1="180" x2="430" y2="244" />
    <line x1="690" y1="180" x2="690" y2="244" />
    <line x1="950" y1="180" x2="950" y2="244" />

    <!-- L2 -> L3 (由中心 API网关 分支向下路由) -->
    <polyline points="690,290 690,325 430,325 430,354" />
    <line x1="690" y1="290" x2="690" y2="354" />
    <polyline points="690,290 690,325 950,325 950,354" />

    <!-- L3 -> L4 -->
    <line x1="430" y1="400" x2="430" y2="464" />
    <line x1="690" y1="400" x2="690" y2="464" />
    <line x1="950" y1="400" x2="950" y2="464" />

    <!-- L4 -> L5 -->
    <line x1="430" y1="510" x2="430" y2="574" />
    <line x1="690" y1="510" x2="690" y2="574" />
    <line x1="950" y1="510" x2="950" y2="574" />

    <!-- L5 -> L6 -->
    <line x1="430" y1="620" x2="430" y2="684" />
    <line x1="690" y1="620" x2="690" y2="684" />
    <line x1="950" y1="620" x2="950" y2="684" />
  </g>


  <!-- ============================================== -->
  <!-- 唯一关键跨层接口：前端绕过应用与领域层直连 OSS -->
  <!-- ============================================== -->
  <g id="cross-layer-link">
    <!-- 从 L1 开放平台右边缘出发，走画布右侧旁路，连接到 L6 OSS 存储 -->
    <polyline points="1060,160 1120,160 1120,710 1068,710" stroke="#d48e5b" stroke-width="2" fill="none" stroke-dasharray="6,4" marker-end="url(#arrow-cross)" />

    <!-- 跨层标签文本区 -->
    <rect x="1130" y="415" width="130" height="50" rx="4" fill="#ffffff" stroke="#d48e5b" stroke-width="1.5" />
    <text x="1195" y="434" font-size="13" font-weight="bold" fill="#d48e5b" text-anchor="middle">客户端文件直传</text>
    <text x="1195" y="454" font-size="12" fill="#646a73" text-anchor="middle">旁路鉴权接口通道</text>

    <!-- 装饰性连接小短线 -->
    <line x1="1120" y1="440" x2="1130" y2="440" stroke="#d48e5b" stroke-width="1.5" stroke-dasharray="2,2" />
  </g>

  <!-- ============================================== -->
  <!-- ============================================== -->
</svg>
