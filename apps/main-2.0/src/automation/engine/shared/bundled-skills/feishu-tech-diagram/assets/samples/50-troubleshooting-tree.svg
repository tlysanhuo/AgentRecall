<svg width="960" height="1100" viewBox="0 0 960 1100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#5178c6" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#d25d5a" />
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#bbbfc4" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#8569cb" />
    </marker>
  </defs>

  <!-- 全局背景 (可选白底保证导出干净) -->
  <rect width="100%" height="100%" fill="#ffffff" />

  <!-- ================= 主干链路连线 (先画连线，压在卡片底层) ================= -->

  <!-- 现象 -> 影响范围 -->
  <line x1="150" y1="124" x2="150" y2="170" stroke="#5178c6" stroke-width="2" marker-end="url(#arrow-blue)" />

  <!-- 影响范围 -> 应用监控 -->
  <line x1="150" y1="224" x2="150" y2="290" stroke="#5178c6" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="110" y="247" width="80" height="20" rx="10" fill="#ffffff" />
  <text x="150" y="261" font-size="12" fill="#5178c6" font-weight="bold" text-anchor="middle">大面积受影响</text>

  <!-- 应用 -> 外部 -->
  <line x1="150" y1="344" x2="150" y2="430" stroke="#5178c6" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="125" y="377" width="50" height="20" rx="10" fill="#ffffff" />
  <text x="150" y="391" font-size="12" fill="#646a73" text-anchor="middle">指标正常</text>

  <!-- 外部 -> 数据 -->
  <line x1="150" y1="484" x2="150" y2="570" stroke="#5178c6" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="125" y="517" width="50" height="20" rx="10" fill="#ffffff" />
  <text x="150" y="531" font-size="12" fill="#646a73" text-anchor="middle">指标正常</text>

  <!-- 数据 -> 资源 -->
  <line x1="150" y1="624" x2="150" y2="710" stroke="#5178c6" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="125" y="657" width="50" height="20" rx="10" fill="#ffffff" />
  <text x="150" y="671" font-size="12" fill="#646a73" text-anchor="middle">指标正常</text>

  <!-- 资源 -> 变更 -->
  <line x1="150" y1="764" x2="150" y2="850" stroke="#5178c6" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="125" y="797" width="50" height="20" rx="10" fill="#ffffff" />
  <text x="150" y="811" font-size="12" fill="#646a73" text-anchor="middle">指标正常</text>

  <!-- 变更 -> 兜底 -->
  <line x1="150" y1="904" x2="150" y2="970" stroke="#5178c6" stroke-width="2" marker-end="url(#arrow-blue)" />
  <rect x="120" y="927" width="60" height="20" rx="10" fill="#ffffff" />
  <text x="150" y="941" font-size="12" fill="#646a73" text-anchor="middle">均未发现异常</text>


  <!-- ================= 主干横向发散连线 ================= -->

  <!-- 单点分支 -->
  <line x1="240" y1="200" x2="314" y2="200" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-gray)" />
  <rect x="254" y="190" width="44" height="20" rx="4" fill="#ffffff" />
  <text x="276" y="204" font-size="12" fill="#646a73" text-anchor="middle">个别单点</text>

  <!-- 排查分支 1-5 -->
  <!-- 1 -->
  <line x1="240" y1="320" x2="314" y2="320" stroke="#d25d5a" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <rect x="254" y="310" width="44" height="20" rx="4" fill="#ffffff" />
  <text x="276" y="324" font-size="12" fill="#d25d5a" text-anchor="middle">命中发现</text>
  <!-- 2 -->
  <line x1="240" y1="460" x2="314" y2="460" stroke="#d25d5a" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <rect x="254" y="450" width="44" height="20" rx="4" fill="#ffffff" />
  <text x="276" y="464" font-size="12" fill="#d25d5a" text-anchor="middle">命中发现</text>
  <!-- 3 -->
  <line x1="240" y1="600" x2="314" y2="600" stroke="#d25d5a" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <rect x="254" y="590" width="44" height="20" rx="4" fill="#ffffff" />
  <text x="276" y="604" font-size="12" fill="#d25d5a" text-anchor="middle">命中发现</text>
  <!-- 4 -->
  <line x1="240" y1="740" x2="314" y2="740" stroke="#d25d5a" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <rect x="254" y="730" width="44" height="20" rx="4" fill="#ffffff" />
  <text x="276" y="744" font-size="12" fill="#d25d5a" text-anchor="middle">命中发现</text>
  <!-- 5 -->
  <line x1="240" y1="880" x2="314" y2="880" stroke="#d25d5a" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <rect x="254" y="870" width="44" height="20" rx="4" fill="#ffffff" />
  <text x="276" y="884" font-size="12" fill="#d25d5a" text-anchor="middle">命中发现</text>
  <!-- 兜底 -->
  <line x1="240" y1="1000" x2="314" y2="1000" stroke="#8569cb" stroke-width="1.5" marker-end="url(#arrow-purple)" />
  <rect x="254" y="990" width="44" height="20" rx="4" fill="#ffffff" />
  <text x="276" y="1004" font-size="12" fill="#8569cb" text-anchor="middle">触发转交</text>


  <!-- ================= 汇聚至终态连线 (硬朗折线总线) ================= -->

  <!-- 单点 -> 客服汇聚 -->
  <path d="M 560 200 L 714 200" stroke="#bbbfc4" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)" />

  <!-- 排查1(应用) -> 止损区汇聚 1 -->
  <path d="M 560 320 L 590 320 L 590 485 L 714 485" stroke="#bbbfc4" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)" />

  <!-- 排查2(外部) -> 止损区汇聚 2 -->
  <path d="M 560 460 L 615 460 L 615 515 L 714 515" stroke="#bbbfc4" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)" />

  <!-- 排查3(数据) -> 止损区汇聚 3 -->
  <path d="M 560 600 L 640 600 L 640 545 L 714 545" stroke="#bbbfc4" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)" />

  <!-- 排查4(资源) -> 止损区汇聚 4 -->
  <path d="M 560 740 L 665 740 L 665 575 L 714 575" stroke="#bbbfc4" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)" />

  <!-- 排查5(变更) -> 止损区汇聚 5 -->
  <path d="M 560 880 L 690 880 L 690 605 L 714 605" stroke="#bbbfc4" stroke-width="1.5" fill="none" marker-end="url(#arrow-gray)" />

  <!-- 止损区 -> 根因区 -->
  <line x1="800" y1="620" x2="800" y2="674" stroke="#d25d5a" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <rect x="760" y="636" width="80" height="20" rx="4" fill="#ffffff" />
  <text x="800" y="650" font-size="12" fill="#646a73" text-anchor="middle">止损后深入探查</text>

  <!-- 兜底 -> 升级专家汇聚 -->
  <path d="M 560 1000 L 714 1000" stroke="#8569cb" stroke-width="1.5" fill="none" marker-end="url(#arrow-purple)" />


  <!-- ================= 列1: 主干排查链路 ================= -->

  <!-- 现象 -->
  <rect x="60" y="76" width="180" height="48" rx="6" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="150" y="105" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">用户现象接报</text>

  <!-- 判断影响范围 -->
  <rect x="60" y="176" width="180" height="48" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="150" y="205" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">评估初步影响范围</text>

  <!-- 1. 应用监控 -->
  <rect x="60" y="296" width="180" height="48" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="150" y="325" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">1. 检查应用监控指标</text>

  <!-- 2. 外部依赖 -->
  <rect x="60" y="436" width="180" height="48" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="150" y="465" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">2. 检查外部依赖与存储</text>

  <!-- 3. 数据链路 -->
  <rect x="60" y="576" width="180" height="48" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="150" y="605" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">3. 检查数据流与队列</text>

  <!-- 4. 资源容量 -->
  <rect x="60" y="716" width="180" height="48" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="150" y="745" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">4. 检查资源容量监控</text>

  <!-- 5. 变更记录 -->
  <rect x="60" y="856" width="180" height="48" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="150" y="885" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">5. 检查配置与发布记录</text>

  <!-- 兜底 -->
  <rect x="60" y="976" width="180" height="48" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="150" y="1005" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">排查无果，触发兜底</text>


  <!-- ================= 列2: 分支详情证据与动作卡片 ================= -->

  <!-- 单点卡片 (CY=200, Y=148, H=104) -->
  <g transform="translate(320, 148)">
    <rect width="240" height="104" rx="6" fill="#ffffff" stroke="#bbbfc4" stroke-width="1" />
    <rect x="0" y="20" width="4" height="64" rx="2" fill="#bbbfc4" />
    <text x="16" y="24" font-size="13" font-weight="bold" fill="#1f2329">单点现象评估</text>
    <rect x="16" y="36" width="4" height="4" fill="#bbbfc4" />
    <text x="28" y="42" font-size="12" fill="#646a73">零星客户反馈 / 监控大盘无波动</text>

    <text x="16" y="70" font-size="13" font-weight="bold" fill="#1f2329">常态化流转</text>
    <rect x="16" y="82" width="4" height="4" fill="#8f959e" />
    <text x="28" y="88" font-size="12" fill="#8f959e">转交一线客服走标准工单排查</text>
  </g>

  <!-- 1. 应用卡片 (CY=320, Y=268, H=104) -->
  <g transform="translate(320, 268)">
    <rect width="240" height="104" rx="6" fill="#ffffff" stroke="#bbbfc4" stroke-width="1" />
    <rect x="0" y="20" width="4" height="64" rx="2" fill="#d25d5a" />
    <text x="16" y="24" font-size="13" font-weight="bold" fill="#1f2329">异常线索</text>
    <rect x="16" y="36" width="4" height="4" fill="#d25d5a" />
    <text x="28" y="42" font-size="12" fill="#646a73">Error 日志飙升 / 5xx 状态码激增</text>

    <text x="16" y="70" font-size="13" font-weight="bold" fill="#1f2329">处置动作</text>
    <rect x="16" y="82" width="4" height="4" fill="#d4b45b" />
    <text x="28" y="88" font-size="12" fill="#d48e5b">定位异常代码行，快速执行服务重启</text>
  </g>

  <!-- 2. 外部依赖卡片 (CY=460, Y=408, H=104) -->
  <g transform="translate(320, 408)">
    <rect width="240" height="104" rx="6" fill="#ffffff" stroke="#bbbfc4" stroke-width="1" />
    <rect x="0" y="20" width="4" height="64" rx="2" fill="#d25d5a" />
    <text x="16" y="24" font-size="13" font-weight="bold" fill="#1f2329">异常线索</text>
    <rect x="16" y="36" width="4" height="4" fill="#d25d5a" />
    <text x="28" y="42" font-size="12" fill="#646a73">下游 RPC 超时 / 数据库慢查询告警</text>

    <text x="16" y="70" font-size="13" font-weight="bold" fill="#1f2329">处置动作</text>
    <rect x="16" y="82" width="4" height="4" fill="#d4b45b" />
    <text x="28" y="88" font-size="12" fill="#d48e5b">手动触发降级策略，切换备用链路</text>
  </g>

  <!-- 3. 数据链路卡片 (CY=600, Y=548, H=104) -->
  <g transform="translate(320, 548)">
    <rect width="240" height="104" rx="6" fill="#ffffff" stroke="#bbbfc4" stroke-width="1" />
    <rect x="0" y="20" width="4" height="64" rx="2" fill="#d25d5a" />
    <text x="16" y="24" font-size="13" font-weight="bold" fill="#1f2329">异常线索</text>
    <rect x="16" y="36" width="4" height="4" fill="#d25d5a" />
    <text x="28" y="42" font-size="12" fill="#646a73">消息队列严重积压 / 数据写入受阻</text>

    <text x="16" y="70" font-size="13" font-weight="bold" fill="#1f2329">处置动作</text>
    <rect x="16" y="82" width="4" height="4" fill="#d4b45b" />
    <text x="28" y="88" font-size="12" fill="#d48e5b">隔离阻断脏数据，紧急扩容消费队列</text>
  </g>

  <!-- 4. 资源容量卡片 (CY=740, Y=688, H=104) -->
  <g transform="translate(320, 688)">
    <rect width="240" height="104" rx="6" fill="#ffffff" stroke="#bbbfc4" stroke-width="1" />
    <rect x="0" y="20" width="4" height="64" rx="2" fill="#d25d5a" />
    <text x="16" y="24" font-size="13" font-weight="bold" fill="#1f2329">异常线索</text>
    <rect x="16" y="36" width="4" height="4" fill="#d25d5a" />
    <text x="28" y="42" font-size="12" fill="#646a73">CPU/内存水位飙升触顶 / 网络频繁丢包</text>

    <text x="16" y="70" font-size="13" font-weight="bold" fill="#1f2329">处置动作</text>
    <rect x="16" y="82" width="4" height="4" fill="#d4b45b" />
    <text x="28" y="88" font-size="12" fill="#d48e5b">弹性扩缩容资源，限流丢弃非核心请求</text>
  </g>

  <!-- 5. 变更记录卡片 (CY=880, Y=828, H=104) -->
  <g transform="translate(320, 828)">
    <rect width="240" height="104" rx="6" fill="#ffffff" stroke="#bbbfc4" stroke-width="1" />
    <rect x="0" y="20" width="4" height="64" rx="2" fill="#d25d5a" />
    <text x="16" y="24" font-size="13" font-weight="bold" fill="#1f2329">异常线索</text>
    <rect x="16" y="36" width="4" height="4" fill="#d25d5a" />
    <text x="28" y="42" font-size="12" fill="#646a73">排查出近期存在发布单或灰度比例调整</text>

    <text x="16" y="70" font-size="13" font-weight="bold" fill="#1f2329">处置动作</text>
    <rect x="16" y="82" width="4" height="4" fill="#d4b45b" />
    <text x="28" y="88" font-size="12" fill="#d48e5b">一键回滚近期变更，并实施系统封网观察</text>
  </g>

  <!-- 兜底排查卡片 (CY=1000, Y=948, H=104) -->
  <g transform="translate(320, 948)">
    <rect width="240" height="104" rx="6" fill="#ffffff" stroke="#bbbfc4" stroke-width="1" />
    <rect x="0" y="20" width="4" height="64" rx="2" fill="#8569cb" />
    <text x="16" y="24" font-size="13" font-weight="bold" fill="#1f2329">排查阻断</text>
    <rect x="16" y="36" width="4" height="4" fill="#8569cb" />
    <text x="28" y="42" font-size="12" fill="#646a73">L1排查项全部正常，未发现任何异常指标</text>

    <text x="16" y="70" font-size="13" font-weight="bold" fill="#1f2329">处置动作</text>
    <rect x="16" y="82" width="4" height="4" fill="#8569cb" />
    <text x="28" y="88" font-size="12" fill="#646a73">打包收集全链路日志与系统快照，准备升级</text>
  </g>


  <!-- ================= 列3: 终端节点区 ================= -->

  <!-- 终态1: 常规工单流转 -->
  <g transform="translate(720, 176)">
    <rect width="160" height="48" rx="6" fill="#f5f5f5" stroke="#bbbfc4" stroke-width="1.5" />
    <text x="80" y="25" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">引导工单跟进</text>
    <text x="80" y="40" font-size="10" fill="#646a73" text-anchor="middle">转交一线客服团队</text>
  </g>

  <!-- 终态2: 紧急止损区 (汇聚枢纽) -->
  <g transform="translate(720, 460)">
    <rect width="160" height="160" rx="8" fill="#fef1ce" stroke="#d4b45b" stroke-width="2" />

    <!-- 内部排版 -->
    <text x="80" y="36" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">最高优先级</text>
    <text x="80" y="56" font-size="16" font-weight="bold" fill="#d48e5b" text-anchor="middle">执行紧急止损</text>

    <path d="M 40 76 L 120 76" stroke="#d4b45b" stroke-width="1" stroke-dasharray="4 2" />

    <text x="80" y="100" font-size="12" fill="#646a73" text-anchor="middle">通过重启/限流/降级</text>
    <text x="80" y="120" font-size="12" fill="#646a73" text-anchor="middle">或回滚等短期手段</text>
    <text x="80" y="140" font-size="12" fill="#646a73" text-anchor="middle">第一时间恢复核心业务</text>
  </g>

  <!-- 终态3: 根因处理区 -->
  <g transform="translate(720, 680)">
    <rect width="160" height="60" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="2" />
    <text x="80" y="26" font-size="14" font-weight="bold" fill="#d25d5a" text-anchor="middle">定位并修复根因</text>
    <text x="80" y="46" font-size="11" fill="#d25d5a" text-anchor="middle">长效彻底解决业务隐患</text>
  </g>

  <!-- 终态4: 升级跟进区 -->
  <g transform="translate(720, 970)">
    <rect width="160" height="60" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="2" />
    <text x="80" y="26" font-size="14" font-weight="bold" fill="#8569cb" text-anchor="middle">升级 L2/L3 专家介入</text>
    <text x="80" y="46" font-size="11" fill="#8569cb" text-anchor="middle">协同深挖未知复杂故障</text>
  </g>

</svg>
