    <text x="298" y="140" font-size="12" font-weight="bold" fill="#1f2329" text-anchor="middle">2</text>
    <text x="318" y="141" font-size="16" font-weight="bold" fill="#1f2329">基础概念</text>

    <rect x="282" y="176" width="138" height="48" rx="6" fill="#ffffff"/>
    <text x="351" y="204" font-size="14" fill="#1f2329" text-anchor="middle">核心语法与规范</text>

