    <text x="1175" y="204" font-size="14" fill="#1f2329" text-anchor="middle">底层源码剖析</text>

    <rect x="1106" y="238" width="138" height="48" rx="6" fill="#ffffff"/>
    <text x="1175" y="266" font-size="14" fill="#1f2329" text-anchor="middle">架构模式设计</text>

