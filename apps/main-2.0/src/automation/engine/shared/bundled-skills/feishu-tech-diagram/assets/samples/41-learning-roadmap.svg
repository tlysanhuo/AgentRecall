  <!-- Main Title & Subtitle -->
  <text x="60" y="50" font-size="24" font-weight="bold" fill="#1f2329">通用技术学习路线图</text>
  <text x="60" y="76" font-size="14" fill="#8f959e">从基础认知到深入实践的核心路径</text>

  <!-- Stage 1: 前置知识 -->
  <g>
