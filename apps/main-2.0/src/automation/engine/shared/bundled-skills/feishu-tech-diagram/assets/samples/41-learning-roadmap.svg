    <text x="351" y="266" font-size="14" fill="#1f2329" text-anchor="middle">常用数据结构</text>

    <rect x="282" y="300" width="138" height="48" rx="6" fill="#ffffff"/>
    <text x="351" y="328" font-size="14" fill="#1f2329" text-anchor="middle">基础工具库</text>
