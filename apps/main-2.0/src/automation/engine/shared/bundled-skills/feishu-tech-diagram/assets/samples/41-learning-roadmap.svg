<svg width="1320" height="420" viewBox="0 0 1320 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Marker Definitions -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#dee0e3"/>
