    <rect x="60" y="100" width="170" height="280" rx="12" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1"/>
    <!-- Header -->
    <circle cx="92" cy="136" r="12" fill="#ffffff"/>
    <text x="92" y="140" font-size="12" font-weight="bold" fill="#1f2329" text-anchor="middle">1</text>
    <text x="112" y="141" font-size="16" font-weight="bold" fill="#1f2329">前置知识</text>
    <!-- Cards -->
    <rect x="76" y="176" width="138" height="48" rx="6" fill="#ffffff"/>
    <text x="145" y="204" font-size="14" fill="#1f2329" text-anchor="middle">编程语言基础</text>

    <rect x="76" y="238" width="138" height="48" rx="6" fill="#ffffff"/>
    <text x="145" y="266" font-size="14" fill="#1f2329" text-anchor="middle">运行环境搭建</text>
  </g>

