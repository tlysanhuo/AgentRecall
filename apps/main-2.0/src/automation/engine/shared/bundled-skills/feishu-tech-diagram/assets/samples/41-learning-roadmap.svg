  <g>
    <rect x="884" y="100" width="170" height="280" rx="12" fill="#fef1ce" stroke="#dee0e3" stroke-width="1"/>
    <circle cx="916" cy="136" r="12" fill="#ffffff"/>
    <text x="916" y="140" font-size="12" font-weight="bold" fill="#1f2329" text-anchor="middle">5</text>
    <text x="936" y="141" font-size="16" font-weight="bold" fill="#1f2329">性能调优</text>

    <rect x="900" y="176" width="138" height="48" rx="6" fill="#ffffff"/>
    <text x="969" y="204" font-size="14" fill="#1f2329" text-anchor="middle">性能瓶颈定位</text>

    <rect x="900" y="238" width="138" height="48" rx="6" fill="#ffffff"/>
    <text x="969" y="266" font-size="14" fill="#1f2329" text-anchor="middle">资源调度优化</text>

