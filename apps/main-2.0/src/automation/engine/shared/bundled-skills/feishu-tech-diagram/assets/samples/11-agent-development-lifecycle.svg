<svg width="1632" height="360" viewBox="0 0 1632 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#5178c6" />
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d4b45b" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d25d5a" />
    </marker>
  </defs>

  <!-- 全局背景 -->
  <rect width="1632" height="360" fill="#ffffff" />

  <!-- 标题 -->
  <text x="48" y="60" font-size="20" font-weight="bold" fill="#1f2329">Agent 开发全流程</text>

  <!-- 阶段标签区 -->
  <!-- 需求与设计 (覆盖 1,2,3) -->
  <rect x="271" y="116" width="100" height="24" rx="12" fill="#f0f4fc" />
  <text x="321" y="133" font-size="12" fill="#5178c6" font-weight="bold" text-anchor="middle">需求与设计</text>

  <!-- 开发与评测 (覆盖 4,5) -->
  <rect x="766" y="116" width="100" height="24" rx="12" fill="#f0f4fc" />
  <text x="816" y="133" font-size="12" fill="#5178c6" font-weight="bold" text-anchor="middle">开发与评测</text>

  <!-- 部署与运维 (覆盖 6,7,8) -->
  <rect x="1261" y="116" width="100" height="24" rx="12" fill="#f0f4fc" />
  <text x="1311" y="133" font-size="12" fill="#5178c6" font-weight="bold" text-anchor="middle">部署与运维</text>


  <!-- 主连线 (底线铺设) -->
  <line x1="198" y1="202" x2="238" y2="202" stroke="#5178c6" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <line x1="396" y1="202" x2="436" y2="202" stroke="#5178c6" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <line x1="594" y1="202" x2="636" y2="202" stroke="#5178c6" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <line x1="792" y1="202" x2="834" y2="202" stroke="#5178c6" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <line x1="990" y1="202" x2="1032" y2="202" stroke="#5178c6" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <line x1="1188" y1="202" x2="1230" y2="202" stroke="#5178c6" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <line x1="1386" y1="202" x2="1428" y2="202" stroke="#5178c6" stroke-width="1.5" marker-end="url(#arrow-blue)" />


  <!-- 反馈与回流通道连线 -->
  <!-- 离线评测不通过 -> 返回实现 -->
  <path d="M 915 244 L 915 284 L 717 284 L 717 252" stroke="#d4b45b" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow-yellow)" />
  <text x="816" y="276" font-size="12" fill="#d4b45b" font-weight="bold" text-anchor="middle">不通过，重新调整</text>

  <!-- 失败样本 -> 返回实现 -->
  <path d="M 1509 160 L 1509 84 L 717 84 L 717 152" stroke="#d25d5a" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#arrow-red)" />
  <text x="1113" y="76" font-size="12" fill="#d25d5a" font-weight="bold" text-anchor="middle">失败样本触发优化迭代</text>


  <!-- ================== 节点渲染 ================== -->

  <!-- 01 场景定义 -->
  <rect x="48" y="160" width="150" height="84" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <rect x="111" y="182" width="24" height="16" rx="8" fill="#5178c6" />
  <text x="123" y="193" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">1</text>
  <text x="123" y="216" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">场景定义</text>

  <!-- 02 成功指标 -->
  <rect x="246" y="160" width="150" height="84" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <rect x="309" y="182" width="24" height="16" rx="8" fill="#5178c6" />
  <text x="321" y="193" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">2</text>
  <text x="321" y="216" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">成功指标</text>

  <!-- 03 方案设计 -->
  <rect x="444" y="160" width="150" height="84" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <rect x="507" y="182" width="24" height="16" rx="8" fill="#5178c6" />
  <text x="519" y="193" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">3</text>
  <text x="519" y="216" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">方案设计</text>

  <!-- 04 Prompt 与 Tool 实现 -->
  <rect x="642" y="160" width="150" height="84" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <rect x="705" y="175" width="24" height="16" rx="8" fill="#5178c6" />
  <text x="717" y="186" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">4</text>
  <text x="717" y="207" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">Prompt 与</text>
  <text x="717" y="225" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">Tool 实现</text>

  <!-- 05 离线评测 (黄色校验色) -->
  <rect x="840" y="160" width="150" height="84" rx="6" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <rect x="903" y="182" width="24" height="16" rx="8" fill="#d4b45b" />
  <text x="915" y="193" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">5</text>
  <text x="915" y="216" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">离线评测</text>

  <!-- 06 真实流量灰度 -->
  <rect x="1038" y="160" width="150" height="84" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <rect x="1101" y="175" width="24" height="16" rx="8" fill="#5178c6" />
  <text x="1113" y="186" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">6</text>
  <text x="1113" y="207" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">真实流量</text>
  <text x="1113" y="225" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">灰度发布</text>

  <!-- 07 线上监控 (黄色校验色) -->
  <rect x="1236" y="160" width="150" height="84" rx="6" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <rect x="1299" y="182" width="24" height="16" rx="8" fill="#d4b45b" />
  <text x="1311" y="193" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">7</text>
  <text x="1311" y="216" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">线上监控</text>

  <!-- 08 失败样本回流 (红色警示与重试色) -->
  <rect x="1434" y="160" width="150" height="84" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
  <rect x="1497" y="175" width="24" height="16" rx="8" fill="#d25d5a" />
  <text x="1509" y="186" font-size="10" fill="#ffffff" font-weight="bold" text-anchor="middle">8</text>
  <text x="1509" y="207" font-size="14" fill="#d25d5a" font-weight="bold" text-anchor="middle">失败样本</text>
  <text x="1509" y="225" font-size="14" fill="#d25d5a" font-weight="bold" text-anchor="middle">回流分析</text>

</svg>
