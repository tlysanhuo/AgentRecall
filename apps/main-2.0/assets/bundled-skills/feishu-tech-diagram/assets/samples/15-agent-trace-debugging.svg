<svg width="1360" height="540" viewBox="0 0 1360 540" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 通用箭头 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#bbbfc4" />
    </marker>
  </defs>

  <!-- ================= 背景框架与分组 ================= -->

  <!-- 阶段1：节点识别背景 -->
  <rect x="380" y="170" width="210" height="190" fill="none" stroke="#dee0e3" stroke-width="1.5" stroke-dasharray="6 4" rx="8" />
  <rect x="394" y="160" width="105" height="20" fill="#ffffff" />
  <text x="400" y="174" font-size="12" fill="#8f959e" font-weight="bold">阶段 1: 节点识别</text>

  <!-- 阶段2：载荷深度分析背景 -->
  <rect x="620" y="130" width="250" height="280" fill="none" stroke="#dee0e3" stroke-width="1.5" stroke-dasharray="6 4" rx="8" />
  <rect x="634" y="120" width="135" height="20" fill="#ffffff" />
  <text x="640" y="134" font-size="12" fill="#8f959e" font-weight="bold">阶段 2: 载荷穿透分析</text>

  <!-- 阶段3：诊断根因树背景 -->
  <rect x="890" y="100" width="270" height="340" fill="none" stroke="#dee0e3" stroke-width="1.5" stroke-dasharray="6 4" rx="8" />
  <rect x="904" y="90" width="115" height="20" fill="#ffffff" />
  <text x="910" y="104" font-size="12" fill="#8f959e" font-weight="bold">阶段 3: 诊断根因树</text>

  <!-- ================= 主干连线与路由 ================= -->

  <!-- 起点 -> Trace总览 -->
  <line x1="170" y1="280" x2="210" y2="280" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Trace总览 -> 组1 分发点 -->
  <line x1="350" y1="280" x2="400" y2="280" stroke="#bbbfc4" stroke-width="1.5" />

  <!-- 组1 分发 -->
  <polyline points="400,280 400,240 410,240" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="400,280 400,320 410,320" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 组1 汇聚 -->
  <polyline points="560,240 570,240 570,280" fill="none" stroke="#bbbfc4" stroke-width="1.5" />
  <polyline points="560,320 570,320 570,280" fill="none" stroke="#bbbfc4" stroke-width="1.5" />

  <!-- 组1 -> 组2 主干过渡 -->
  <line x1="570" y1="280" x2="635" y2="280" stroke="#bbbfc4" stroke-width="1.5" />
  <rect x="575" y="270" width="56" height="20" fill="#ffffff" />
  <text x="603" y="284" font-size="12" fill="#8f959e" text-anchor="middle">钻取数据</text>

  <!-- 组2 分发 -->
  <polyline points="635,280 635,200 645,200" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="635" y1="280" x2="645" y2="280" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="635,280 635,360 645,360" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 组2 汇聚 -->
  <polyline points="845,200 855,200 855,280" fill="none" stroke="#bbbfc4" stroke-width="1.5" />
  <line x1="845" y1="280" x2="855" y2="280" stroke="#bbbfc4" stroke-width="1.5" />
  <polyline points="845,360 855,360 855,280" fill="none" stroke="#bbbfc4" stroke-width="1.5" />

  <!-- 组2 -> 组3 主干过渡 -->
  <line x1="855" y1="280" x2="905" y2="280" stroke="#bbbfc4" stroke-width="1.5" />
  <rect x="862" y="270" width="36" height="20" fill="#ffffff" />
  <text x="880" y="284" font-size="12" fill="#8f959e" text-anchor="middle">归因</text>

  <!-- 组3 分发 -->
  <polyline points="905,280 905,172 915,172" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="905,280 905,244 915,244" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="905,280 905,316 915,316" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="905,280 905,388 915,388" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 组3 汇聚 -->
  <polyline points="1135,172 1145,172 1145,280" fill="none" stroke="#bbbfc4" stroke-width="1.5" />
  <polyline points="1135,244 1145,244 1145,280" fill="none" stroke="#bbbfc4" stroke-width="1.5" />
  <polyline points="1135,316 1145,316 1145,280" fill="none" stroke="#bbbfc4" stroke-width="1.5" />
  <polyline points="1135,388 1145,388 1145,280" fill="none" stroke="#bbbfc4" stroke-width="1.5" />

  <!-- 组3 -> 回归验证主线 -->
  <line x1="1145" y1="280" x2="1180" y2="280" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />


  <!-- ================= 节点卡片 ================= -->

  <!-- 起点：失败请求 -->
  <rect x="40" y="256" width="130" height="48" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
  <text x="105" y="285" font-size="14" fill="#d25d5a" font-weight="bold" text-anchor="middle">失败请求 / 报警</text>

  <!-- 宏观视图：Trace总览 -->
  <rect x="210" y="256" width="140" height="48" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="280" y="285" font-size="14" fill="#5178c6" font-weight="bold" text-anchor="middle">Trace 链路总览</text>

  <!-- 组1 卡片：节点定位 -->
  <rect x="410" y="216" width="150" height="48" rx="6" fill="#ffffff" stroke="#bbbfc4" stroke-width="1.2" />
  <text x="485" y="245" font-size="14" fill="#1f2329" text-anchor="middle">检查长耗时慢节点</text>

  <rect x="410" y="296" width="150" height="48" rx="6" fill="#ffffff" stroke="#bbbfc4" stroke-width="1.2" />
  <text x="485" y="325" font-size="14" fill="#1f2329" text-anchor="middle">定位异常报错节点</text>

  <!-- 组2 卡片：载荷深度分析 -->
  <!-- Prompt I/O -->
  <rect x="645" y="176" width="200" height="48" rx="6" fill="#ffffff" stroke="#bbbfc4" stroke-width="1.2" />
  <circle cx="665" cy="200" r="4" fill="#8569cb" />
  <text x="680" y="205" font-size="14" fill="#1f2329">核验 Prompt 组装与渲染</text>

  <!-- Tool 参数与结果 -->
  <rect x="645" y="256" width="200" height="48" rx="6" fill="#ffffff" stroke="#bbbfc4" stroke-width="1.2" />
  <circle cx="665" cy="280" r="4" fill="#5178c6" />
  <text x="680" y="285" font-size="14" fill="#1f2329">校验 Tool 传参与返回值</text>

  <!-- 模型响应 -->
  <rect x="645" y="336" width="200" height="48" rx="6" fill="#ffffff" stroke="#bbbfc4" stroke-width="1.2" />
  <circle cx="665" cy="360" r="4" fill="#d4b45b" />
  <text x="680" y="365" font-size="14" fill="#1f2329">分析模型推理与 JSON</text>

  <!-- 组3 卡片：排障根因归属 -->
  <!-- 编排逻辑问题 -->
  <rect x="915" y="148" width="220" height="48" rx="6" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <circle cx="935" cy="172" r="4" fill="#d4b45b" />
  <text x="950" y="177" font-size="14" fill="#1f2329">Agent 编排与路由故障</text>

  <!-- 工具异常 -->
  <rect x="915" y="220" width="220" height="48" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <circle cx="935" cy="244" r="4" fill="#5178c6" />
  <text x="950" y="249" font-size="14" fill="#1f2329">下游工具与 API 异常</text>

  <!-- 上下文/Prompt问题 -->
  <rect x="915" y="292" width="220" height="48" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <circle cx="935" cy="316" r="4" fill="#8569cb" />
  <text x="950" y="321" font-size="14" fill="#1f2329">上下文缺失或 Prompt 缺陷</text>

  <!-- 模型能力/幻觉 -->
  <rect x="915" y="364" width="220" height="48" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
  <circle cx="935" cy="388" r="4" fill="#d25d5a" />
  <text x="950" y="393" font-size="14" fill="#1f2329">模型理解偏差与严重幻觉</text>

  <!-- 终点：回归验证 -->
  <rect x="1180" y="256" width="140" height="48" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="1250" y="285" font-size="14" fill="#509863" font-weight="bold" text-anchor="middle">修复后回归验证</text>

</svg>
