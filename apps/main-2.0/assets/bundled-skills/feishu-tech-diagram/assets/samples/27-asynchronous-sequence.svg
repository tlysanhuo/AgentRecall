<svg xmlns="http://www.w3.org/2000/svg" width="1250" height="860" viewBox="0 0 1250 860">
  <defs>
    <!-- 实线实心箭头 -->
    <marker id="arrow_solid" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#1f2329" />
    </marker>
    <!-- 虚线实心箭头 -->
    <marker id="arrow_dashed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#646a73" />
    </marker>
  </defs>

  <!-- 背景底色 -->
  <rect width="1250" height="860" fill="#ffffff" />

  <!-- 主标题与副标题 -->
  <text x="40" y="40" font-size="20" font-weight="bold" fill="#1f2329" text-anchor="start">异步事件处理时序图</text>
  <text x="40" y="64" font-size="12" fill="#646a73" text-anchor="start">含幂等检查、正常业务落库流程、失败重试及死信队列(DLQ)降级机制</text>

  <!-- 参与方声明 (Lifelines) -->
  <g id="lifelines" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="5,5">
    <line x1="150" y1="120" x2="150" y2="800" />
    <line x1="350" y1="120" x2="350" y2="800" />
    <line x1="580" y1="120" x2="580" y2="800" />
    <line x1="850" y1="120" x2="850" y2="800" />
    <line x1="1080" y1="120" x2="1080" y2="800" />
  </g>

  <!-- 激活块 (Activation Boxes) -->
  <g id="activations" fill="#ffffff" stroke="#646a73" stroke-width="1.5">
    <rect x="142" y="160" width="16" height="60" />

    <rect x="342" y="160" width="16" height="100" />
    <rect x="342" y="460" width="16" height="20" />
    <rect x="342" y="720" width="16" height="20" />

    <rect x="572" y="240" width="16" height="500" />

    <rect x="842" y="380" width="16" height="60" />

    <rect x="1072" y="640" width="16" height="60" />
  </g>

  <!-- 顶部参与方标题框 -->
  <g id="participants">
    <!-- Producer -->
    <rect x="80" y="80" width="140" height="40" rx="6" fill="#ffffff" stroke="#1f2329" stroke-width="1.5" />
    <text x="150" y="105" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">生产者 (Producer)</text>

    <!-- Broker -->
    <rect x="280" y="80" width="140" height="40" rx="6" fill="#ffffff" stroke="#1f2329" stroke-width="1.5" />
    <text x="350" y="105" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Broker</text>

    <!-- Consumer -->
    <rect x="510" y="80" width="140" height="40" rx="6" fill="#ffffff" stroke="#1f2329" stroke-width="1.5" />
    <text x="580" y="105" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">消费者 (Consumer)</text>

    <!-- Database -->
    <rect x="780" y="80" width="140" height="40" rx="6" fill="#ffffff" stroke="#1f2329" stroke-width="1.5" />
    <text x="850" y="105" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">数据库 (Database)</text>

    <!-- DLQ -->
    <rect x="1010" y="80" width="140" height="40" rx="6" fill="#ffffff" stroke="#1f2329" stroke-width="1.5" />
    <text x="1080" y="105" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">死信队列 (DLQ)</text>
  </g>

  <!-- 消息与交互连线 -->
  <g id="interactions">
    <!-- 1. 发布消息 -->
    <line x1="158" y1="170" x2="342" y2="170" stroke="#1f2329" stroke-width="1.5" marker-end="url(#arrow_solid)" />
    <text x="250" y="162" font-size="12" fill="#1f2329" text-anchor="middle">1. 发布事件消息 (Publish)</text>

    <!-- 2. Broker确认 -->
    <line x1="342" y1="210" x2="158" y2="210" stroke="#646a73" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow_dashed)" />
    <text x="250" y="202" font-size="12" fill="#646a73" text-anchor="middle">2. Broker 确认接收 (ACK)</text>

    <!-- 3. 推送/拉取消息 -->
    <line x1="358" y1="250" x2="572" y2="250" stroke="#1f2329" stroke-width="1.5" marker-end="url(#arrow_solid)" />
    <text x="465" y="242" font-size="12" fill="#1f2329" text-anchor="middle">3. 异步投递 / Consumer 拉取</text>

    <!-- 4. 幂等检查 (自环) -->
    <polyline points="588,270 630,270 630,300 588,300" fill="none" stroke="#1f2329" stroke-width="1.5" marker-end="url(#arrow_solid)" />
    <text x="638" y="289" font-size="12" fill="#1f2329" text-anchor="start">4. 执行幂等性防重检查</text>
  </g>

  <!-- 组合逻辑框 (Alt/Loop Box) -->
  <g id="combined_fragment">
    <!-- 外框体 -->
    <rect x="300" y="340" width="820" height="430" fill="none" stroke="#646a73" stroke-width="1.5" stroke-dasharray="4,4" />

    <!-- 左上角标签 (alt) -->
    <polygon points="300,340 360,340 360,356 350,366 300,366" fill="#ffffff" stroke="#646a73" stroke-width="1.5" />
    <text x="310" y="356" font-size="12" font-weight="bold" fill="#1f2329" text-anchor="start">alt</text>
    <text x="370" y="358" font-size="12" font-weight="bold" fill="#646a73" text-anchor="start">[ 检查通过，执行正常业务流 ]</text>

    <!-- 5. 正常写入数据库 -->
    <line x1="588" y1="390" x2="842" y2="390" stroke="#1f2329" stroke-width="1.5" marker-end="url(#arrow_solid)" />
    <text x="715" y="382" font-size="12" fill="#1f2329" text-anchor="middle">5. 业务操作入库 (Transaction)</text>

    <!-- 6. 写入成功 -->
    <line x1="842" y1="430" x2="588" y2="430" stroke="#646a73" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow_dashed)" />
    <text x="715" y="422" font-size="12" fill="#646a73" text-anchor="middle">6. 落库成功与结果返回</text>

    <!-- 7. 确认消费 -->
    <line x1="572" y1="470" x2="358" y2="470" stroke="#646a73" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow_dashed)" />
    <text x="465" y="462" font-size="12" fill="#646a73" text-anchor="middle">7. 成功消费确认 (ACK)</text>

    <!-- 分割线 1 (失败重试逻辑) -->
    <line x1="300" y1="500" x2="1120" y2="500" stroke="#646a73" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="310" y="518" font-size="12" font-weight="bold" fill="#646a73" text-anchor="start">[ 处理异常与内部延迟重试 ]</text>

    <!-- 8. 本地重试 (自环) -->
    <polyline points="588,540 630,540 630,570 588,570" fill="none" stroke="#1f2329" stroke-width="1.5" marker-end="url(#arrow_solid)" />
    <text x="638" y="559" font-size="12" fill="#1f2329" text-anchor="start">8. 抛出异常，执行内部等待及重试 (Retry)</text>

    <!-- 分割线 2 (重试超限机制) -->
    <line x1="300" y1="600" x2="1120" y2="600" stroke="#646a73" stroke-width="1.5" stroke-dasharray="4,4" />
    <text x="310" y="618" font-size="12" font-weight="bold" fill="#646a73" text-anchor="start">[ 重试次数达上限，启动降级保护 ]</text>

    <!-- 9. 路由至死信队列 -->
    <line x1="588" y1="650" x2="1072" y2="650" stroke="#1f2329" stroke-width="1.5" marker-end="url(#arrow_solid)" />
    <text x="830" y="642" font-size="12" fill="#1f2329" text-anchor="middle">9. 路由投递至死信队列 (DLQ)</text>

    <!-- 10. DLQ确认 -->
    <line x1="1072" y1="690" x2="588" y2="690" stroke="#646a73" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow_dashed)" />
    <text x="830" y="682" font-size="12" fill="#646a73" text-anchor="middle">10. 死信写入成功</text>

    <!-- 11. 提交结束状态ACK -->
    <line x1="572" y1="730" x2="358" y2="730" stroke="#646a73" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow_dashed)" />
    <text x="465" y="722" font-size="12" fill="#646a73" text-anchor="middle">11. 提交最终偏移量 / NACK 丢弃</text>
  </g>

</svg>
