<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="600" viewBox="0 0 1360 600">
  <defs>
    <!-- 通用箭头标记 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#bbbfc4" />
    </marker>
  </defs>

  <!-- 全局背景 -->
  <rect x="0" y="0" width="1360" height="600" fill="#ffffff" />

  <!-- 顶部标题区 -->
  <rect x="20" y="24" width="4" height="20" fill="#5178c6" rx="2" />
  <text x="32" y="39" font-size="18" fill="#1f2329" font-weight="bold">人机协作自动化处理流程</text>
  <text x="240" y="38" font-size="12" fill="#8f959e">AI 风险研判与人工干预无缝交接</text>

  <!-- 泳道背景与分隔线 -->
  <!-- 泳道分隔线 (横向) -->
  <line x1="20" y1="80" x2="1340" y2="80" stroke="#dee0e3" stroke-width="1" />
  <line x1="20" y1="200" x2="1340" y2="200" stroke="#dee0e3" stroke-width="1" />
  <line x1="20" y1="320" x2="1340" y2="320" stroke="#dee0e3" stroke-width="1" />
  <line x1="20" y1="440" x2="1340" y2="440" stroke="#dee0e3" stroke-width="1" />
  <line x1="20" y1="560" x2="1340" y2="560" stroke="#dee0e3" stroke-width="1" />

  <!-- 左右边界线 -->
  <line x1="120" y1="80" x2="120" y2="560" stroke="#dee0e3" stroke-width="1" />
  <line x1="1340" y1="80" x2="1340" y2="560" stroke="#dee0e3" stroke-width="1" />

  <!-- 左侧角色表头区 (Headers) -->
  <!-- 1. 用户泳道 -->
  <rect x="20" y="80" width="4" height="120" fill="#5178c6" />
  <rect x="24" y="80" width="96" height="120" fill="#f0f4fc" />
  <text x="72" y="145" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">用 户</text>

  <!-- 2. 业务系统泳道 -->
  <rect x="20" y="200" width="4" height="120" fill="#5263a5" />
  <rect x="24" y="200" width="96" height="120" fill="#d6dcf3" />
  <text x="72" y="265" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">业务系统</text>

  <!-- 3. Agent 泳道 -->
  <rect x="20" y="320" width="4" height="120" fill="#8569cb" />
  <rect x="24" y="320" width="96" height="120" fill="#eae2fe" />
  <text x="72" y="385" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">智能 Agent</text>

  <!-- 4. 人工审核泳道 -->
  <rect x="20" y="440" width="4" height="120" fill="#d25d5a" />
  <rect x="24" y="440" width="96" height="120" fill="#fee3e2" />
  <text x="72" y="505" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">人工审核</text>

  <!-- 全局连接线与流程路由 (底层绘制以防止遮挡文字) -->
  <!-- 1: 提交请求 -> 系统受理 -->
  <polyline points="280,140 300,140 300,260 320,260" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- 2: 系统受理 -> 智能分析 -->
  <polyline points="440,260 460,260 460,380 480,380" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- 3: 智能分析 -> 风险判断 -->
  <line x1="600" y1="380" x2="650" y2="380" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- 4: 风险判断 -> 自动处理 (低风险) -->
  <line x1="770" y1="380" x2="860" y2="380" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- 5: 风险判断 -> 人工审批 (高风险) -->
  <polyline points="710,420 710,500 860,500" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- 6: 自动处理 -> 发送通知 (微调入口Y坐标避免完全重叠) -->
  <polyline points="980,380 1005,380 1005,255 1040,255" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- 7: 人工审批 -> 发送通知 (微调入口Y坐标避免完全重叠) -->
  <polyline points="980,500 1015,500 1015,265 1040,265" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- 8: 发送通知 -> 接收结果 -->
  <polyline points="1160,260 1180,260 1180,140 1200,140" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />


  <!-- 风险决策路径标签 (在连线之上绘制遮罩背景，防止穿字) -->
  <!-- 低风险标签 -->
  <rect x="790" y="368" width="50" height="24" fill="#ffffff" rx="4" />
  <text x="815" y="384" font-size="12" fill="#509863" font-weight="bold" text-anchor="middle">低风险</text>

  <!-- 高风险标签 -->
  <rect x="685" y="450" width="50" height="24" fill="#ffffff" rx="4" />
  <text x="710" y="466" font-size="12" fill="#d25d5a" font-weight="bold" text-anchor="middle">高风险</text>


  <!-- 流程节点 (Cards) -->
  <!-- 节点 1: 用户提交 -->
  <g transform="translate(160, 114)">
    <rect x="0" y="0" width="120" height="52" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
    <text x="60" y="22" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">提交请求</text>
    <text x="60" y="40" font-size="12" fill="#646a73" text-anchor="middle">发起业务流程</text>
  </g>

  <!-- 节点 2: 系统受理 -->
  <g transform="translate(320, 234)">
    <rect x="0" y="0" width="120" height="52" rx="6" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
    <text x="60" y="22" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">系统受理</text>
    <text x="60" y="40" font-size="12" fill="#646a73" text-anchor="middle">记录并调度</text>
  </g>

  <!-- 节点 3: 智能分析 -->
  <g transform="translate(480, 354)">
    <rect x="0" y="0" width="120" height="52" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
    <text x="60" y="22" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">智能分析</text>
    <text x="60" y="40" font-size="12" fill="#646a73" text-anchor="middle">意图与特征提取</text>
  </g>

  <!-- 节点 4: 风险判断 (判定菱形) -->
  <polygon points="710,340 770,380 710,420 650,380" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="710" y="384" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">风险判定</text>

  <!-- 节点 5: 自动处理 -->
  <g transform="translate(860, 354)">
    <rect x="0" y="0" width="120" height="52" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
    <text x="60" y="22" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">自动处理</text>
    <text x="60" y="40" font-size="12" fill="#646a73" text-anchor="middle">极速放行执行</text>
  </g>

  <!-- 节点 6: 人工审批 -->
  <g transform="translate(860, 474)">
    <rect x="0" y="0" width="120" height="52" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
    <text x="60" y="22" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">人工审批</text>
    <text x="60" y="40" font-size="12" fill="#646a73" text-anchor="middle">复杂案件介入</text>
  </g>

  <!-- 节点 7: 发送通知 -->
  <g transform="translate(1040, 234)">
    <rect x="0" y="0" width="120" height="52" rx="6" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
    <text x="60" y="22" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">结果汇总</text>
    <text x="60" y="40" font-size="12" fill="#646a73" text-anchor="middle">状态更新及流转</text>
  </g>

  <!-- 节点 8: 接收结果 -->
  <g transform="translate(1200, 114)">
    <rect x="0" y="0" width="120" height="52" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
    <text x="60" y="22" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">接收结果</text>
    <text x="60" y="40" font-size="12" fill="#646a73" text-anchor="middle">业务流程闭环</text>
  </g>
</svg>
