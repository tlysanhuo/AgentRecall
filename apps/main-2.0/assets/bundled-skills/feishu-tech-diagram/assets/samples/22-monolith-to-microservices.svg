<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="650" viewBox="0 0 1600 650" style="background-color: #ffffff;">
  <defs>
    <!-- 阶段间迁移箭头 -->
    <marker id="mig-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <polyline points="2,2 8,5 2,8" fill="none" stroke="#bbbfc4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <!-- 内部流程小箭头 -->
    <marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <polyline points="2,2 6,4 2,6" fill="none" stroke="#bbbfc4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- 全局标题 -->
  <text x="800" y="50" font-size="24" font-weight="bold" fill="#1f2329" text-anchor="middle">单体到微服务架构演进图</text>
  <text x="800" y="80" font-size="14" fill="#8f959e" text-anchor="middle">从单一进程向高内聚、低耦合的分布式自治架构平滑演进</text>

  <!-- ==================== 阶段 1：单体应用 ==================== -->
  <g id="stage-1">
    <text x="180" y="110" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">1. 单体应用</text>

    <!-- 单体大容器 (灰色底板) -->
    <rect x="60" y="130" width="240" height="360" rx="8" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1.5" />
    <text x="180" y="152" font-size="12" fill="#8f959e" text-anchor="middle">单体大容器</text>

    <!-- 前端应用 UI (浅蓝色) -->
    <rect x="80" y="170" width="200" height="40" rx="6" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1.5" />
    <text x="180" y="195" font-size="14" fill="#1f2329" text-anchor="middle">前端应用 UI</text>

    <!-- 强耦合业务逻辑 (白色容器包裹，展示不可分割) -->
    <rect x="80" y="230" width="200" height="160" rx="6" fill="#ffffff" stroke="#dee0e3" stroke-width="1" />
    <text x="180" y="250" font-size="12" fill="#8f959e" text-anchor="middle">业务逻辑 (紧耦合无明显边界)</text>

    <!-- 内部模块堆叠 -->
    <rect x="90" y="260" width="180" height="35" rx="4" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1" />
    <text x="180" y="282" font-size="14" fill="#1f2329" text-anchor="middle">模块 A</text>
    <rect x="90" y="300" width="180" height="35" rx="4" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1" />
    <text x="180" y="322" font-size="14" fill="#1f2329" text-anchor="middle">模块 B</text>
    <rect x="90" y="340" width="180" height="35" rx="4" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1" />
    <text x="180" y="362" font-size="14" fill="#1f2329" text-anchor="middle">模块 C</text>

    <!-- 单一数据库 (灰色) -->
    <rect x="80" y="420" width="200" height="50" rx="6" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1.5" />
    <text x="180" y="450" font-size="14" fill="#1f2329" text-anchor="middle">单一关系型数据库</text>

    <!-- 内部连线 -->
    <line x1="180" y1="210" x2="180" y2="225" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />
    <line x1="180" y1="390" x2="180" y2="415" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />
  </g>

  <!-- ==================== 阶段 2：模块化单体 ==================== -->
  <g id="stage-2">
    <text x="490" y="110" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">2. 模块化单体</text>

    <rect x="370" y="130" width="240" height="360" rx="8" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1.5" />
    <text x="490" y="152" font-size="12" fill="#8f959e" text-anchor="middle">单体大容器</text>

    <rect x="390" y="170" width="200" height="40" rx="6" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1.5" />
    <text x="490" y="195" font-size="14" fill="#1f2329" text-anchor="middle">前端应用 UI</text>

    <!-- 模块化边界 (虚线) -->
    <rect x="390" y="230" width="200" height="160" rx="6" fill="none" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="4,4" />
    <rect x="400" y="222" width="60" height="16" fill="#f5f5f5" />
    <text x="430" y="234" font-size="12" fill="#8f959e" text-anchor="middle">逻辑边界</text>

    <!-- 分离的模块 (浅蓝色) -->
    <rect x="405" y="245" width="170" height="35" rx="4" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1.5" />
    <text x="490" y="267" font-size="14" fill="#1f2329" text-anchor="middle">模块 A</text>
    <rect x="405" y="292" width="170" height="35" rx="4" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1.5" />
    <text x="490" y="314" font-size="14" fill="#1f2329" text-anchor="middle">模块 B</text>
    <rect x="405" y="340" width="170" height="35" rx="4" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1.5" />
    <text x="490" y="362" font-size="14" fill="#1f2329" text-anchor="middle">模块 C</text>

    <rect x="390" y="420" width="200" height="50" rx="6" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1.5" />
    <text x="490" y="450" font-size="14" fill="#1f2329" text-anchor="middle">单一关系型数据库</text>

    <!-- 内部连线 -->
    <line x1="490" y1="210" x2="490" y2="225" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />
    <line x1="490" y1="390" x2="490" y2="415" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />
  </g>

  <!-- ==================== 阶段 3：抽离共享能力 ==================== -->
  <g id="stage-3">
    <text x="800" y="110" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">3. 抽离共享能力</text>

    <!-- 核心大应用瘦身 -->
    <rect x="680" y="130" width="130" height="360" rx="8" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1.5" />
    <text x="745" y="152" font-size="12" fill="#8f959e" text-anchor="middle">瘦身后的核心系统</text>

    <rect x="690" y="170" width="110" height="40" rx="6" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1.5" />
    <text x="745" y="195" font-size="14" fill="#1f2329" text-anchor="middle">前端应用 UI</text>

    <!-- 瘦身后的业务逻辑 -->
    <rect x="690" y="230" width="110" height="160" rx="6" fill="#ffffff" stroke="#dee0e3" stroke-width="1" />
    <text x="745" y="248" font-size="12" fill="#8f959e" text-anchor="middle">核心业务</text>

    <rect x="700" y="260" width="90" height="40" rx="4" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1.5" />
    <text x="745" y="285" font-size="14" fill="#1f2329" text-anchor="middle">模块 A</text>
    <rect x="700" y="335" width="90" height="40" rx="4" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1.5" />
    <text x="745" y="360" font-size="14" fill="#1f2329" text-anchor="middle">模块 B</text>

    <rect x="690" y="420" width="110" height="50" rx="6" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1.5" />
    <text x="745" y="450" font-size="14" fill="#1f2329" text-anchor="middle">主数据库</text>

    <!-- 独立出的共享服务 (浅紫色) -->
    <rect x="825" y="260" width="90" height="115" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
    <text x="870" y="310" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">共享服务</text>
    <text x="870" y="330" font-size="12" fill="#1f2329" text-anchor="middle">(独立进程)</text>

    <!-- 独立出的共享DB (浅紫色) -->
    <rect x="825" y="420" width="90" height="50" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
    <text x="870" y="450" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">共享 DB</text>

    <!-- 内部连线 -->
    <line x1="745" y1="210" x2="745" y2="225" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />
    <line x1="745" y1="390" x2="745" y2="415" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />
    <line x1="870" y1="375" x2="870" y2="415" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />

    <!-- 跨进程调用连线 -->
    <line x1="790" y1="280" x2="820" y2="280" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />
    <line x1="790" y1="355" x2="820" y2="355" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />
  </g>

  <!-- ==================== 阶段 4：按领域拆解服务 ==================== -->
  <g id="stage-4">
    <text x="1110" y="110" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">4. 按领域拆解服务</text>

    <!-- API 路由网关 -->
    <rect x="990" y="150" width="240" height="40" rx="6" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1.5" />
    <text x="1110" y="175" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">API 路由网关</text>

    <!-- 独立微服务 A, B (浅蓝色) -->
    <rect x="990" y="240" width="70" height="130" rx="6" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1.5" />
    <text x="1025" y="300" font-size="14" fill="#1f2329" text-anchor="middle">领域</text>
    <text x="1025" y="320" font-size="14" fill="#1f2329" text-anchor="middle">服务 A</text>

    <rect x="1075" y="240" width="70" height="130" rx="6" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1.5" />
    <text x="1110" y="300" font-size="14" fill="#1f2329" text-anchor="middle">领域</text>
    <text x="1110" y="320" font-size="14" fill="#1f2329" text-anchor="middle">服务 B</text>

    <!-- 共享服务 (浅紫色) -->
    <rect x="1160" y="240" width="70" height="130" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
    <text x="1195" y="300" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">共享</text>
    <text x="1195" y="320" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">服务</text>

    <!-- 分布式数据库集群 -->
    <rect x="990" y="420" width="240" height="50" rx="6" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1.5" />
    <text x="1110" y="442" font-size="14" fill="#1f2329" text-anchor="middle">分布式数据库集群</text>
    <text x="1110" y="460" font-size="12" fill="#8f959e" text-anchor="middle">(按域逻辑隔离)</text>

    <!-- 内部连线 -->
    <line x1="1025" y1="190" x2="1025" y2="235" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />
    <line x1="1110" y1="190" x2="1110" y2="235" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />
    <line x1="1195" y1="190" x2="1195" y2="235" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />

    <line x1="1025" y1="370" x2="1025" y2="415" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />
    <line x1="1110" y1="370" x2="1110" y2="415" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />
    <line x1="1195" y1="370" x2="1195" y2="415" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />
  </g>

  <!-- ==================== 阶段 5：独立数据与平台治理 ==================== -->
  <g id="stage-5">
    <text x="1420" y="110" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">5. 独立数据与治理</text>

    <!-- 平台治理控制面 (浅紫色) -->
    <rect x="1300" y="130" width="240" height="60" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
    <text x="1420" y="155" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">平台治理控制面</text>
    <text x="1420" y="175" font-size="12" fill="#1f2329" text-anchor="middle">(微服务网关 / 服务网格 / 鉴权中心)</text>

    <!-- 独立微服务 A, B (浅蓝色) -->
    <rect x="1300" y="240" width="70" height="130" rx="6" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1.5" />
    <text x="1335" y="300" font-size="14" fill="#1f2329" text-anchor="middle">领域</text>
    <text x="1335" y="320" font-size="14" fill="#1f2329" text-anchor="middle">服务 A</text>

    <rect x="1385" y="240" width="70" height="130" rx="6" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1.5" />
    <text x="1420" y="300" font-size="14" fill="#1f2329" text-anchor="middle">领域</text>
    <text x="1420" y="320" font-size="14" fill="#1f2329" text-anchor="middle">服务 B</text>

    <!-- 共享服务 (浅紫色) -->
    <rect x="1470" y="240" width="70" height="130" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
    <text x="1505" y="300" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">共享</text>
    <text x="1505" y="320" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">域服务</text>

    <!-- 完全独立数据库 (浅紫色) -->
    <rect x="1300" y="420" width="70" height="50" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
    <text x="1335" y="442" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">独立</text>
    <text x="1335" y="460" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">DB A</text>

    <rect x="1385" y="420" width="70" height="50" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
    <text x="1420" y="442" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">独立</text>
    <text x="1420" y="460" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">DB B</text>

    <rect x="1470" y="420" width="70" height="50" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
    <text x="1505" y="442" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">专属</text>
    <text x="1505" y="460" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">存储</text>

    <!-- 内部连线 -->
    <line x1="1335" y1="190" x2="1335" y2="235" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />
    <line x1="1420" y1="190" x2="1420" y2="235" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />
    <line x1="1505" y1="190" x2="1505" y2="235" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />

    <line x1="1335" y1="370" x2="1335" y2="415" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />
    <line x1="1420" y1="370" x2="1420" y2="415" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />
    <line x1="1505" y1="370" x2="1505" y2="415" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#flow-arrow)" />
  </g>

  <!-- ==================== 迁移箭头 (全局流程连接) ==================== -->
  <line x1="310" y1="310" x2="355" y2="310" stroke="#8f959e" stroke-width="2" stroke-dasharray="4" marker-end="url(#mig-arrow)" />
  <line x1="620" y1="310" x2="665" y2="310" stroke="#8f959e" stroke-width="2" stroke-dasharray="4" marker-end="url(#mig-arrow)" />
  <line x1="930" y1="310" x2="975" y2="310" stroke="#8f959e" stroke-width="2" stroke-dasharray="4" marker-end="url(#mig-arrow)" />
  <line x1="1240" y1="310" x2="1285" y2="310" stroke="#8f959e" stroke-width="2" stroke-dasharray="4" marker-end="url(#mig-arrow)" />

  <!-- ==================== 底部贯穿时间轴 ==================== -->
  <g id="timeline">
    <line x1="100" y1="560" x2="1500" y2="560" stroke="#dee0e3" stroke-width="3" />

    <!-- 时间轴节点 -->
    <circle cx="180" cy="560" r="8" fill="#ffffff" stroke="#dee0e3" stroke-width="3" />
    <text x="180" y="590" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">阶段一：业务起步</text>
    <text x="180" y="610" font-size="12" fill="#8f959e" text-anchor="middle">全量代码/资源强耦合，敏捷快跑</text>

    <circle cx="490" cy="560" r="8" fill="#ffffff" stroke="#dee0e3" stroke-width="3" />
    <text x="490" y="590" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">阶段二：结构化分离</text>
    <text x="490" y="610" font-size="12" fill="#8f959e" text-anchor="middle">代码内部划定边界，降低修改冲突</text>

    <circle cx="800" cy="560" r="8" fill="#ffffff" stroke="#dee0e3" stroke-width="3" />
    <text x="800" y="590" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">阶段三：能力沉淀</text>
    <text x="800" y="610" font-size="12" fill="#8f959e" text-anchor="middle">通用能力下沉，提升业务复用率</text>

    <circle cx="1110" cy="560" r="8" fill="#ffffff" stroke="#dee0e3" stroke-width="3" />
    <text x="1110" y="590" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">阶段四：全面微服务化</text>
    <text x="1110" y="610" font-size="12" fill="#8f959e" text-anchor="middle">按业务域垂直拆分，进程级物理隔离</text>

    <circle cx="1420" cy="560" r="8" fill="#ffffff" stroke="#5178c6" stroke-width="3" />
    <text x="1420" y="590" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">阶段五：平台化与自治</text>
    <text x="1420" y="610" font-size="12" fill="#8f959e" text-anchor="middle">独立数据资产，引入网格与全局治理</text>

    <!-- 轴末端箭头 -->
    <polyline points="1490,555 1500,560 1490,565" fill="none" stroke="#dee0e3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

</svg>
