<svg width="1000" height="640" viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 主依赖箭头标记 -->
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8569cb" />
    </marker>
  </defs>

  <!-- 全局背景 (可选，便于在暗色环境预览) -->
  <rect width="1000" height="640" fill="#ffffff" />

  <!-- ========================================== -->
  <!-- Layer 1: 统一契约防护层 (Unified Contract) -->
  <!-- ========================================== -->
  <!-- 大虚线外框 -->
  <rect x="260" y="100" width="480" height="480" rx="16" fill="none" stroke="#8569cb" stroke-width="2" stroke-dasharray="6,4" />

  <!-- 四角装饰定位点 -->
  <rect x="257" y="97" width="6" height="6" rx="1" fill="#8569cb" />
  <rect x="737" y="97" width="6" height="6" rx="1" fill="#8569cb" />
  <rect x="257" y="577" width="6" height="6" rx="1" fill="#8569cb" />
  <rect x="737" y="577" width="6" height="6" rx="1" fill="#8569cb" />

  <!-- 统一契约底部说明区划分线 -->
  <line x1="280" y1="500" x2="720" y2="500" stroke="#eae2fe" stroke-width="1.5" />

  <!-- 统一契约文字说明 -->
  <text x="500" y="535" font-size="15" font-weight="bold" fill="#5263a5" text-anchor="middle">统一契约 (Unified Contract)</text>
  <text x="500" y="558" font-size="13" fill="#646a73" text-anchor="middle">定义标准化接口：注册 · 加载 · 执行 · 卸载</text>


  <!-- ========================================== -->
  <!-- Layer 2: 核心容器 (Core Host)              -->
  <!-- ========================================== -->
  <!-- Host 底板 -->
  <rect x="320" y="160" width="360" height="320" rx="12" fill="#f5f5f5" stroke="#bbbfc4" stroke-width="1.5" />

  <!-- Host 顶栏与分隔线 -->
  <text x="500" y="190" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">Core Host</text>
  <line x1="332" y1="205" x2="668" y2="205" stroke="#dee0e3" stroke-width="1.5" />

  <!-- Extension API 模块 -->
  <rect x="332" y="220" width="160" height="60" rx="8" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <!-- Extension API 图标 (插座) -->
  <circle cx="356" cy="250" r="10" fill="#ffffff" stroke="#5178c6" stroke-width="2" />
  <line x1="352" y1="246" x2="352" y2="254" stroke="#5178c6" stroke-width="2" />
  <line x1="360" y1="246" x2="360" y2="254" stroke="#5178c6" stroke-width="2" />
  <text x="374" y="254" font-size="14" font-weight="bold" fill="#1f2329">Extension API</text>

  <!-- Plugin Registry 模块 -->
  <rect x="508" y="220" width="160" height="60" rx="8" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <!-- Plugin Registry 图标 (抽屉/列表) -->
  <rect x="522" y="240" width="16" height="20" rx="2" fill="none" stroke="#5178c6" stroke-width="2" />
  <line x1="522" y1="246" x2="538" y2="246" stroke="#5178c6" stroke-width="2" />
  <line x1="522" y1="252" x2="538" y2="252" stroke="#5178c6" stroke-width="2" />
  <text x="548" y="254" font-size="14" font-weight="bold" fill="#1f2329">Plugin Registry</text>

  <!-- 权限隔离 模块 -->
  <rect x="332" y="300" width="336" height="66" rx="8" fill="#ffffff" stroke="#dee0e3" stroke-width="1.5" />
  <!-- 盾牌图标 -->
  <path d="M 352 315 L 360 312 L 368 315 L 368 325 C 368 333 360 338 360 338 C 360 338 352 333 352 325 Z" fill="none" stroke="#d4b45b" stroke-width="2" />
  <circle cx="360" cy="323" r="2" fill="#d4b45b" />
  <text x="380" y="328" font-size="14" font-weight="bold" fill="#1f2329">权限隔离</text>
  <text x="380" y="348" font-size="12" fill="#8f959e">Permission Isolation</text>
  <!-- 右侧要点列表 -->
  <circle cx="490" cy="333" r="3" fill="#d4b45b" />
  <text x="498" y="337" font-size="12" fill="#646a73">沙箱隔离</text>
  <circle cx="560" cy="333" r="3" fill="#d4b45b" />
  <text x="568" y="337" font-size="12" fill="#646a73">资源鉴权</text>
  <circle cx="630" cy="333" r="3" fill="#d4b45b" />
  <text x="638" y="337" font-size="12" fill="#646a73">拦截保护</text>

  <!-- 生命周期管理 模块 -->
  <rect x="332" y="386" width="336" height="66" rx="8" fill="#ffffff" stroke="#dee0e3" stroke-width="1.5" />
  <!-- 循环流转图标 -->
  <path d="M 356 401 A 8 8 0 1 1 352 406" fill="none" stroke="#509863" stroke-width="2" />
  <polygon points="356,397 360,401 356,405" fill="#509863" />
  <text x="380" y="414" font-size="14" font-weight="bold" fill="#1f2329">生命周期管理</text>
  <text x="380" y="434" font-size="12" fill="#8f959e">Lifecycle Management</text>
  <!-- 右侧状态流转小圆点 -->
  <circle cx="490" cy="419" r="3" fill="#509863" />
  <text x="498" y="423" font-size="12" fill="#646a73">注册</text>
  <circle cx="540" cy="419" r="3" fill="#5178c6" />
  <text x="548" y="423" font-size="12" fill="#646a73">加载</text>
  <circle cx="590" cy="419" r="3" fill="#8569cb" />
  <text x="598" y="423" font-size="12" fill="#646a73">执行</text>
  <circle cx="640" cy="419" r="3" fill="#d25d5a" />
  <text x="648" y="423" font-size="12" fill="#646a73">卸载</text>


  <!-- ========================================== -->
  <!-- Layer 3: 连线与跨界标识                    -->
  <!-- ========================================== -->
  <!-- Plugin A 连线 -->
  <line x1="220" y1="250" x2="312" y2="250" stroke="#8569cb" stroke-width="2" marker-end="url(#arrow-purple)" />
  <!-- Plugin B 连线 -->
  <line x1="500" y1="74" x2="500" y2="152" stroke="#8569cb" stroke-width="2" marker-end="url(#arrow-purple)" />
  <!-- Plugin C 连线 -->
  <line x1="780" y1="250" x2="688" y2="250" stroke="#8569cb" stroke-width="2" marker-end="url(#arrow-purple)" />

  <!-- 跨越统一契约层的明确交点(关卡指示) -->
  <circle cx="260" cy="250" r="4" fill="#ffffff" stroke="#8569cb" stroke-width="2" />
  <circle cx="500" cy="100" r="4" fill="#ffffff" stroke="#8569cb" stroke-width="2" />
  <circle cx="740" cy="250" r="4" fill="#ffffff" stroke="#8569cb" stroke-width="2" />


  <!-- ========================================== -->
  <!-- Layer 4: 外围插件环 (Plugins)              -->
  <!-- ========================================== -->
  <!-- Plugin A -->
  <rect x="80" y="218" width="140" height="64" rx="8" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <rect x="95" y="243" width="14" height="14" rx="3" fill="none" stroke="#8569cb" stroke-width="2" />
  <circle cx="102" cy="250" r="3" fill="#8569cb" />
  <text x="120" y="255" font-size="14" font-weight="bold" fill="#1f2329">Plugin A</text>

  <!-- Plugin B -->
  <rect x="430" y="10" width="140" height="64" rx="8" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <rect x="445" y="35" width="14" height="14" rx="3" fill="none" stroke="#8569cb" stroke-width="2" />
  <circle cx="452" cy="42" r="3" fill="#8569cb" />
  <text x="470" y="47" font-size="14" font-weight="bold" fill="#1f2329">Plugin B</text>

  <!-- Plugin C -->
  <rect x="780" y="218" width="140" height="64" rx="8" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <rect x="795" y="243" width="14" height="14" rx="3" fill="none" stroke="#8569cb" stroke-width="2" />
  <circle cx="802" cy="250" r="3" fill="#8569cb" />
  <text x="820" y="255" font-size="14" font-weight="bold" fill="#1f2329">Plugin C</text>


  <!-- ========================================== -->
  <!-- ========================================== -->

</svg>
