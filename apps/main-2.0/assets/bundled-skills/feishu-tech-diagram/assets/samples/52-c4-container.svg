  <text x="210" y="391" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">分布式缓存</text>
  <text x="210" y="411" font-size="12" fill="#646a73" text-anchor="middle">加速热点数据读取与状态维护</text>

  <rect x="100" y="520" width="220" height="74" rx="6" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
