<svg width="1200" height="1180" viewBox="0 0 1200 1180" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1.5 L 8 5 L 0 8.5" fill="none" stroke="#bbbfc4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </marker>
  </defs>

  <rect width="1200" height="1180" fill="#ffffff" />

  <text x="600" y="56" font-size="28" font-weight="bold" fill="#1f2329" text-anchor="middle">架构决策记录 (ADR)</text>
  <text x="600" y="82" font-size="14" fill="#8f959e" text-anchor="middle">Architecture Decision Record Template</text>

  <rect x="400" y="120" width="400" height="92" rx="6" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1" />
  <rect x="420" y="138" width="4" height="16" rx="2" fill="#8569cb" />
  <text x="432" y="151" font-size="16" font-weight="bold" fill="#1f2329">决策背景 (Context)</text>
  <text x="420" y="176" font-size="14" fill="#1f2329">• 随着业务用户量持续激增，系统整体负载不断攀升</text>
  <text x="420" y="196" font-size="14" fill="#1f2329">• 当前的单体架构已成为业务快速迭代的阻碍与瓶颈</text>

  <rect x="400" y="252" width="400" height="92" rx="6" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1" />
  <rect x="420" y="270" width="4" height="16" rx="2" fill="#d25d5a" />
  <text x="432" y="283" font-size="16" font-weight="bold" fill="#1f2329">架构痛点 (Problem)</text>
  <text x="420" y="308" font-size="14" fill="#1f2329">• 核心数据层查询严重超时，缺乏水平扩展能力</text>
  <text x="420" y="328" font-size="14" fill="#1f2329">• 各业务模块强耦合，导致牵一发而动全身，发布风险高</text>

  <rect x="400" y="384" width="400" height="92" rx="6" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1" />
  <rect x="420" y="402" width="4" height="16" rx="2" fill="#646a73" />
  <text x="432" y="415" font-size="16" font-weight="bold" fill="#1f2329">不可变约束 (Constraints)</text>
  <text x="420" y="440" font-size="14" fill="#1f2329">• 必须在今年 Q3 业务旺季前完成核心链路的架构改造</text>
  <text x="420" y="460" font-size="14" fill="#1f2329">• 新架构增加的服务器和基建预算年度同比不能超过 20%</text>

  <line x1="600" y1="212" x2="600" y2="252" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="600" y1="344" x2="600" y2="384" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <line x1="600" y1="476" x2="600" y2="500" stroke="#bbbfc4" stroke-width="1.5" />
  <line x1="350" y1="500" x2="850" y2="500" stroke="#bbbfc4" stroke-width="1.5" />
  <line x1="350" y1="500" x2="350" y2="520" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="600" y1="500" x2="600" y2="520" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="850" y1="500" x2="850" y2="520" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="240" y="520" width="220" height="100" rx="6" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1" />
  <rect x="256" y="538" width="4" height="16" rx="2" fill="#bbbfc4" />
  <text x="268" y="551" font-size="16" font-weight="bold" fill="#1f2329">方案 A (单体拆分)</text>
  <text x="256" y="578" font-size="14" fill="#1f2329">• 仅做服务级别水平拆分</text>
  <text x="256" y="598" font-size="14" fill="#1f2329">• 实施快，但无法根治痛点</text>

  <rect x="490" y="520" width="220" height="100" rx="6" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1" />
  <rect x="506" y="538" width="4" height="16" rx="2" fill="#8569cb" />
  <text x="518" y="551" font-size="16" font-weight="bold" fill="#1f2329">方案 B (微服务化)</text>
  <text x="506" y="578" font-size="14" fill="#1f2329">• 引入微服务及消息中间件</text>
  <text x="506" y="598" font-size="14" fill="#1f2329">• 扩展性佳，满足长期演进诉求</text>

  <rect x="740" y="520" width="220" height="100" rx="6" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1" />
  <rect x="756" y="538" width="4" height="16" rx="2" fill="#bbbfc4" />
  <text x="768" y="551" font-size="16" font-weight="bold" fill="#1f2329">方案 C (Serverless)</text>
  <text x="756" y="578" font-size="14" fill="#1f2329">• 采用全托管云原生计算架构</text>
  <text x="756" y="598" font-size="14" fill="#1f2329">• 重构成本极高，超出当前预算</text>

  <line x1="350" y1="620" x2="350" y2="650" stroke="#bbbfc4" stroke-width="1.5" />
  <line x1="850" y1="620" x2="850" y2="650" stroke="#bbbfc4" stroke-width="1.5" />
  <line x1="350" y1="650" x2="850" y2="650" stroke="#bbbfc4" stroke-width="1.5" />
  <line x1="600" y1="620" x2="600" y2="676" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="400" y="676" width="400" height="120" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <rect x="420" y="696" width="4" height="18" rx="2" fill="#8569cb" />
  <text x="432" y="710" font-size="18" font-weight="bold" fill="#1f2329">最终决策 (Decision)</text>
  <text x="420" y="740" font-size="14" font-weight="bold" fill="#1f2329">• 决定采用 方案 B (微服务化架构)</text>
  <text x="420" y="762" font-size="14" fill="#1f2329">• 综合评估下，该方案能够在严格的改造时间限制以及系</text>
  <text x="420" y="782" font-size="14" fill="#1f2329">  统长期扩展性之间取得最佳的技术与成本平衡。</text>

  <rect x="680" y="688" width="100" height="32" rx="16" fill="#ffffff" stroke="#8569cb" stroke-width="1.5" />
  <path d="M 698 704 L 702 708 L 710 699" fill="none" stroke="#8569cb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <text x="736" y="709" font-size="14" font-weight="bold" fill="#8569cb" text-anchor="middle">已接受</text>

  <line x1="600" y1="796" x2="600" y2="830" stroke="#bbbfc4" stroke-width="1.5" />
  <line x1="412" y1="830" x2="787" y2="830" stroke="#bbbfc4" stroke-width="1.5" />
  <line x1="412" y1="830" x2="412" y2="850" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="787" y1="830" x2="787" y2="850" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="240" y="850" width="345" height="120" rx="6" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1" />
  <rect x="256" y="868" width="4" height="16" rx="2" fill="#509863" />
  <text x="268" y="881" font-size="16" font-weight="bold" fill="#1f2329">正面后果 (Positive Consequences)</text>
  <text x="256" y="910" font-size="14" fill="#1f2329">• 极大提升系统水平扩展与高并发数据处理能力</text>
  <text x="256" y="934" font-size="14" fill="#1f2329">• 业务服务实现解耦，显著降低了后期的代码维护成本</text>

  <rect x="615" y="850" width="345" height="120" rx="6" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1" />
  <rect x="631" y="868" width="4" height="16" rx="2" fill="#d25d5a" />
  <text x="643" y="881" font-size="16" font-weight="bold" fill="#1f2329">负面后果 (Negative Consequences)</text>
  <text x="631" y="910" font-size="14" fill="#1f2329">• 前期基建搭建与微服务化架构重构的成本显著增加</text>
  <text x="631" y="934" font-size="14" fill="#1f2329">• 引入了分布式系统调用延迟以及相对较高的运维复杂度</text>

  <line x1="412" y1="970" x2="412" y2="990" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="787" y1="970" x2="787" y2="990" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <rect x="240" y="990" width="345" height="120" rx="6" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1" />
  <rect x="256" y="1008" width="4" height="16" rx="2" fill="#d4b45b" />
  <text x="268" y="1021" font-size="16" font-weight="bold" fill="#1f2329">已接受风险 (Accepted Risks)</text>
  <text x="256" y="1050" font-size="14" fill="#1f2329">• 团队对新引入的消息中间件及相关组件尚需时间熟悉</text>
  <text x="256" y="1074" font-size="14" fill="#1f2329">• 架构演进期间可能出现短暂的向后兼容性问题或 Bug</text>

  <rect x="615" y="990" width="345" height="120" rx="6" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1" />
  <rect x="631" y="1008" width="4" height="16" rx="2" fill="#5178c6" />
  <text x="643" y="1021" font-size="16" font-weight="bold" fill="#1f2329">复审触发条件 (Review Triggers)</text>
  <text x="631" y="1050" font-size="14" fill="#1f2329">• 核心链路响应耗时连续一周超过定义的 SLA 预警标准</text>
  <text x="631" y="1074" font-size="14" fill="#1f2329">• 业务用户量和系统并发量提前达到三年后的规划上限</text>

  </svg>
