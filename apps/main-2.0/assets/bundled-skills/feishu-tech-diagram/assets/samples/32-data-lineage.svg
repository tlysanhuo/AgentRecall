<svg width="1140" height="570" viewBox="0 0 1140 570" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Table Icon -->
    <g id="icon-table" stroke="currentColor" stroke-width="1.5" fill="none">
      <rect x="0" y="0" width="14" height="14" rx="2" />
      <line x1="0" y1="4" x2="14" y2="4" />
      <line x1="4" y1="4" x2="4" y2="14" />
    </g>
    <!-- Task Icon -->
    <g id="icon-task" stroke="currentColor" stroke-width="1.5" fill="none">
      <circle cx="7" cy="7" r="5" stroke-dasharray="2 1"/>
      <circle cx="7" cy="7" r="2" fill="currentColor" stroke="none"/>
    </g>
    <!-- Model Icon -->
    <g id="icon-model" stroke="currentColor" stroke-width="1.5" fill="none">
      <rect x="2" y="2" width="10" height="10" rx="1"/>
      <line x1="2" y1="6" x2="12" y2="6"/>
      <line x1="6" y1="2" x2="6" y2="12"/>
    </g>
    <!-- API Icon -->
    <g id="icon-api" stroke="currentColor" stroke-width="1.5" fill="none">
      <rect x="0" y="2" width="16" height="12" rx="2"/>
      <polyline points="3,5 6,8 3,11"/>
      <line x1="7" y1="11" x2="11" y2="11"/>
    </g>
    <!-- BI Icon -->
    <g id="icon-bi" fill="currentColor">
      <rect x="1" y="1" width="12" height="12" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/>
      <rect x="3" y="6" width="2" height="5" />
      <rect x="6" y="3" width="2" height="8" />
      <rect x="9" y="7" width="2" height="4" />
    </g>

    <!-- Marker HighLight -->
    <marker id="arrow-hl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8569cb" />
    </marker>
    <!-- Marker Normal -->
    <marker id="arrow-norm" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bbbfc4" />
    </marker>
  </defs>

  <!-- 泳道背景层 -->
  <g fill="#ffffff" stroke="#dee0e3" stroke-width="1">
    <rect x="20" y="20" width="260" height="490" rx="8" />
    <rect x="300" y="20" width="260" height="490" rx="8" />
    <rect x="580" y="20" width="260" height="490" rx="8" />
    <rect x="860" y="20" width="260" height="490" rx="8" />
  </g>

  <!-- 泳道顶栏标题 -->
  <g fill="#f5f5f5" stroke="none">
    <path d="M 20 28 A 8 8 0 0 1 28 20 L 272 20 A 8 8 0 0 1 280 28 L 280 60 L 20 60 Z" />
    <path d="M 300 28 A 8 8 0 0 1 308 20 L 552 20 A 8 8 0 0 1 560 28 L 560 60 L 300 60 Z" />
    <path d="M 580 28 A 8 8 0 0 1 588 20 L 832 20 A 8 8 0 0 1 840 28 L 840 60 L 580 60 Z" />
    <path d="M 860 28 A 8 8 0 0 1 868 20 L 1112 20 A 8 8 0 0 1 1120 28 L 1120 60 L 860 60 Z" />
  </g>

  <!-- 泳道分割线与标题文字 -->
  <g stroke="#dee0e3" stroke-width="1">
    <line x1="20" y1="60" x2="280" y2="60" />
    <line x1="300" y1="60" x2="560" y2="60" />
    <line x1="580" y1="60" x2="840" y2="60" />
    <line x1="860" y1="60" x2="1120" y2="60" />
  </g>
  <g font-size="14" font-weight="bold" fill="#646a73" text-anchor="middle">
    <text x="150" y="44">数据源 (Source)</text>
    <text x="430" y="44">处理任务 (Process)</text>
    <text x="710" y="44">数据模型 (Model)</text>
    <text x="990" y="44">数据消费 (Consume)</text>
  </g>

  <!-- 常规连线链路 (优先绘制到底层，防止遮挡) -->
  <g fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-norm)">
    <polyline points="260,425 285,425 285,285 320,285" />
    <polyline points="260,425 280,425 280,435 320,435" />
    <polyline points="540,435 570,435 570,435 600,435" />
    <polyline points="820,435 850,435 850,435 880,435" />
  </g>

  <!-- 高亮连线链路 (字段变更波及) -->
  <g fill="none" stroke="#8569cb" stroke-width="2" marker-end="url(#arrow-hl)">
    <polyline points="260,175 280,175 280,135 320,135" />
    <polyline points="260,175 295,175 295,285 320,285" />
    <polyline points="540,135 560,135 560,210 600,210" />
    <polyline points="540,285 570,285 570,210 600,210" />
    <polyline points="820,210 840,210 840,135 880,135" />
    <polyline points="820,210 855,210 855,285 880,285" />
  </g>

  <!-- Node 1_1: src_user_profile (高亮) -->
  <rect x="40" y="130" width="220" height="90" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <line x1="40" y1="166" x2="260" y2="166" stroke="#8569cb" stroke-width="1" stroke-dasharray="2 2" />
  <g color="#8569cb"><use href="#icon-table" x="56" y="142" /></g>
  <text x="76" y="156" font-size="14" font-weight="bold" fill="#1f2329">源表: src_user_profile</text>
  <text x="56" y="188" font-size="12" fill="#646a73"><tspan fill="#d25d5a" font-weight="bold">引发源:</tspan> 字段 user_id 变更</text>
  <text x="56" y="206" font-size="12" fill="#646a73">(由 Int 变更为 String 类型)</text>

  <!-- Node 1_2: src_order_detail (常规) -->
  <rect x="40" y="380" width="220" height="90" rx="6" fill="#f0f4fc" stroke="#bbbfc4" stroke-width="1" />
  <line x1="40" y1="416" x2="260" y2="416" stroke="#bbbfc4" stroke-width="1" stroke-dasharray="2 2" />
  <g color="#646a73"><use href="#icon-table" x="56" y="392" /></g>
  <text x="76" y="406" font-size="14" font-weight="bold" fill="#1f2329">源表: src_order_detail</text>
  <text x="56" y="438" font-size="12" fill="#646a73">表结构未变更</text>
  <text x="56" y="456" font-size="12" fill="#646a73">正常产出 order_id, amount</text>

  <!-- Node 2_1: sync_user_data (高亮) -->
  <rect x="320" y="90" width="220" height="90" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <line x1="320" y1="126" x2="540" y2="126" stroke="#8569cb" stroke-width="1" stroke-dasharray="2 2" />
  <g color="#8569cb"><use href="#icon-task" x="336" y="102" /></g>
  <text x="356" y="116" font-size="14" font-weight="bold" fill="#1f2329">任务: sync_user_data</text>
  <text x="336" y="148" font-size="12" fill="#646a73"><tspan fill="#d25d5a" font-weight="bold">异常波及:</tspan> 核心流式解析失败</text>
  <text x="336" y="166" font-size="12" fill="#646a73">类型不兼容，导致任务熔断</text>

  <!-- Node 2_3: join_user_order (高亮) -->
  <rect x="320" y="240" width="220" height="90" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <line x1="320" y1="276" x2="540" y2="276" stroke="#8569cb" stroke-width="1" stroke-dasharray="2 2" />
  <g color="#8569cb"><use href="#icon-task" x="336" y="252" /></g>
  <text x="356" y="266" font-size="14" font-weight="bold" fill="#1f2329">任务: join_user_order</text>
  <text x="336" y="298" font-size="12" fill="#646a73"><tspan fill="#d25d5a" font-weight="bold">异常波及:</tspan> 离线关联查询报错</text>
  <text x="336" y="316" font-size="12" fill="#646a73">Join 字段类型冲突无法匹配</text>

  <!-- Node 2_2: agg_daily_sales (常规) -->
  <rect x="320" y="390" width="220" height="90" rx="6" fill="#f0f4fc" stroke="#bbbfc4" stroke-width="1" />
  <line x1="320" y1="426" x2="540" y2="426" stroke="#bbbfc4" stroke-width="1" stroke-dasharray="2 2" />
  <g color="#646a73"><use href="#icon-task" x="336" y="402" /></g>
  <text x="356" y="416" font-size="14" font-weight="bold" fill="#1f2329">任务: agg_daily_sales</text>
  <text x="336" y="448" font-size="12" fill="#646a73">销售额聚合任务产出正常</text>
  <text x="336" y="466" font-size="12" fill="#646a73">逻辑不涉及被破坏的 user_id</text>

  <!-- Node 3_1: dwd_user_order (高亮) -->
  <rect x="600" y="165" width="220" height="90" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <line x1="600" y1="201" x2="820" y2="201" stroke="#8569cb" stroke-width="1" stroke-dasharray="2 2" />
  <g color="#8569cb"><use href="#icon-model" x="616" y="177" /></g>
  <text x="636" y="191" font-size="14" font-weight="bold" fill="#1f2329">宽表: dwd_user_order</text>
  <text x="616" y="223" font-size="12" fill="#646a73"><tspan fill="#d25d5a" font-weight="bold">数据异常:</tspan> 核心主表产出延迟</text>
  <text x="616" y="241" font-size="12" fill="#646a73">上游中断，下游数据大面积空缺</text>

  <!-- Node 3_2: dws_sales_summary (常规) -->
  <rect x="600" y="390" width="220" height="90" rx="6" fill="#f0f4fc" stroke="#bbbfc4" stroke-width="1" />
  <line x1="600" y1="426" x2="820" y2="426" stroke="#bbbfc4" stroke-width="1" stroke-dasharray="2 2" />
  <g color="#646a73"><use href="#icon-model" x="616" y="402" /></g>
  <text x="636" y="416" font-size="14" font-weight="bold" fill="#1f2329">指标: dws_sales_summary</text>
  <text x="616" y="448" font-size="12" fill="#646a73">按天交易额指标更新正常</text>
  <text x="616" y="466" font-size="12" fill="#646a73">未依赖受污染模型的宽表</text>

  <!-- Node 4_1: User Activity BI (高亮) -->
  <rect x="880" y="90" width="220" height="90" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <line x1="880" y1="126" x2="1100" y2="126" stroke="#8569cb" stroke-width="1" stroke-dasharray="2 2" />
  <g color="#8569cb"><use href="#icon-bi" x="896" y="102" /></g>
  <text x="916" y="116" font-size="14" font-weight="bold" fill="#1f2329">报表: User Activity BI</text>
  <text x="896" y="148" font-size="12" fill="#646a73"><tspan fill="#d25d5a" font-weight="bold">展现报错:</tspan> 活跃用户分析大盘</text>
  <text x="896" y="166" font-size="12" fill="#646a73">底层空表及类型错乱，图表崩溃</text>

  <!-- Node 4_2: User Profile Svc (高亮) -->
  <rect x="880" y="240" width="220" height="90" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <line x1="880" y1="276" x2="1100" y2="276" stroke="#8569cb" stroke-width="1" stroke-dasharray="2 2" />
  <g color="#8569cb"><use href="#icon-api" x="896" y="252" /></g>
  <text x="916" y="266" font-size="14" font-weight="bold" fill="#1f2329">API: User Profile Svc</text>
  <text x="896" y="298" font-size="12" fill="#646a73"><tspan fill="#d25d5a" font-weight="bold">服务熔断:</tspan> 画像查询反序列化报错</text>
  <text x="896" y="316" font-size="12" fill="#646a73">读取数据超时，接口大面积降级</text>

  <!-- Node 4_3: Sales Dashboard (常规) -->
  <rect x="880" y="390" width="220" height="90" rx="6" fill="#f0f4fc" stroke="#bbbfc4" stroke-width="1" />
  <line x1="880" y1="426" x2="1100" y2="426" stroke="#bbbfc4" stroke-width="1" stroke-dasharray="2 2" />
  <g color="#646a73"><use href="#icon-bi" x="896" y="402" /></g>
  <text x="916" y="416" font-size="14" font-weight="bold" fill="#1f2329">报表: Sales Dashboard</text>
  <text x="896" y="448" font-size="12" fill="#646a73">销售业务大盘展示正常</text>
  <text x="896" y="466" font-size="12" fill="#646a73">核心指标无数据缺失与延迟</text>

  <!-- 底部图例与说明 -->
  <rect x="380" y="530" width="16" height="16" rx="4" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <polyline points="406,538 436,538" fill="none" stroke="#8569cb" stroke-width="2" marker-end="url(#arrow-hl)" />
  <text x="450" y="542" font-size="12" fill="#646a73">字段变更波及链路</text>

  <rect x="580" y="530" width="16" height="16" rx="4" fill="#f0f4fc" stroke="#bbbfc4" stroke-width="1.5" />
  <polyline points="606,538 636,538" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow-norm)" />
  <text x="650" y="542" font-size="12" fill="#646a73">未受影响的常规链路</text>
</svg>
