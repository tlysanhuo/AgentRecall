<svg width="880" height="660" viewBox="0 0 880 660" xmlns="http://www.w3.org/2000/svg">
  <!--
    Agent 记忆架构图
    设计说明：
    1. 采用左(检索)、中(存储层)、右(写入/清洗动作)的高密度布局。
    2. 色彩按规范严格映射：工作区(紫)、会话区(浅蓝)、长期区(灰蓝靛青)；动作流严格分色，保证视觉焦点。
    3. 连线点到为止：避让节点和文本，走正交通道，减少干扰。
  -->

  <defs>
    <!-- 连线箭头定义 -->
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#509863" />
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#d4b45b" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#d25d5a" />
    </marker>

    <!-- 阴影定义 (使用简单柔和阴影，增强主次) -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#bbbfc4" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- 全局背景底色 (极浅灰，衬托白色/彩色卡片) -->
  <rect width="880" height="660" fill="#f5f5f5" />

  <!-- ==================== 连线路由层 (底层渲染) ==================== -->
  <g id="routing-lines">
    <!-- 1. 绿色写入管线 (工作 -> 抽取 -> 会话 -> 评分 -> 写入 -> 长期) -->
    <!-- 工作 -> 抽取 -->
    <polyline points="510,120 660,120 660,140" fill="none" stroke="#509863" stroke-width="1.5" marker-end="url(#arrow-green)" />
    <!-- 抽取 -> 会话 -->
    <polyline points="660,204 660,280 510,280" fill="none" stroke="#509863" stroke-width="1.5" marker-end="url(#arrow-green)" />
    <!-- 会话 -> 评分 -->
    <polyline points="510,312 580,312" fill="none" stroke="#509863" stroke-width="1.5" marker-end="url(#arrow-green)" />
    <!-- 评分 -> 写入 -->
    <polyline points="660,344 660,370" fill="none" stroke="#509863" stroke-width="1.5" marker-end="url(#arrow-green)" />
    <!-- 写入 -> 长期 -->
    <polyline points="660,434 660,470 510,470" fill="none" stroke="#509863" stroke-width="1.5" marker-end="url(#arrow-green)" />

    <!-- 2. 黄色检索管线 (长期/会话 -> 检索 -> 工作) -->
    <!-- 长期 -> 检索 -->
    <polyline points="250,488 120,488 120,356" fill="none" stroke="#d4b45b" stroke-width="1.5" marker-end="url(#arrow-yellow)" />
    <!-- 会话 -> 检索 -->
    <polyline points="250,308 190,308" fill="none" stroke="#d4b45b" stroke-width="1.5" marker-end="url(#arrow-yellow)" />
    <!-- 检索 -> 工作 -->
    <polyline points="120,260 120,128 250,128" fill="none" stroke="#d4b45b" stroke-width="1.5" marker-end="url(#arrow-yellow)" />

    <!-- 3. 红色清理总线 (清理 -> 长期/会话，虚线，后台动作) -->
    <!-- 清理 -> 长期 -->
    <polyline points="580,512 510,512" fill="none" stroke="#d25d5a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)" />
    <!-- 清理 -> 会话 (沿专用通道 x=545 上升) -->
    <polyline points="580,512 545,512 545,334 510,334" fill="none" stroke="#d25d5a" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-red)" />
  </g>

  <!-- 连线标签 -->
  <g id="line-labels" font-size="12" fill="#646a73">
    <text x="585" y="114" text-anchor="middle">感知 / 截获</text>
    <text x="620" y="274" text-anchor="middle">更新上下文</text>
    <text x="526" y="306" text-anchor="middle">提取实体</text>
    <text x="585" y="464" text-anchor="middle">持久化入库</text>
    <text x="185" y="122" text-anchor="middle">按需组装注入</text>
  </g>


  <!-- ==================== 核心记忆层 ==================== -->
  <g id="memory-layers">
    <!-- 1. 工作记忆 (Layer 1) -->
    <rect x="250" y="80" width="260" height="104" rx="8" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="266" y="96" width="16" height="16" rx="3" fill="none" stroke="#8569cb" stroke-width="1.5" />
    <line x1="270" y1="94" x2="278" y2="94" stroke="#8569cb" stroke-width="1.5" />
    <line x1="270" y1="114" x2="278" y2="114" stroke="#8569cb" stroke-width="1.5" />
    <line x1="264" y1="100" x2="264" y2="108" stroke="#8569cb" stroke-width="1.5" />
    <line x1="284" y1="100" x2="284" y2="108" stroke="#8569cb" stroke-width="1.5" />
    <text x="290" y="109" font-size="16" font-weight="bold" fill="#1f2329">工作记忆</text>
    <text x="494" y="108" font-size="12" fill="#8f959e" text-anchor="end">Working Memory</text>
    <line x1="266" y1="126" x2="494" y2="126" stroke="#8569cb" stroke-width="1" stroke-dasharray="2 2" />
    <text x="266" y="148" font-size="13" fill="#1f2329">• 维护当前 Token 窗口与短期状态</text>
    <text x="266" y="168" font-size="13" fill="#1f2329">• 即时逻辑推理与任务意图解析</text>

    <!-- 2. 会话记忆 (Layer 2) -->
    <rect x="250" y="260" width="260" height="104" rx="8" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="266" y="278" width="12" height="10" rx="3" fill="none" stroke="#5178c6" stroke-width="1.5" />
    <polyline points="270,288 274,288 270,292" fill="#5178c6" stroke="#5178c6" stroke-width="1.5" />
    <text x="290" y="289" font-size="16" font-weight="bold" fill="#1f2329">会话记忆</text>
    <text x="494" y="288" font-size="12" fill="#8f959e" text-anchor="end">Session Memory</text>
    <line x1="266" y1="306" x2="494" y2="306" stroke="#5178c6" stroke-width="1" stroke-dasharray="2 2" />
    <text x="266" y="328" font-size="13" fill="#1f2329">• 记录对话历史与近远期交互轮次</text>
    <text x="266" y="348" font-size="13" fill="#1f2329">• 保留多轮对话连贯性与局部实体</text>

    <!-- 3. 长期记忆 (Layer 3) -->
    <!-- 长期记忆色板中，indigo的字体是不支持的，因此严格采用 #1f2329 黑色文本 -->
    <rect x="250" y="440" width="260" height="104" rx="8" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" filter="url(#shadow)" />
    <rect x="266" y="454" width="14" height="18" rx="2" fill="none" stroke="#5263a5" stroke-width="1.5" />
    <line x1="266" y1="460" x2="280" y2="460" stroke="#5263a5" stroke-width="1.5" />
    <line x1="266" y1="466" x2="280" y2="466" stroke="#5263a5" stroke-width="1.5" />
    <text x="290" y="469" font-size="16" font-weight="bold" fill="#1f2329">长期记忆</text>
    <text x="494" y="468" font-size="12" fill="#8f959e" text-anchor="end">Long-Term Memory</text>
    <line x1="266" y1="486" x2="494" y2="486" stroke="#5263a5" stroke-width="1" stroke-dasharray="2 2" />
    <text x="266" y="508" font-size="13" fill="#1f2329">• 持久化向量库 (Vector) 与图谱</text>
    <text x="266" y="528" font-size="13" fill="#1f2329">• 提供全局领域知识及长周期经验</text>
  </g>


  <!-- ==================== 右侧处理流动作 (绿色卡片) ==================== -->
  <g id="write-pipeline">
    <!-- 动作 1: 记忆抽取 -->
    <rect x="580" y="140" width="160" height="64" rx="8" fill="#dff5e5" stroke="#509863" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="604" cy="172" r="14" fill="#ffffff" stroke="#509863" stroke-width="1" />
    <polyline points="600,169 608,169 605,173 605,177 603,177 603,173" fill="#509863" />
    <text x="626" y="168" font-size="14" font-weight="bold" fill="#509863">记忆抽取</text>
    <text x="626" y="186" font-size="11" fill="#1f2329">感知结构化片段</text>

    <!-- 动作 2: 价值评分 -->
    <rect x="580" y="280" width="160" height="64" rx="8" fill="#dff5e5" stroke="#509863" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="604" cy="312" r="14" fill="#ffffff" stroke="#509863" stroke-width="1" />
    <path d="M604,306 L606,310 L611,310 L607,313 L608,318 L604,315 L600,318 L601,313 L597,310 L602,310 Z" fill="#509863" />
    <text x="626" y="308" font-size="14" font-weight="bold" fill="#509863">价值评分</text>
    <text x="626" y="326" font-size="11" fill="#1f2329">权重筛选与重要度</text>

    <!-- 动作 3: 去重写入 -->
    <rect x="580" y="370" width="160" height="64" rx="8" fill="#dff5e5" stroke="#509863" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="604" cy="402" r="14" fill="#ffffff" stroke="#509863" stroke-width="1" />
    <line x1="599" y1="408" x2="609" y2="408" stroke="#509863" stroke-width="1.5" />
    <polyline points="601,402 604,405 607,402" fill="none" stroke="#509863" stroke-width="1.5" />
    <line x1="604" y1="396" x2="604" y2="405" stroke="#509863" stroke-width="1.5" />
    <text x="626" y="398" font-size="14" font-weight="bold" fill="#509863">去重写入</text>
    <text x="626" y="416" font-size="11" fill="#1f2329">合并相似及覆写</text>
  </g>


  <!-- ==================== 左侧读取流 (黄色卡片) ==================== -->
  <g id="read-pipeline">
    <rect x="50" y="260" width="140" height="96" rx="8" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="74" cy="284" r="12" fill="#ffffff" stroke="#d4b45b" stroke-width="1" />
    <circle cx="72" cy="282" r="4" fill="none" stroke="#d4b45b" stroke-width="1.5" />
    <line x1="75" y1="285" x2="79" y2="289" stroke="#d4b45b" stroke-width="1.5" />
    <text x="94" y="288" font-size="14" font-weight="bold" fill="#d4b45b">按需检索</text>
    <line x1="62" y1="306" x2="178" y2="306" stroke="#d4b45b" stroke-width="1" stroke-dasharray="2 2" />
    <text x="62" y="326" font-size="12" fill="#1f2329">• 混合相似度搜索</text>
    <text x="62" y="344" font-size="12" fill="#1f2329">• 实体关系追溯</text>
  </g>


  <!-- ==================== 右下底座动作 (红色清理) ==================== -->
  <g id="clean-pipeline">
    <rect x="580" y="480" width="160" height="64" rx="8" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" filter="url(#shadow)" />
    <circle cx="604" cy="512" r="14" fill="#ffffff" stroke="#d25d5a" stroke-width="1" />
    <rect x="599" y="510" width="10" height="8" fill="none" stroke="#d25d5a" stroke-width="1.2" />
    <line x1="597" y1="510" x2="611" y2="510" stroke="#d25d5a" stroke-width="1.2" />
    <line x1="602" y1="507" x2="606" y2="507" stroke="#d25d5a" stroke-width="1.2" />
    <text x="626" y="508" font-size="14" font-weight="bold" fill="#d25d5a">遗忘清理</text>
    <text x="626" y="526" font-size="11" fill="#1f2329">衰减与周期淘汰</text>
  </g>

</svg>
