<svg xmlns="http://www.w3.org/2000/svg" width="920" height="740" viewBox="0 0 920 740">
  <defs>
    <marker id="arrowSolid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="#1f2329" />
    </marker>
    <marker id="arrowDashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#1f2329" stroke-width="1.5" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="50" y="40" font-size="18" font-weight="bold" fill="#1f2329">同步调用时序图</text>

  <!-- Lifeline Drop Lines (Dashed) -->
  <line x1="100" y1="100" x2="100" y2="670" stroke="#1f2329" stroke-width="1.5" stroke-dasharray="6 4" />
  <line x1="280" y1="100" x2="280" y2="670" stroke="#1f2329" stroke-width="1.5" stroke-dasharray="6 4" />
  <line x1="460" y1="100" x2="460" y2="670" stroke="#1f2329" stroke-width="1.5" stroke-dasharray="6 4" />
  <line x1="640" y1="100" x2="640" y2="670" stroke="#1f2329" stroke-width="1.5" stroke-dasharray="6 4" />
  <line x1="820" y1="100" x2="820" y2="670" stroke="#1f2329" stroke-width="1.5" stroke-dasharray="6 4" />

  <!-- Alt Fragment Box -->
  <rect x="50" y="290" width="830" height="340" fill="none" stroke="#1f2329" stroke-width="1.5" rx="4" />
  <path d="M 50 290 L 130 290 L 130 310 L 120 318 L 50 318 Z" fill="#f5f5f5" stroke="#1f2329" stroke-width="1.5" />
  <text x="90" y="309" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">alt</text>
  <text x="140" y="309" font-size="12" fill="#646a73">[外部服务正常]</text>

  <line x1="50" y1="540" x2="880" y2="540" stroke="#1f2329" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="60" y="562" font-size="12" fill="#646a73">[请求超时]</text>

  <!-- Lifeline Headers -->
  <!-- Caller -->
  <rect x="40" y="60" width="120" height="40" rx="4" fill="#ffffff" stroke="#1f2329" stroke-width="1.5" />
  <text x="100" y="85" font-size="14" fill="#1f2329" text-anchor="middle">调用方</text>
  <!-- API Gateway -->
  <rect x="220" y="60" width="120" height="40" rx="4" fill="#ffffff" stroke="#1f2329" stroke-width="1.5" />
  <text x="280" y="85" font-size="14" fill="#1f2329" text-anchor="middle">API 网关</text>
  <!-- Business Service -->
  <rect x="400" y="60" width="120" height="40" rx="4" fill="#ffffff" stroke="#1f2329" stroke-width="1.5" />
  <text x="460" y="85" font-size="14" fill="#1f2329" text-anchor="middle">业务服务</text>
  <!-- Database -->
  <rect x="580" y="60" width="120" height="40" rx="4" fill="#ffffff" stroke="#1f2329" stroke-width="1.5" />
  <text x="640" y="85" font-size="14" fill="#1f2329" text-anchor="middle">数据库</text>
  <!-- External Service -->
  <rect x="760" y="60" width="120" height="40" rx="4" fill="#ffffff" stroke="#1f2329" stroke-width="1.5" />
  <text x="820" y="85" font-size="14" fill="#1f2329" text-anchor="middle">外部服务</text>

  <!-- Activation Boxes -->
  <rect x="96" y="140" width="8" height="450" fill="#f5f5f5" stroke="#1f2329" stroke-width="1.5" />
  <rect x="276" y="140" width="8" height="370" fill="#f5f5f5" stroke="#1f2329" stroke-width="1.5" />
  <rect x="456" y="180" width="8" height="410" fill="#f5f5f5" stroke="#1f2329" stroke-width="1.5" />
  <rect x="636" y="220" width="8" height="40" fill="#f5f5f5" stroke="#1f2329" stroke-width="1.5" />
  <rect x="636" y="420" width="8" height="30" fill="#f5f5f5" stroke="#1f2329" stroke-width="1.5" />
  <rect x="816" y="340" width="8" height="40" fill="#f5f5f5" stroke="#1f2329" stroke-width="1.5" />

  <!-- Message Lines & Texts -->
  <!-- Step 1: Caller -> Gateway -->
  <line x1="104" y1="140" x2="276" y2="140" stroke="#1f2329" stroke-width="1.5" marker-end="url(#arrowSolid)" />
  <text x="190" y="132" font-size="12" fill="#1f2329" text-anchor="middle">1. 发起同步请求</text>

  <!-- Step 2: Gateway -> Business -->
  <line x1="284" y1="180" x2="456" y2="180" stroke="#1f2329" stroke-width="1.5" marker-end="url(#arrowSolid)" />
  <text x="370" y="172" font-size="12" fill="#1f2329" text-anchor="middle">2. 鉴权通过并路由</text>

  <!-- Step 3: Business -> Database -->
  <line x1="464" y1="220" x2="636" y2="220" stroke="#1f2329" stroke-width="1.5" marker-end="url(#arrowSolid)" />
  <text x="550" y="212" font-size="12" fill="#1f2329" text-anchor="middle">3. 读取业务上下文</text>

  <!-- Step 4: Database -> Business -->
  <line x1="636" y1="260" x2="464" y2="260" stroke="#1f2329" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowDashed)" />
  <text x="550" y="252" font-size="12" fill="#1f2329" text-anchor="middle">4. 返回数据</text>

  <!-- Step 5: Business -> External -->
  <line x1="464" y1="340" x2="816" y2="340" stroke="#1f2329" stroke-width="1.5" marker-end="url(#arrowSolid)" />
  <text x="640" y="332" font-size="12" fill="#1f2329" text-anchor="middle">5. 同步调用外部服务</text>

  <!-- Step 6: External -> Business -->
  <line x1="816" y1="380" x2="464" y2="380" stroke="#1f2329" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowDashed)" />
  <text x="640" y="372" font-size="12" fill="#1f2329" text-anchor="middle">6. 成功响应</text>

  <!-- Step 7: Business -> Database (Write) -->
  <line x1="464" y1="420" x2="636" y2="420" stroke="#1f2329" stroke-width="1.5" marker-end="url(#arrowSolid)" />
  <text x="550" y="412" font-size="12" fill="#1f2329" text-anchor="middle">7. 写入最终结果</text>

  <!-- Step 8: Business -> Gateway (Sync response) -->
  <line x1="456" y1="470" x2="284" y2="470" stroke="#1f2329" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowDashed)" />
  <text x="370" y="462" font-size="12" fill="#1f2329" text-anchor="middle">8. 同步业务响应</text>

  <!-- Step 9: Gateway -> Caller -->
  <line x1="276" y1="510" x2="104" y2="510" stroke="#1f2329" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowDashed)" />
  <text x="190" y="502" font-size="12" fill="#1f2329" text-anchor="middle">9. 返回 200 OK</text>

  <!-- Step 10: Business -> Caller (Timeout Return crossing Gateway) -->
  <line x1="456" y1="590" x2="104" y2="590" stroke="#1f2329" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrowDashed)" />
  <!-- Opaque background for step 10 text to cut through the Gateway lifeline dashed line cleanly -->
  <rect x="180" y="578" width="200" height="20" fill="#ffffff" />
  <text x="280" y="592" font-size="12" fill="#1f2329" text-anchor="middle">10. 返回 504 Gateway Timeout</text>

</svg>
