<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
  <defs>
    <!-- 连线箭头 Marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#bbbfc4" />
    </marker>
  </defs>

  <!-- 并发执行区域底板 (Container) -->
  <rect x="330" y="60" width="300" height="480" rx="8" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1.5" stroke-dasharray="6,4" />
  <text x="480" y="86" font-size="14" font-weight="bold" fill="#8f959e" text-anchor="middle">Multi-Agent 并行执行池</text>

  <!-- ================= 连线层 ================= -->
  <!-- Fan-out 扇出路由连线 -->
  <polyline points="220,300 275,300 275,165 340,165" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="220,300 340,300" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="220,300 275,300 275,435 340,435" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <text x="285" y="157" font-size="11" fill="#8f959e">Task 1 载荷</text>
  <text x="260" y="292" font-size="11" fill="#8f959e">Task 2 载荷</text>
  <text x="285" y="427" font-size="11" fill="#8f959e">Task 3 载荷</text>

  <!-- Fan-in 扇入汇合连线 -->
  <polyline points="610,165 685,165 685,240 730,240" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="610,300 730,300" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="610,435 685,435 685,360 730,360" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <text x="620" y="157" font-size="11" fill="#8f959e">结果校验码</text>
  <text x="645" y="292" font-size="11" fill="#8f959e">标准化产物</text>
  <text x="620" y="427" font-size="11" fill="#8f959e">返回结果集</text>

  <!-- 聚合输出连线 -->
  <polyline points="920,300 990,300" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="935" y="292" font-size="11" fill="#8f959e">Final Data</text>


  <!-- ================= 节点卡片层 ================= -->

  <!-- 左侧：总任务分发节点 -->
  <rect x="60" y="240" width="160" height="120" rx="8" fill="#f0f4fc" />
  <text x="140" y="276" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">任务接收与分发</text>
  <text x="140" y="298" font-size="12" fill="#5178c6" text-anchor="middle">Fan-out 路由控制</text>
  <line x1="80" x2="200" y1="312" y2="312" stroke="#ffffff" stroke-width="2" />
  <text x="140" y="336" font-size="12" fill="#8f959e" text-anchor="middle">异步触发并行链路</text>

  <!-- 中间：并行子任务节点 1 -->
  <rect x="350" y="110" width="260" height="110" rx="6" fill="#ffffff" stroke="#dee0e3" stroke-width="1.5" />
  <circle cx="380" cy="131" r="5" fill="#5263a5" />
  <text x="394" y="136" font-size="14" font-weight="bold" fill="#1f2329">子任务 Agent A</text>
  <text x="370" y="156" font-size="12" fill="#8f959e">独立进程隔离执行</text>

  <rect x="370" y="172" width="68" height="24" rx="4" fill="#ffffff" stroke="#dee0e3" stroke-width="1" />
  <text x="404" y="188" font-size="11" fill="#1f2329" text-anchor="middle">超时监控</text>
  <rect x="446" y="172" width="68" height="24" rx="4" fill="#ffffff" stroke="#dee0e3" stroke-width="1" />
  <text x="480" y="188" font-size="11" fill="#1f2329" text-anchor="middle">结果校验</text>

  <!-- 中间：并行子任务节点 2 -->
  <rect x="350" y="245" width="260" height="110" rx="6" fill="#ffffff" stroke="#dee0e3" stroke-width="1.5" />
  <circle cx="380" cy="266" r="5" fill="#5263a5" />
  <text x="394" y="271" font-size="14" font-weight="bold" fill="#1f2329">子任务 Agent B</text>
  <text x="370" y="291" font-size="12" fill="#8f959e">独立进程隔离执行</text>

  <rect x="370" y="307" width="68" height="24" rx="4" fill="#ffffff" stroke="#dee0e3" stroke-width="1" />
  <text x="404" y="323" font-size="11" fill="#1f2329" text-anchor="middle">超时监控</text>
  <rect x="446" y="307" width="68" height="24" rx="4" fill="#ffffff" stroke="#dee0e3" stroke-width="1" />
  <text x="480" y="323" font-size="11" fill="#1f2329" text-anchor="middle">结果校验</text>

  <!-- 中间：并行子任务节点 3 -->
  <rect x="350" y="380" width="260" height="110" rx="6" fill="#ffffff" stroke="#dee0e3" stroke-width="1.5" />
  <circle cx="380" cy="401" r="5" fill="#5263a5" />
  <text x="394" y="406" font-size="14" font-weight="bold" fill="#1f2329">子任务 Agent C</text>
  <text x="370" y="426" font-size="12" fill="#8f959e">独立进程隔离执行</text>

  <rect x="370" y="442" width="68" height="24" rx="4" fill="#ffffff" stroke="#dee0e3" stroke-width="1" />
  <text x="404" y="458" font-size="11" fill="#1f2329" text-anchor="middle">超时监控</text>
  <rect x="446" y="442" width="68" height="24" rx="4" fill="#ffffff" stroke="#dee0e3" stroke-width="1" />
  <text x="480" y="458" font-size="11" fill="#1f2329" text-anchor="middle">结果校验</text>

  <!-- 右侧：聚合器节点 -->
  <rect x="740" y="210" width="180" height="180" rx="12" fill="#eae2fe" />
  <text x="830" y="240" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">结果聚合器</text>
  <text x="830" y="260" font-size="12" fill="#8569cb" text-anchor="middle">Fan-in 汇合引擎</text>
  <line x1="760" x2="900" y1="270" y2="270" stroke="#ffffff" stroke-width="2" />

  <circle cx="770" cy="296" r="3" fill="#8569cb" />
  <text x="782" y="300" font-size="13" fill="#1f2329">1. 冲突去重 (Dedup)</text>

  <circle cx="770" cy="326" r="3" fill="#8569cb" />
  <text x="782" y="330" font-size="13" fill="#1f2329">2. 按权重排序 (Sort)</text>

  <circle cx="770" cy="356" r="3" fill="#8569cb" />
  <text x="782" y="360" font-size="13" fill="#1f2329">3. 结果合并 (Merge)</text>

  <!-- 最右侧：最终输出节点 -->
  <rect x="1000" y="260" width="140" height="80" rx="8" fill="#f0f4fc" />
  <text x="1070" y="296" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">合并输出</text>
  <text x="1070" y="318" font-size="12" fill="#8f959e" text-anchor="middle">下游链路处理结果</text>

</svg>
