<svg width="1180" height="640" viewBox="0 0 1180 640" xmlns="http://www.w3.org/2000/svg">
  <rect width="1180" height="640" fill="#ffffff" />

  <text x="40" y="60" font-size="24" font-weight="bold" fill="#1f2329">架构选型权衡与决策 (Architecture Trade-off)</text>
  <text x="40" y="86" font-size="14" fill="#646a73">基于业务约束的横向对比评估，明确“获得什么”与“放弃什么”</text>
  <line x1="40" y1="104" x2="1140" y2="104" stroke="#dee0e3" stroke-width="1.5" />

  <text x="40" y="147" font-size="16" font-weight="bold" fill="#1f2329">核心约束</text>

  <rect x="40" y="180" width="180" height="84" rx="6" fill="#d6dcf3" stroke="#5263a5" stroke-width="1" />
  <rect x="52" y="200" width="10" height="10" rx="2" fill="#5263a5" />
  <text x="70" y="210" font-size="14" font-weight="bold" fill="#1f2329">业务规模</text>
  <text x="52" y="234" font-size="12" fill="#646a73">日均千万级核心请求</text>
  <text x="52" y="252" font-size="12" fill="#646a73">峰值 QPS 10w+ 预期</text>

  <rect x="40" y="280" width="180" height="84" rx="6" fill="#d6dcf3" stroke="#5263a5" stroke-width="1" />
  <rect x="52" y="300" width="10" height="10" rx="2" fill="#5263a5" />
  <text x="70" y="310" font-size="14" font-weight="bold" fill="#1f2329">响应延迟</text>
  <text x="52" y="334" font-size="12" fill="#646a73">交易类核心链路</text>
  <text x="52" y="352" font-size="12" fill="#646a73">严格要求 P99 &lt; 50ms</text>

  <rect x="40" y="380" width="180" height="84" rx="6" fill="#d6dcf3" stroke="#5263a5" stroke-width="1" />
  <rect x="52" y="400" width="10" height="10" rx="2" fill="#5263a5" />
  <text x="70" y="410" font-size="14" font-weight="bold" fill="#1f2329">团队储备</text>
  <text x="52" y="434" font-size="12" fill="#646a73">以 Java/Spring 为主</text>
  <text x="52" y="452" font-size="12" fill="#646a73">极度缺乏云原生运维经验</text>

  <rect x="40" y="480" width="180" height="84" rx="6" fill="#d6dcf3" stroke="#5263a5" stroke-width="1" />
  <rect x="52" y="500" width="10" height="10" rx="2" fill="#5263a5" />
  <text x="70" y="510" font-size="14" font-weight="bold" fill="#1f2329">资源成本</text>
  <text x="52" y="534" font-size="12" fill="#646a73">单机房物理机主导</text>
  <text x="52" y="552" font-size="12" fill="#646a73">本财年预算严格受限</text>

  <line x1="232" y1="120" x2="232" y2="564" stroke="#dee0e3" stroke-width="1" />

  <rect x="244" y="120" width="200" height="44" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1" />
  <text x="344" y="147" font-size="14" font-weight="bold" fill="#5178c6" text-anchor="middle">方案 A: 单体平滑演进</text>

  <rect x="460" y="120" width="200" height="44" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1" />
  <rect x="590" y="112" width="36" height="20" rx="4" fill="#509863" />
  <text x="608" y="126" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">推荐</text>
  <text x="560" y="147" font-size="14" font-weight="bold" fill="#5178c6" text-anchor="middle">方案 B: 微服务拆分</text>

  <rect x="676" y="120" width="200" height="44" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1" />
  <text x="776" y="147" font-size="14" font-weight="bold" fill="#5178c6" text-anchor="middle">方案 C: Serverless</text>

  <line x1="452" y1="120" x2="452" y2="564" stroke="#dee0e3" stroke-dasharray="4 4" />
  <line x1="668" y1="120" x2="668" y2="564" stroke="#dee0e3" stroke-dasharray="4 4" />

  <rect x="244" y="180" width="200" height="84" rx="6" fill="#ffffff" stroke="#dee0e3" />
  <rect x="256" y="192" width="60" height="22" rx="4" fill="#dff5e5" />
  <text x="286" y="208" font-size="12" font-weight="bold" fill="#509863" text-anchor="middle">获得收益</text>
  <text x="256" y="234" font-size="13" fill="#1f2329">• 团队研发惯性极小</text>
  <text x="256" y="254" font-size="13" fill="#1f2329">• 当前环境运维最简单</text>

  <rect x="460" y="180" width="200" height="84" rx="6" fill="#ffffff" stroke="#dee0e3" />
  <rect x="472" y="192" width="60" height="22" rx="4" fill="#dff5e5" />
  <text x="502" y="208" font-size="12" font-weight="bold" fill="#509863" text-anchor="middle">获得收益</text>
  <text x="472" y="234" font-size="13" fill="#1f2329">• 获得极致的横向扩展性</text>
  <text x="472" y="254" font-size="13" fill="#1f2329">• 业务域故障物理隔离</text>

  <rect x="676" y="180" width="200" height="84" rx="6" fill="#ffffff" stroke="#dee0e3" />
  <rect x="688" y="192" width="60" height="22" rx="4" fill="#dff5e5" />
  <text x="718" y="208" font-size="12" font-weight="bold" fill="#509863" text-anchor="middle">获得收益</text>
  <text x="688" y="234" font-size="13" fill="#1f2329">• 流量按需极致自动扩缩</text>
  <text x="688" y="254" font-size="13" fill="#1f2329">• 彻底免除底层节点运维</text>

  <rect x="244" y="280" width="200" height="84" rx="6" fill="#ffffff" stroke="#dee0e3" />
  <rect x="256" y="292" width="60" height="22" rx="4" fill="#fef1ce" />
  <text x="286" y="308" font-size="12" font-weight="bold" fill="#d48e5b" text-anchor="middle">放弃代价</text>
  <text x="256" y="334" font-size="13" fill="#1f2329">• 代码全局耦合依然存在</text>
  <text x="256" y="354" font-size="13" fill="#1f2329">• 单节点性能将触及天花板</text>

  <rect x="460" y="280" width="200" height="84" rx="6" fill="#ffffff" stroke="#dee0e3" />
  <rect x="472" y="292" width="60" height="22" rx="4" fill="#fef1ce" />
  <text x="502" y="308" font-size="12" font-weight="bold" fill="#d48e5b" text-anchor="middle">放弃代价</text>
  <text x="472" y="334" font-size="13" fill="#1f2329">• 前期基建与重构成本高</text>
  <text x="472" y="354" font-size="13" fill="#1f2329">• 跨链路排障复杂度陡增</text>

  <rect x="676" y="280" width="200" height="84" rx="6" fill="#ffffff" stroke="#dee0e3" />
  <rect x="688" y="292" width="60" height="22" rx="4" fill="#fef1ce" />
  <text x="718" y="308" font-size="12" font-weight="bold" fill="#d48e5b" text-anchor="middle">放弃代价</text>
  <text x="688" y="334" font-size="13" fill="#1f2329">• 丧失基础设施绝对控制权</text>
  <text x="688" y="354" font-size="13" fill="#1f2329">• 部署层逻辑需全部重写</text>

  <rect x="244" y="380" width="200" height="84" rx="6" fill="#ffffff" stroke="#dee0e3" />
  <rect x="256" y="392" width="60" height="22" rx="4" fill="#fee3e2" />
  <text x="286" y="408" font-size="12" font-weight="bold" fill="#d25d5a" text-anchor="middle">主要风险</text>
  <text x="256" y="434" font-size="13" fill="#1f2329">• 流量突增引发全局雪崩</text>
  <text x="256" y="454" font-size="13" fill="#1f2329">• 发版过慢拖延核心业务</text>

  <rect x="460" y="380" width="200" height="84" rx="6" fill="#ffffff" stroke="#dee0e3" />
  <rect x="472" y="392" width="60" height="22" rx="4" fill="#fee3e2" />
  <text x="502" y="408" font-size="12" font-weight="bold" fill="#d25d5a" text-anchor="middle">主要风险</text>
  <text x="472" y="434" font-size="13" fill="#1f2329">• 分布式事务致数据不一致</text>
  <text x="472" y="454" font-size="13" fill="#1f2329">• 运维不熟导致系统拥堵</text>

  <rect x="676" y="380" width="200" height="84" rx="6" fill="#ffffff" stroke="#dee0e3" />
  <rect x="688" y="392" width="60" height="22" rx="4" fill="#fee3e2" />
  <text x="718" y="408" font-size="12" font-weight="bold" fill="#d25d5a" text-anchor="middle">主要风险</text>
  <text x="688" y="434" font-size="13" fill="#1f2329">• 冷启动致 P99 延迟劣化</text>
  <text x="688" y="454" font-size="13" fill="#1f2329">• 被公有云厂商深度绑定</text>

  <rect x="244" y="480" width="200" height="84" rx="6" fill="#ffffff" stroke="#dee0e3" />
  <rect x="256" y="492" width="60" height="22" rx="4" fill="#f5f5f5" />
  <text x="286" y="508" font-size="12" font-weight="bold" fill="#646a73" text-anchor="middle">退出成本</text>
  <text x="256" y="534" font-size="13" fill="#1f2329">• 极低，可随时终止演进</text>
  <text x="256" y="554" font-size="13" fill="#1f2329">• 无历史包袱与沉没成本</text>

  <rect x="460" y="480" width="200" height="84" rx="6" fill="#ffffff" stroke="#dee0e3" />
  <rect x="472" y="492" width="60" height="22" rx="4" fill="#f5f5f5" />
  <text x="502" y="508" font-size="12" font-weight="bold" fill="#646a73" text-anchor="middle">退出成本</text>
  <text x="472" y="534" font-size="13" fill="#1f2329">• 极高，退回单体几无可能</text>
  <text x="472" y="554" font-size="13" fill="#1f2329">• 业务代码已被 RPC 污染</text>

  <rect x="676" y="480" width="200" height="84" rx="6" fill="#ffffff" stroke="#dee0e3" />
  <rect x="688" y="492" width="60" height="22" rx="4" fill="#f5f5f5" />
  <text x="718" y="508" font-size="12" font-weight="bold" fill="#646a73" text-anchor="middle">退出成本</text>
  <text x="688" y="534" font-size="13" fill="#1f2329">• 较高，需剥离云服务依赖</text>
  <text x="688" y="554" font-size="13" fill="#1f2329">• 需重建本地容器调度体系</text>

  <line x1="892" y1="120" x2="892" y2="564" stroke="#dee0e3" stroke-width="1" />

  <text x="908" y="147" font-size="16" font-weight="bold" fill="#1f2329">决策结论与动作</text>

  <rect x="908" y="180" width="232" height="140" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <circle cx="926" cy="204" r="4" fill="#509863" />
  <text x="936" y="209" font-size="14" font-weight="bold" fill="#509863">最终推荐方案</text>
  <text x="924" y="238" font-size="16" font-weight="bold" fill="#1f2329">方案 B (微服务拆分)</text>
  <text x="924" y="264" font-size="13" fill="#1f2329">在满足核心 P99 延迟前提下</text>
  <text x="924" y="284" font-size="13" fill="#1f2329">“长痛不如短痛”，彻底解决</text>
  <text x="924" y="304" font-size="13" fill="#1f2329">因规模上升带来的扩展瓶颈。</text>

  <rect x="908" y="336" width="232" height="112" rx="6" fill="#fef1ce" stroke="#d4b45b" stroke-width="1" />
  <circle cx="926" cy="359" r="4" fill="#d4b45b" />
  <text x="936" y="364" font-size="14" font-weight="bold" fill="#d48e5b">方案成立条件</text>
  <text x="924" y="392" font-size="13" fill="#1f2329">1. 核心链路基建必须先行到位</text>
  <text x="924" y="414" font-size="13" fill="#1f2329">2. 团队急需引入云原生架构师</text>
  <text x="924" y="436" font-size="13" fill="#1f2329">   补充服务化治理与排障经验</text>

  <rect x="908" y="464" width="232" height="100" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="1" />
  <circle cx="926" cy="487" r="4" fill="#d25d5a" />
  <text x="936" y="492" font-size="14" font-weight="bold" fill="#d25d5a">触发重新评审条件</text>
  <text x="924" y="520" font-size="13" fill="#1f2329">• 月度云资源成本超预算 30%</text>
  <text x="924" y="542" font-size="13" fill="#1f2329">• 核心业务延迟超限致生产事故</text>

  </svg>
