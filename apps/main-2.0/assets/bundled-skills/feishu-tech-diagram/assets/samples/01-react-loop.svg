<svg width="1100" height="280" viewBox="0 0 1100 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="8" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 4 L 0 8 Z" fill="#bbbfc4" />
    </marker>
  </defs>

  <!-- Agent Loop Box Container -->
  <rect x="170" y="60" width="760" height="170" rx="8" fill="#f5f5f5" stroke="#bbbfc4" stroke-dasharray="6,4" stroke-width="1.5" />
  <rect x="178" y="75" width="4" height="14" rx="2" fill="#5178c6" />
  <text x="190" y="87" font-size="14" font-weight="bold" fill="#1f2329">ReAct Agent 核心循环</text>

  <!-- Flow Lines (Main Chain) -->
  <polyline points="140,120 200,120" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="300,120 340,120" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="440,120 480,120" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="580,120 620,120" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="720,120 760,120" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="900,120 960,120" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Flow Line (Feedback Loop) -->
  <polyline points="830,155 830,200 250,200 250,144" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Line Labels -->
  <text x="930" y="112" font-size="12" fill="#8f959e" text-anchor="middle">是</text>
  <text x="846" y="186" font-size="12" fill="#8f959e" text-anchor="middle">否</text>

  <!-- Nodes -->
  <!-- N1: Start (User Goal) -->
  <rect x="40" y="96" width="100" height="48" rx="24" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="90" y="114" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">用户目标</text>
  <text x="90" y="130" font-size="11" fill="#8f959e" text-anchor="middle">User Goal</text>

  <!-- N2: Thought -->
  <rect x="200" y="96" width="100" height="48" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="250" y="114" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">思考</text>
  <text x="250" y="130" font-size="11" fill="#8f959e" text-anchor="middle">Thought</text>

  <!-- N3: Action Selection -->
  <rect x="340" y="96" width="100" height="48" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="390" y="114" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">选择工具</text>
  <text x="390" y="130" font-size="11" fill="#8f959e" text-anchor="middle">Select Tool</text>

  <!-- N4: Action Execution -->
  <rect x="480" y="96" width="100" height="48" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="530" y="114" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">执行工具</text>
  <text x="530" y="130" font-size="11" fill="#8f959e" text-anchor="middle">Execute</text>

  <!-- N5: Observation -->
  <rect x="620" y="96" width="100" height="48" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="670" y="114" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">观察结果</text>
  <text x="670" y="130" font-size="11" fill="#8f959e" text-anchor="middle">Observation</text>

  <!-- N6: Decision (Is Complete?) -->
  <polygon points="830,85 900,120 830,155 760,120" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="830" y="116" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">是否完成</text>
  <text x="830" y="132" font-size="11" fill="#8f959e" text-anchor="middle">Is Complete?</text>

  <!-- N7: End (Final Output) -->
  <rect x="960" y="96" width="100" height="48" rx="24" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="1010" y="114" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">最终输出</text>
  <text x="1010" y="130" font-size="11" fill="#8f959e" text-anchor="middle">Final Output</text>
</svg>
