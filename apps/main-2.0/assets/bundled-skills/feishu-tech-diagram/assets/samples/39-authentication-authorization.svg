<svg width="1280" height="840" viewBox="0 0 1280 840" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 Z" fill="#646a73" />
    </marker>
  </defs>

  <!-- 全局标题 -->
  <text x="640" y="35" font-size="22" font-weight="bold" fill="#1f2329" text-anchor="middle">认证授权时序与信任边界图</text>

  <!-- ================= 信任边界区 ================= -->
  <!-- 外部信任区 -->
  <rect x="40" y="60" width="370" height="740" rx="12" fill="#f0f4fc" stroke="#5178c6" stroke-width="2" />
  <text x="225" y="90" font-size="16" font-weight="bold" fill="#5178c6" text-anchor="middle">外部信任区</text>

  <!-- 身份管控区 -->
  <rect x="430" y="60" width="180" height="740" rx="12" fill="#fef1ce" stroke="#d4b45b" stroke-width="2" />
  <text x="520" y="90" font-size="16" font-weight="bold" fill="#d4b45b" text-anchor="middle">身份管控区</text>

  <!-- 内部受信任区 -->
  <rect x="630" y="60" width="610" height="740" rx="12" fill="#dff5e5" stroke="#509863" stroke-width="2" />
  <text x="935" y="90" font-size="16" font-weight="bold" fill="#509863" text-anchor="middle">内部受信任区</text>


  <!-- ================= 生命周期虚线 ================= -->
  <line x1="140" y1="160" x2="140" y2="780" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="6 6" />
  <line x1="310" y1="160" x2="310" y2="780" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="6 6" />
  <line x1="520" y1="160" x2="520" y2="780" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="6 6" />
  <line x1="730" y1="160" x2="730" y2="780" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="6 6" />
  <line x1="935" y1="160" x2="935" y2="780" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="6 6" />
  <line x1="1140" y1="160" x2="1140" y2="780" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="6 6" />


  <!-- ================= 生命周期头部节点 ================= -->
  <!-- 用户 (紫色系) -->
  <rect x="70" y="110" width="140" height="44" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="140" y="137" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">用户 (User)</text>

  <!-- 客户端 (紫色系) -->
  <rect x="240" y="110" width="140" height="44" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="310" y="137" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">客户端 (Client)</text>

  <!-- 身份提供方 (红色系) -->
  <rect x="450" y="110" width="140" height="44" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
  <text x="520" y="137" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">身份提供方 (IdP)</text>

  <!-- API 网关 (靛青色系) -->
  <rect x="660" y="110" width="140" height="44" rx="6" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
  <text x="730" y="137" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">API 网关</text>

  <!-- 策略引擎 (靛青色系) -->
  <rect x="865" y="110" width="140" height="44" rx="6" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
  <text x="935" y="137" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">策略引擎</text>

  <!-- 资源服务 (靛青色系) -->
  <rect x="1070" y="110" width="140" height="44" rx="6" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
  <text x="1140" y="137" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">资源服务</text>


  <!-- ================= 避免标签压住垂直线的遮罩层 ================= -->
  <!-- 步骤3：遮罩客户端生命线（背景同外部信任区） -->
  <rect x="250" y="302" width="120" height="16" fill="#f0f4fc" />

  <!-- 步骤5：遮罩身份提供方生命线（背景同身份管控区） -->
  <rect x="450" y="422" width="140" height="16" fill="#fef1ce" />

  <!-- 步骤8：遮罩策略引擎生命线（背景同内部受信任区） -->
  <rect x="860" y="602" width="150" height="16" fill="#dff5e5" />

  <!-- 步骤9：遮罩策略引擎生命线（背景同内部受信任区） -->
  <rect x="840" y="662" width="190" height="16" fill="#dff5e5" />

  <!-- 步骤10：遮罩身份提供方生命线（背景同身份管控区） -->
  <rect x="450" y="722" width="140" height="16" fill="#fef1ce" />


  <!-- ================= 时序图流程交互 ================= -->
  <!-- 步骤 1 -->
  <line x1="140" y1="200" x2="310" y2="200" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="225" y="194" font-size="13" fill="#646a73" text-anchor="middle">1. 发起访问</text>

  <!-- 步骤 2 -->
  <line x1="310" y1="260" x2="520" y2="260" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="415" y="254" font-size="13" fill="#646a73" text-anchor="middle">2. 登录跳转 (OIDC/OAuth2)</text>

  <!-- 步骤 3 -->
  <line x1="140" y1="320" x2="520" y2="320" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="330" y="314" font-size="13" fill="#646a73" text-anchor="middle">3. 用户身份认证交互 (Credentials)</text>

  <!-- 步骤 4 (回调虚线) -->
  <line x1="520" y1="380" x2="310" y2="380" stroke="#646a73" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <text x="415" y="374" font-size="13" fill="#646a73" text-anchor="middle">4. 回调 &amp; Token 签发 (Issue Token)</text>

  <!-- 步骤 5 -->
  <line x1="310" y1="440" x2="730" y2="440" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="520" y="434" font-size="13" fill="#646a73" text-anchor="middle">5. 携带 Token 请求业务 API</text>

  <!-- 步骤 6 -->
  <line x1="730" y1="500" x2="935" y2="500" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="832" y="494" font-size="13" fill="#646a73" text-anchor="middle">6. Token 校验 &amp; 权限决策</text>

  <!-- 步骤 7 (允许响应虚线) -->
  <line x1="935" y1="560" x2="730" y2="560" stroke="#646a73" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <text x="832" y="554" font-size="13" fill="#509863" text-anchor="middle" font-weight="bold">7. 决策结果 (Decision: Allow)</text>

  <!-- 步骤 8 -->
  <line x1="730" y1="620" x2="1140" y2="620" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="935" y="614" font-size="13" fill="#646a73" text-anchor="middle">8. 转发授权请求</text>

  <!-- 步骤 9 (资源响应虚线) -->
  <line x1="1140" y1="680" x2="730" y2="680" stroke="#646a73" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <text x="935" y="674" font-size="13" fill="#646a73" text-anchor="middle">9. 资源响应 (Resource Response)</text>

  <!-- 步骤 10 (业务数据返回虚线) -->
  <line x1="730" y1="740" x2="310" y2="740" stroke="#646a73" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrow)" />
  <text x="520" y="734" font-size="13" fill="#646a73" text-anchor="middle">10. 返回 API 数据</text>

</svg>
