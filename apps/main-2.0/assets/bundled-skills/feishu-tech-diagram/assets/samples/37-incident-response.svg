<svg width="1380" height="700" viewBox="0 0 1380 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 标准连线箭头 -->
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#bbbfc4" />
    </marker>
    <!-- 虚线连线箭头 -->
    <marker id="arrow-dashed" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#bbbfc4" />
    </marker>
  </defs>

  <!-- 全局背景 -->
  <rect width="1380" height="700" fill="#ffffff" />

  <!-- 顶部标题与图例区 -->
  <text x="20" y="45" font-size="22" font-weight="bold" fill="#1f2329">线上故障响应与处理泳道图</text>

  <!-- 图例 -->
  <g transform="translate(1040, 25)">
    <rect x="0" y="5" width="16" height="16" fill="#ffffff" stroke="#5178c6" rx="2" />
    <text x="24" y="18" font-size="13" fill="#646a73">常规流转</text>

    <polygon points="110,5 120,13 110,21 100,13" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
    <text x="128" y="18" font-size="13" fill="#646a73">条件分支</text>

    <rect x="205" y="5" width="16" height="16" fill="#fee3e2" stroke="#d25d5a" stroke-width="2" rx="2" />
    <text x="229" y="18" font-size="13" fill="#646a73">高优 / 核心动作</text>
  </g>

  <!-- 泳道背景与外框 -->
  <g id="swimlanes">
    <!-- 外框 -->
    <rect x="20" y="70" width="1340" height="580" fill="none" stroke="#dee0e3" stroke-width="2" rx="4" />

    <!-- 左侧标题栏背景 -->
    <rect x="20" y="70" width="100" height="580" fill="#f0f4fc" />
    <!-- 左侧标题栏竖向分割线 -->
    <line x1="120" y1="70" x2="120" y2="650" stroke="#dee0e3" stroke-width="2" />

    <!-- 监控平台 L1 (70 - 170) -->
    <rect x="120" y="70" width="1240" height="100" fill="#ffffff" />
    <text x="70" y="115" font-size="14" font-weight="bold" fill="#5263a5" text-anchor="middle">监控平台</text>
    <text x="70" y="135" font-size="12" fill="#646a73" text-anchor="middle">Monitor</text>
    <line x1="20" y1="170" x2="1360" y2="170" stroke="#dee0e3" stroke-width="1.5" />

    <!-- 值班工程师 L2 (170 - 320) -->
    <rect x="120" y="170" width="1240" height="150" fill="#f5f5f5" />
    <text x="70" y="240" font-size="14" font-weight="bold" fill="#5263a5" text-anchor="middle">值班工程师</text>
    <text x="70" y="260" font-size="12" fill="#646a73" text-anchor="middle">On-call</text>
    <line x1="20" y1="320" x2="1360" y2="320" stroke="#dee0e3" stroke-width="1.5" />

    <!-- 故障指挥 L3 (320 - 470) -->
    <rect x="120" y="320" width="1240" height="150" fill="#ffffff" />
    <text x="70" y="390" font-size="14" font-weight="bold" fill="#5263a5" text-anchor="middle">故障指挥</text>
    <text x="70" y="410" font-size="12" fill="#646a73" text-anchor="middle">Commander</text>
    <line x1="20" y1="470" x2="1360" y2="470" stroke="#dee0e3" stroke-width="1.5" />

    <!-- 业务团队 L4 (470 - 650) -->
    <rect x="120" y="470" width="1240" height="180" fill="#f5f5f5" />
    <text x="70" y="555" font-size="14" font-weight="bold" fill="#5263a5" text-anchor="middle">业务团队</text>
    <text x="70" y="575" font-size="12" fill="#646a73" text-anchor="middle">Business</text>
  </g>

  <!-- 全局流程连线区 (放置在节点底层以防止线穿透节点文字) -->
  <g id="flow-lines">
    <!-- N1 -> N2 -->
    <line x1="180" y1="144" x2="180" y2="221" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
    <!-- N2 -> N3 -->
    <line x1="240" y1="245" x2="280" y2="245" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

    <!-- N3 -> N4 (低级别故障) -->
    <polyline points="340,209 340,200 440,200" stroke="#bbbfc4" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
    <rect x="355" y="177" width="70" height="20" fill="#f5f5f5" />
    <text x="390" y="191" font-size="12" fill="#d48e5b" text-anchor="middle">L3/L4 故障</text>

    <!-- N4 -> N10 (低级别独立验证) -->
    <polyline points="560,200 1120,200 1120,221" stroke="#bbbfc4" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

    <!-- N3 -> N5 (高级别升级) -->
    <polyline points="340,281 340,395 440,395" stroke="#bbbfc4" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
    <rect x="350" y="372" width="80" height="20" fill="#ffffff" />
    <text x="390" y="386" font-size="12" font-weight="bold" fill="#d25d5a" text-anchor="middle">L1/L2 升级</text>

    <!-- N5 -> N6 (建立指挥室 -> 并行调度通报) -->
    <polyline points="560,395 600,395" stroke="#bbbfc4" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

    <!-- N5 -> N7 (建立指挥室 -> 并发技术动作/止损) -->
    <polyline points="500,419 500,560 590,560" stroke="#bbbfc4" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
    <rect x="510" y="537" width="56" height="20" fill="#f5f5f5" />
    <text x="538" y="551" font-size="12" fill="#646a73" text-anchor="middle">分发动作</text>

    <!-- N6 -> N11 (全局通报 -> 持续跟进至复盘) (虚线表示信息流) -->
    <polyline points="720,395 1200,395" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="5,5" fill="none" marker-end="url(#arrow-dashed)" />
    <rect x="915" y="385" width="90" height="20" fill="#ffffff" />
    <text x="960" y="399" font-size="12" fill="#8f959e" text-anchor="middle">全阶段信息同步</text>

    <!-- N7 -> N8 (止损 -> 定位) -->
    <polyline points="730,560 760,560" stroke="#bbbfc4" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

    <!-- N8 -> N9 (定位 -> 修复) -->
    <polyline points="880,560 920,560" stroke="#bbbfc4" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

    <!-- N9 -> N10 (修复 -> 验证) -->
    <polyline points="1040,560 1120,560 1120,269" stroke="#bbbfc4" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

    <!-- N10 -> N11 (验证 -> 复盘) -->
    <polyline points="1180,245 1260,245 1260,371" stroke="#bbbfc4" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  </g>

  <!-- 节点层 -->
  <g id="nodes">
    <!-- N1: 监控系统 -->
    <g transform="translate(120, 96)">
      <rect width="120" height="48" fill="#ffffff" stroke="#5178c6" rx="4" />
      <text x="60" y="29" font-size="14" fill="#1f2329" text-anchor="middle">告警规则触发</text>
    </g>

    <!-- N2: 响应认领 -->
    <g transform="translate(120, 221)">
      <rect width="120" height="48" fill="#ffffff" stroke="#5178c6" rx="4" />
      <text x="60" y="29" font-size="14" fill="#1f2329" text-anchor="middle">认领并响应告警</text>
    </g>

    <!-- N3: 故障定级评估 (菱形条件节点) -->
    <g transform="translate(280, 209)">
      <polygon points="60,0 120,36 60,72 0,36" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
      <text x="60" y="32" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">故障定级</text>
      <text x="60" y="50" font-size="12" fill="#646a73" text-anchor="middle">评估</text>
    </g>

    <!-- N4: 常规排查处理 -->
    <g transform="translate(440, 176)">
      <rect width="120" height="48" fill="#ffffff" stroke="#5178c6" rx="4" />
      <text x="60" y="20" font-size="14" fill="#1f2329" text-anchor="middle">常规排查处理</text>
      <text x="60" y="38" font-size="12" fill="#646a73" text-anchor="middle">(独立闭环)</text>
    </g>

    <!-- N5: 拉起紧急作战室 -->
    <g transform="translate(440, 371)">
      <rect width="120" height="48" fill="#ffffff" stroke="#5178c6" rx="4" />
      <text x="60" y="20" font-size="14" fill="#1f2329" text-anchor="middle">拉起紧急作战室</text>
      <text x="60" y="38" font-size="12" fill="#646a73" text-anchor="middle">(指挥调度)</text>
    </g>

    <!-- N6: 全局调度与通报 -->
    <g transform="translate(600, 371)">
      <rect width="120" height="48" fill="#ffffff" stroke="#5178c6" rx="4" />
      <text x="60" y="20" font-size="14" fill="#1f2329" text-anchor="middle">全局调度与通报</text>
      <text x="60" y="38" font-size="12" fill="#646a73" text-anchor="middle">(信息同步)</text>
    </g>

    <!-- N7: 优先紧急止损 (最高优核心动作 - 强调色) -->
    <g transform="translate(590, 532)">
      <rect width="140" height="56" fill="#fee3e2" stroke="#d25d5a" stroke-width="2" rx="4" />
      <!-- 强调图标 -->
      <circle cx="20" cy="28" r="7" fill="#d25d5a" />
      <text x="20" y="32" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
      <!-- 文字 -->
      <text x="80" y="24" font-size="14" font-weight="bold" fill="#d25d5a" text-anchor="middle">优先紧急止损</text>
      <text x="80" y="42" font-size="12" fill="#1f2329" text-anchor="middle">(熔断/降级/回滚)</text>
    </g>

    <!-- N8: 根因排查与定位 -->
    <g transform="translate(760, 536)">
      <rect width="120" height="48" fill="#ffffff" stroke="#5178c6" rx="4" />
      <text x="60" y="29" font-size="14" fill="#1f2329" text-anchor="middle">根因排查与定位</text>
    </g>

    <!-- N9: 实施修复方案 -->
    <g transform="translate(920, 536)">
      <rect width="120" height="48" fill="#ffffff" stroke="#5178c6" rx="4" />
      <text x="60" y="29" font-size="14" fill="#1f2329" text-anchor="middle">实施修复方案</text>
    </g>

    <!-- N10: 业务指标验证 -->
    <g transform="translate(1060, 221)">
      <rect width="120" height="48" fill="#ffffff" stroke="#5178c6" rx="4" />
      <text x="60" y="20" font-size="14" fill="#1f2329" text-anchor="middle">业务指标验证</text>
      <text x="60" y="38" font-size="12" fill="#646a73" text-anchor="middle">(确认恢复)</text>
    </g>

    <!-- N11: 故障复盘总结 -->
    <g transform="translate(1200, 371)">
      <rect width="120" height="48" fill="#ffffff" stroke="#5178c6" rx="4" />
      <text x="60" y="20" font-size="14" fill="#1f2329" text-anchor="middle">故障复盘总结</text>
      <text x="60" y="38" font-size="12" fill="#646a73" text-anchor="middle">(改进项追踪)</text>
    </g>
  </g>

</svg>
