<svg width="800" height="480" viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 全局标准主线箭头 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#646a73" />
    </marker>
    <!-- 红色警示/逆向反馈箭头 -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d25d5a" />
    </marker>
  </defs>
  <text x="400" y="245" font-size="24" font-weight="bold" fill="#dee0e3" text-anchor="middle" letter-spacing="4">TDD</text>
  <text x="400" y="265" font-size="12" font-weight="bold" fill="#dee0e3" text-anchor="middle" letter-spacing="2">CYCLE</text>

  <!-- ================= 连线层 ================= -->

  <!-- 外部入口线：写一个失败测试 -> Red -->
  <line x1="400" y1="60" x2="400" y2="105" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 主循环 1：Red -> Green (编写最小实现) -->
  <path d="M 484 160 L 560 160 Q 580 160 580 180 L 580 325" stroke="#646a73" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="592" y="250" font-size="14" font-weight="bold" fill="#646a73" text-anchor="start">编写最小实现</text>

  <!-- 主循环 2：Green -> Refactor (保持测试通过) -->
  <line x1="496" y1="370" x2="315" y2="370" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="400" y="360" font-size="14" font-weight="bold" fill="#646a73" text-anchor="middle">保持测试通过</text>

  <!-- 主循环 3：Refactor -> Red (添加下一个测试) -->
  <path d="M 220 336 L 220 180 Q 220 160 240 160 L 305 160" stroke="#646a73" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <text x="208" y="250" font-size="14" font-weight="bold" fill="#646a73" text-anchor="end">添加下一个测试</text>

  <!-- 逆向反馈线：Refactor -> Green (任何测试失败) -->
  <line x1="304" y1="400" x2="485" y2="400" stroke="#d25d5a" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-red)" />
  <text x="400" y="420" font-size="13" font-weight="bold" fill="#d25d5a" text-anchor="middle">任何测试失败</text>


  <!-- ================= 节点容器层 ================= -->

  <!-- 入口标记节点 -->
  <rect x="310" y="20" width="180" height="36" rx="18" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1"/>
  <text x="400" y="43" font-size="14" font-weight="bold" fill="#646a73" text-anchor="middle">写一个失败测试</text>

  <!-- 节点 1：Red (失败的测试) -->
  <g transform="translate(320, 120)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5"/>
    <text x="80" y="36" font-size="18" font-weight="bold" fill="#d25d5a" text-anchor="middle">Red</text>
    <line x1="20" y1="46" x2="140" y2="46" stroke="#d25d5a" stroke-width="0.5"/>
    <text x="80" y="66" font-size="14" font-weight="bold" fill="#d25d5a" text-anchor="middle">失败的测试</text>
  </g>

  <!-- 节点 2：Green (测试通过) -->
  <g transform="translate(500, 340)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="#dff5e5" stroke="#509863" stroke-width="1.5"/>
    <text x="80" y="36" font-size="18" font-weight="bold" fill="#509863" text-anchor="middle">Green</text>
    <line x1="20" y1="46" x2="140" y2="46" stroke="#509863" stroke-width="0.5"/>
    <text x="80" y="66" font-size="14" font-weight="bold" fill="#509863" text-anchor="middle">测试通过</text>
  </g>

  <!-- 节点 3：Refactor (代码重构) -->
  <g transform="translate(140, 340)">
    <rect x="0" y="0" width="160" height="80" rx="8" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5"/>
    <text x="80" y="36" font-size="18" font-weight="bold" fill="#5178c6" text-anchor="middle">Refactor</text>
    <line x1="20" y1="46" x2="140" y2="46" stroke="#5178c6" stroke-width="0.5"/>
    <text x="80" y="66" font-size="14" font-weight="bold" fill="#5178c6" text-anchor="middle">代码重构</text>
  </g>

</svg>
