<svg width="1560" height="700" viewBox="0 0 1560 700" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 标准连线箭头 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#8f959e" />
    </marker>
    <!-- 驳回/风险连线箭头 -->
    <marker id="arrow_risk" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#d25d5a" />
    </marker>
  </defs>

  <!-- 全局标题 -->
  <text x="40" y="50" font-size="20" font-weight="bold" fill="#1f2329">需求到技术方案流程图</text>

  <!-- 阶段分组顶栏 -->
  <rect x="160" y="60" width="668" height="28" rx="4" fill="#f5f5f5" />
  <text x="494" y="79" font-size="14" font-weight="bold" fill="#646a73" text-anchor="middle">阶段一：需求与风险对齐</text>

  <rect x="864" y="60" width="668" height="28" rx="4" fill="#f5f5f5" />
  <text x="1198" y="79" font-size="14" font-weight="bold" fill="#646a73" text-anchor="middle">阶段二：技术方案设计与确认</text>

  <!-- 泳道分隔线 -->
  <line x1="40" y1="100" x2="1560" y2="100" stroke="#dee0e3" stroke-width="1.5" />
  <line x1="40" y1="270" x2="1560" y2="270" stroke="#dee0e3" stroke-width="1.5" />
  <line x1="40" y1="450" x2="1560" y2="450" stroke="#dee0e3" stroke-width="1.5" />
  <line x1="40" y1="620" x2="1560" y2="620" stroke="#dee0e3" stroke-width="1.5" />

  <!-- 泳道头部：产品 -->
  <rect x="40" y="100" width="80" height="170" fill="#f5f5f5" />
  <rect x="40" y="100" width="4" height="170" fill="#8569cb" />
  <text x="80" y="175" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">产</text>
  <text x="80" y="200" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">品</text>

  <!-- 泳道头部：研发 -->
  <rect x="40" y="270" width="80" height="180" fill="#f5f5f5" />
  <rect x="40" y="270" width="4" height="180" fill="#5178c6" />
  <text x="80" y="350" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">研</text>
  <text x="80" y="375" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">发</text>

  <!-- 泳道头部：测试 -->
  <rect x="40" y="450" width="80" height="170" fill="#f5f5f5" />
  <rect x="40" y="450" width="4" height="170" fill="#509863" />
  <text x="80" y="525" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">测</text>
  <text x="80" y="550" font-size="16" font-weight="bold" fill="#1f2329" text-anchor="middle">试</text>

  <!-- ================= 连线区 (保证置于节点下层) ================= -->

  <!-- 正向主链路 -->
  <line x1="300" y1="185" x2="330" y2="185" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow)" />

  <polyline points="476,185 494,185 494,360 506,360" fill="none" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="476,185 494,185 494,535 506,535" fill="none" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow)" />

  <polyline points="652,360 670,360 670,185 682,185" fill="none" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- 测试节点的连线融入上方主线，不重复绘制箭头避免重叠失真 -->
  <polyline points="652,535 670,535 670,360" fill="none" stroke="#8f959e" stroke-width="1.5" />

  <polyline points="828,185 846,185 846,360 858,360" fill="none" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow)" />

  <line x1="1004" y1="360" x2="1034" y2="360" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="1180" y1="360" x2="1210" y2="360" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow)" />
  <line x1="1356" y1="360" x2="1386" y2="360" stroke="#8f959e" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 逆向驳回/修改链路 -->
  <polyline points="758,153 758,124 406,124 406,147" fill="none" stroke="#d25d5a" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow_risk)" />
  <text x="582" y="118" font-size="12" fill="#d25d5a" text-anchor="middle">需求变更 / 不通过</text>

  <polyline points="1286,328 1286,298 1110,298 1110,322" fill="none" stroke="#d25d5a" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow_risk)" />
  <text x="1198" y="292" font-size="12" fill="#d25d5a" text-anchor="middle">评审需修改</text>

  <!-- ================= 节点区 ================= -->

  <!-- C1: 需求澄清 (产品) -->
  <rect x="160" y="153" width="140" height="64" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="230" y="181" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">需求澄清</text>
  <text x="230" y="201" font-size="12" fill="#646a73" text-anchor="middle">对齐业务痛点与目标</text>

  <!-- C2: 范围确认 (产品) -->
  <rect x="336" y="153" width="140" height="64" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="406" y="181" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">范围确认</text>
  <text x="406" y="201" font-size="12" fill="#646a73" text-anchor="middle">划定MVP核心边界</text>

  <!-- C3a: 风险识别 (研发) -->
  <rect x="512" y="328" width="140" height="64" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="582" y="356" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">风险识别 (技术)</text>
  <text x="582" y="376" font-size="12" fill="#646a73" text-anchor="middle">评估架构可行性</text>

  <!-- C3b: 风险识别 (测试) -->
  <rect x="512" y="503" width="140" height="64" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="582" y="531" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">风险识别 (质量)</text>
  <text x="582" y="551" font-size="12" fill="#646a73" text-anchor="middle">识别质量保障难点</text>

  <!-- C4: 需求评审 (产品) -->
  <rect x="688" y="153" width="140" height="64" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="758" y="181" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">需求评审</text>
  <text x="758" y="201" font-size="12" fill="#646a73" text-anchor="middle">产研测三方达共识</text>

  <!-- C5: 技术调研 (研发) -->
  <rect x="864" y="328" width="140" height="64" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="934" y="356" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">技术调研</text>
  <text x="934" y="376" font-size="12" fill="#646a73" text-anchor="middle">核心难点选型评估</text>

  <!-- C6: 方案编写 (研发) -->
  <rect x="1040" y="328" width="140" height="64" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="1110" y="356" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">方案编写</text>
  <text x="1110" y="376" font-size="12" fill="#646a73" text-anchor="middle">系统架构与接口设计</text>

  <!-- C7: 方案评审 (研发) -->
  <rect x="1216" y="328" width="140" height="64" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="1286" y="356" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">方案评审</text>
  <text x="1286" y="376" font-size="12" fill="#646a73" text-anchor="middle">技术架构内部Review</text>

  <!-- C8: 修改确认 (研发) -->
  <rect x="1392" y="328" width="140" height="64" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="1462" y="356" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">修改确认</text>
  <text x="1462" y="376" font-size="12" fill="#646a73" text-anchor="middle">方案定稿与排期计划</text>

</svg>
