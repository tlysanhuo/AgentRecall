<svg width="1200" height="560" viewBox="0 0 1200 560" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- 中灰色连线箭头 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#bbbfc4" />
    </marker>
    <!-- 紫色主连线箭头 -->
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#8569cb" />
    </marker>
  </defs>

  <!-- ================= 底层连接线 ================= -->
  <!-- 左侧各支路汇入干线 -->
  <polyline points="220,164 252,164" fill="none" stroke="#bbbfc4" stroke-width="1.5" />
  <polyline points="220,228 252,228" fill="none" stroke="#bbbfc4" stroke-width="1.5" />
  <polyline points="220,292 252,292" fill="none" stroke="#bbbfc4" stroke-width="1.5" />
  <polyline points="220,356 252,356" fill="none" stroke="#bbbfc4" stroke-width="1.5" />
  <polyline points="220,420 252,420" fill="none" stroke="#bbbfc4" stroke-width="1.5" />
  <polyline points="220,484 252,484" fill="none" stroke="#bbbfc4" stroke-width="1.5" />

  <!-- 左侧垂直总干线 -->
  <line x1="252" y1="164" x2="252" y2="484" stroke="#bbbfc4" stroke-width="1.5" />

  <!-- 垂直总干线交叉点圆点 -->
  <circle cx="252" cy="164" r="3" fill="#bbbfc4" />
  <circle cx="252" cy="228" r="3" fill="#bbbfc4" />
  <circle cx="252" cy="292" r="3" fill="#bbbfc4" />
  <circle cx="252" cy="356" r="3" fill="#bbbfc4" />
  <circle cx="252" cy="420" r="3" fill="#bbbfc4" />
  <circle cx="252" cy="484" r="3" fill="#bbbfc4" />

  <!-- 统一汇入管道总入口连线 -->
  <polyline points="252,324 300,324" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 管道内阶段连接线 -->
  <polyline points="428,324 452,324" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="580,324 604,324" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />
  <polyline points="732,324 756,324" fill="none" stroke="#bbbfc4" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- 最终产物输出连线 -->
  <polyline points="884,324 956,324" fill="none" stroke="#8569cb" stroke-width="2" marker-end="url(#arrow-purple)" />

  <!-- ================= 容器与区块背景 ================= -->
  <!-- 左侧：多源上下文采集大框 -->
  <rect x="44" y="100" width="192" height="424" rx="8" fill="none" stroke="#dee0e3" stroke-width="1.5" stroke-dasharray="4,4" />
  <rect x="66" y="88" width="148" height="24" rx="12" fill="#f5f5f5" stroke="#dee0e3" />
  <text x="140" y="105" font-size="12" fill="#646a73" font-weight="bold" text-anchor="middle">上下文来源 (分级路由)</text>

  <!-- 中间：组装与处理管道大框 -->
  <rect x="284" y="200" width="624" height="248" rx="8" fill="none" stroke="#dee0e3" stroke-width="1.5" stroke-dasharray="4,4" />
  <rect x="528" y="188" width="136" height="24" rx="12" fill="#f5f5f5" stroke="#dee0e3" />
  <text x="596" y="205" font-size="12" fill="#646a73" font-weight="bold" text-anchor="middle">组装与处理管道</text>

  <!-- 底部说明栏 -->
  <rect x="300" y="396" width="592" height="36" rx="4" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1" />
  <text x="596" y="418" font-size="12" fill="#646a73" text-anchor="middle">严格把控质量与冗余度，动态截断长尾信息以匹配目标模型上下文窗口限制</text>

  <!-- ================= 左侧上下文来源节点 ================= -->
  <!-- 1. 系统指令 (P0) -->
  <rect x="60" y="140" width="160" height="48" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.2" />
  <rect x="60" y="152" width="4" height="24" fill="#8569cb" />
  <text x="76" y="160" font-size="14" fill="#1f2329" font-weight="bold">系统指令</text>
  <text x="76" y="176" font-size="11" fill="#8f959e">System Prompt</text>
  <rect x="184" y="154" width="28" height="20" rx="4" fill="#8569cb" />
  <text x="198" y="168" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">P0</text>

  <!-- 2. 用户输入 (P0) -->
  <rect x="60" y="204" width="160" height="48" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.2" />
  <rect x="60" y="216" width="4" height="24" fill="#8569cb" />
  <text x="76" y="224" font-size="14" fill="#1f2329" font-weight="bold">用户输入</text>
  <text x="76" y="240" font-size="11" fill="#8f959e">User Query</text>
  <rect x="184" y="218" width="28" height="20" rx="4" fill="#8569cb" />
  <text x="198" y="232" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">P0</text>

  <!-- 3. 对话历史 (P1) -->
  <rect x="60" y="268" width="160" height="48" rx="6" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1" />
  <rect x="60" y="280" width="4" height="24" fill="#bbbfc4" />
  <text x="76" y="288" font-size="14" fill="#1f2329" font-weight="bold">对话历史</text>
  <text x="76" y="304" font-size="11" fill="#8f959e">Chat History</text>
  <rect x="184" y="282" width="28" height="20" rx="4" fill="#bbbfc4" />
  <text x="198" y="296" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">P1</text>

  <!-- 4. 长期记忆 (P2) -->
  <rect x="60" y="332" width="160" height="48" rx="6" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1" />
  <rect x="60" y="344" width="4" height="24" fill="#bbbfc4" />
  <text x="76" y="352" font-size="14" fill="#1f2329" font-weight="bold">长期记忆</text>
  <text x="76" y="368" font-size="11" fill="#8f959e">Long-term Memory</text>
  <rect x="184" y="346" width="28" height="20" rx="4" fill="#ffffff" stroke="#bbbfc4" />
  <text x="198" y="360" font-size="11" font-weight="bold" fill="#646a73" text-anchor="middle">P2</text>

  <!-- 5. 知识检索 (P1) -->
  <rect x="60" y="396" width="160" height="48" rx="6" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1" />
  <rect x="60" y="408" width="4" height="24" fill="#bbbfc4" />
  <text x="76" y="416" font-size="14" fill="#1f2329" font-weight="bold">知识检索</text>
  <text x="76" y="432" font-size="11" fill="#8f959e">Knowledge Base</text>
  <rect x="184" y="410" width="28" height="20" rx="4" fill="#bbbfc4" />
  <text x="198" y="424" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">P1</text>

  <!-- 6. 工具结果 (P1) -->
  <rect x="60" y="460" width="160" height="48" rx="6" fill="#f5f5f5" stroke="#dee0e3" stroke-width="1" />
  <rect x="60" y="472" width="4" height="24" fill="#bbbfc4" />
  <text x="76" y="480" font-size="14" fill="#1f2329" font-weight="bold">工具结果</text>
  <text x="76" y="496" font-size="11" fill="#8f959e">Tool Results</text>
  <rect x="184" y="474" width="28" height="20" rx="4" fill="#bbbfc4" />
  <text x="198" y="488" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">P1</text>

  <!-- ================= 中间处理流水线节点 ================= -->
  <!-- 过滤节点 -->
  <rect x="308" y="292" width="120" height="64" rx="6" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1.2" />
  <text x="368" y="320" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">无效过滤</text>
  <text x="368" y="338" font-size="11" fill="#5178c6" text-anchor="middle">Filter</text>

  <rect x="392" y="282" width="40" height="20" rx="10" fill="#fee3e2" stroke="#d25d5a" stroke-width="1" />
  <text x="412" y="296" font-size="10" fill="#d25d5a" text-anchor="middle" font-weight="bold">裁剪</text>

  <!-- 去重节点 -->
  <rect x="460" y="292" width="120" height="64" rx="6" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1.2" />
  <text x="520" y="320" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">语义去重</text>
  <text x="520" y="338" font-size="11" fill="#5178c6" text-anchor="middle">Deduplicate</text>

  <rect x="544" y="282" width="40" height="20" rx="10" fill="#fee3e2" stroke="#d25d5a" stroke-width="1" />
  <text x="564" y="296" font-size="10" fill="#d25d5a" text-anchor="middle" font-weight="bold">裁剪</text>

  <!-- 排序节点 -->
  <rect x="612" y="292" width="120" height="64" rx="6" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1.2" />
  <text x="672" y="320" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">相关性排序</text>
  <text x="672" y="338" font-size="11" fill="#5178c6" text-anchor="middle">Ranking</text>

  <!-- Token 控制节点 -->
  <rect x="764" y="292" width="120" height="64" rx="6" fill="#f0f4fc" stroke="#dee0e3" stroke-width="1.2" />
  <text x="824" y="320" font-size="14" fill="#1f2329" font-weight="bold" text-anchor="middle">Token 控制</text>
  <text x="824" y="338" font-size="11" fill="#5178c6" text-anchor="middle">Budgeting</text>

  <rect x="848" y="282" width="40" height="20" rx="10" fill="#fee3e2" stroke="#d25d5a" stroke-width="1" />
  <text x="868" y="296" font-size="10" fill="#d25d5a" text-anchor="middle" font-weight="bold">裁剪</text>

  <!-- 输出路径提示字 -->
  <text x="920" y="316" font-size="12" fill="#8569cb" font-weight="bold" text-anchor="middle">Final Prompt</text>

  <!-- ================= 右侧输出节点 ================= -->
  <!-- 模型输入 -->
  <rect x="964" y="268" width="160" height="112" rx="8" fill="#eae2fe" stroke="#8569cb" stroke-width="2" />
  <text x="1044" y="308" font-size="16" fill="#1f2329" font-weight="bold" text-anchor="middle">模型输入</text>
  <text x="1044" y="328" font-size="12" fill="#8f959e" text-anchor="middle">Model Input</text>

  <!-- 输入流特征装饰横线 -->
  <rect x="1006" y="342" width="76" height="6" rx="3" fill="#8569cb" />
  <rect x="1006" y="356" width="48" height="6" rx="3" fill="#8569cb" />

  <!-- ================= 全局文本层 ================= -->
  <!-- 标题区 -->
  <text x="40" y="48" font-size="20" font-weight="bold" fill="#1f2329">Agent 上下文多源组装与控制架构图</text>
  <text x="40" y="68" font-size="12" fill="#8f959e">Multi-source Context Assembly &amp; Token Budget Control</text>
</svg>
