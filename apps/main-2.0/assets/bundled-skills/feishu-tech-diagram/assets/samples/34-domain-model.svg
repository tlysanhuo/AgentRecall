<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" fill="#ffffff">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <polyline points="0,0 10,5 0,10" fill="none" stroke="#000000" stroke-width="1.5" stroke-linejoin="round" />
    </marker>
    <marker id="comp-end" viewBox="0 0 20 10" refX="20" refY="5" markerWidth="20" markerHeight="10" orient="auto">
      <polygon points="0,5 10,0 20,5 10,10" fill="#000000" stroke="#000000" stroke-width="1" stroke-linejoin="round" />
    </marker>
  </defs>

  <!-- Aggregate Boundary Box -->
  <rect x="340" y="230" width="520" height="415" fill="none" stroke="#646a73" stroke-width="2" stroke-dasharray="8,6" rx="8" />
  <text x="355" y="255" font-size="14" fill="#8f959e" font-weight="bold">Aggregate Boundary</text>

  <!-- Relationships / Lines -->

  <!-- TaskService -> Task (Dependency) -->
  <line x1="280" y1="350" x2="380" y2="350" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)" />

  <!-- TaskService -> TaskRepository (Dependency) -->
  <line x1="165" y1="390" x2="165" y2="480" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)" />

  <!-- TaskRepository -> Task (Dependency) -->
  <path d="M 280 535 L 310 535 L 310 415 L 380 415" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)" />

  <!-- Task -> TaskCompleted (Event Publication) -->
  <line x1="490" y1="280" x2="490" y2="185" fill="none" stroke="#000000" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow)" />
  <rect x="460" y="222" width="60" height="20" fill="#ffffff" />
  <text x="490" y="236" font-size="12" fill="#8f959e" text-anchor="middle">publishes</text>

  <!-- Task -> Status (Directed Association) -->
  <line x1="600" y1="350" x2="650" y2="350" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)" />

  <!-- Step -> Task (Composition, diamond at Task end) -->
  <line x1="490" y1="480" x2="490" y2="435" fill="none" stroke="#000000" stroke-width="1.5" marker-end="url(#comp-end)" />


  <!-- Nodes / Classes -->

  <!-- Task (Aggregate Root) -->
  <rect x="380" y="280" width="220" height="155" fill="#ffffff" stroke="#000000" stroke-width="2.5" rx="4" />
  <text x="490" y="305" font-size="12" fill="#8f959e" text-anchor="middle">&lt;&lt;Aggregate Root&gt;&gt;</text>
  <text x="490" y="325" font-size="16" fill="#1f2329" font-weight="bold" text-anchor="middle">Task</text>
  <line x1="380" y1="335" x2="600" y2="335" stroke="#000000" stroke-width="2.5" />
  <text x="395" y="355" font-size="13" fill="#1f2329">- id: String</text>
  <text x="395" y="375" font-size="13" fill="#1f2329">- steps: List&lt;Step&gt;</text>
  <text x="395" y="395" font-size="13" fill="#1f2329">- status: Status</text>
  <line x1="380" y1="405" x2="600" y2="405" stroke="#000000" stroke-width="2.5" />
  <text x="395" y="425" font-size="13" fill="#1f2329">+ complete()</text>

  <!-- Step (Entity) -->
  <rect x="380" y="480" width="220" height="135" fill="#ffffff" stroke="#000000" stroke-width="1.5" rx="4" />
  <text x="490" y="505" font-size="12" fill="#8f959e" text-anchor="middle">&lt;&lt;Entity&gt;&gt;</text>
  <text x="490" y="525" font-size="16" fill="#1f2329" font-weight="bold" text-anchor="middle">Step</text>
  <line x1="380" y1="535" x2="600" y2="535" stroke="#000000" stroke-width="1.5" />
  <text x="395" y="555" font-size="13" fill="#1f2329">- stepId: String</text>
  <text x="395" y="575" font-size="13" fill="#1f2329">- title: String</text>
  <line x1="380" y1="585" x2="600" y2="585" stroke="#000000" stroke-width="1.5" />
  <text x="395" y="605" font-size="13" fill="#1f2329">+ update()</text>

  <!-- Status (Value Object) -->
  <rect x="650" y="280" width="180" height="115" fill="#ffffff" stroke="#000000" stroke-width="1.5" rx="4" />
  <text x="740" y="305" font-size="12" fill="#8f959e" text-anchor="middle">&lt;&lt;Value Object&gt;&gt;</text>
  <text x="740" y="325" font-size="16" fill="#1f2329" font-weight="bold" text-anchor="middle">Status</text>
  <line x1="650" y1="335" x2="830" y2="335" stroke="#000000" stroke-width="1.5" />
  <text x="665" y="355" font-size="13" fill="#1f2329">- value: String</text>
  <line x1="650" y1="365" x2="830" y2="365" stroke="#000000" stroke-width="1.5" />
  <text x="665" y="385" font-size="13" fill="#1f2329">+ isCompleted()</text>

  <!-- TaskCompleted (Domain Event) -->
  <rect x="390" y="80" width="200" height="105" fill="#ffffff" stroke="#000000" stroke-width="1.5" rx="4" />
  <text x="490" y="105" font-size="12" fill="#8f959e" text-anchor="middle">&lt;&lt;Domain Event&gt;&gt;</text>
  <text x="490" y="125" font-size="16" fill="#1f2329" font-weight="bold" text-anchor="middle">TaskCompleted</text>
  <line x1="390" y1="135" x2="590" y2="135" stroke="#000000" stroke-width="1.5" />
  <text x="405" y="155" font-size="13" fill="#1f2329">- taskId: String</text>
  <text x="405" y="175" font-size="13" fill="#1f2329">- timestamp: Date</text>

  <!-- TaskService (Domain Service) -->
  <rect x="50" y="280" width="230" height="110" fill="#ffffff" stroke="#000000" stroke-width="1.5" rx="4" />
  <text x="165" y="305" font-size="12" fill="#8f959e" text-anchor="middle">&lt;&lt;Domain Service&gt;&gt;</text>
  <text x="165" y="325" font-size="16" fill="#1f2329" font-weight="bold" text-anchor="middle">TaskService</text>
  <line x1="50" y1="335" x2="280" y2="335" stroke="#000000" stroke-width="1.5" />
  <text x="65" y="355" font-size="13" fill="#1f2329">+ createTask()</text>
  <text x="65" y="375" font-size="13" fill="#1f2329">+ completeTask()</text>

  <!-- TaskRepository (Repository Interface) -->
  <rect x="50" y="480" width="230" height="110" fill="#ffffff" stroke="#000000" stroke-width="1.5" rx="4" />
  <text x="165" y="505" font-size="12" fill="#8f959e" text-anchor="middle">&lt;&lt;Repository&gt;&gt;</text>
  <text x="165" y="525" font-size="16" fill="#1f2329" font-weight="bold" text-anchor="middle">TaskRepository</text>
  <line x1="50" y1="535" x2="280" y2="535" stroke="#000000" stroke-width="1.5" />
  <text x="65" y="555" font-size="13" fill="#1f2329">+ findById(id): Task</text>
  <text x="65" y="575" font-size="13" fill="#1f2329">+ save(Task)</text>
</svg>
