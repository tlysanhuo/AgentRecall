<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="440" viewBox="0 0 1520 440">
  <defs>
    <!-- 通用箭头定义 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#8f959e" />
    </marker>
  </defs>

  <!-- 背景色 -->
  <rect width="1520" height="440" fill="#ffffff" />

  <!-- 背景分组框 -->
  <!-- 检索与处理链路分组 -->
  <rect x="120" y="50" width="900" height="340" rx="8" fill="none" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="8,4" />
  <text x="136" y="72" font-size="14" font-weight="bold" fill="#8f959e">检索与处理链路</text>

  <!-- 生成与校验链路分组 -->
  <rect x="1040" y="50" width="352" height="340" rx="8" fill="none" stroke="#bbbfc4" stroke-width="1.5" stroke-dasharray="8,4" />
  <text x="1056" y="72" font-size="14" font-weight="bold" fill="#8f959e">生成与校验链路</text>

  <!-- 主链路连线 -->
  <path d="M 82 120 L 132 120" stroke="#8f959e" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 268 120 L 316 120" stroke="#8f959e" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 452 120 L 500 120" stroke="#8f959e" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 636 120 L 684 120" stroke="#8f959e" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 820 120 L 868 120" stroke="#8f959e" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 1004 120 L 1052 120" stroke="#8f959e" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 1188 120 L 1236 120" stroke="#8f959e" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <path d="M 1372 120 L 1420 120" stroke="#8f959e" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- 数据源连线 (查询与反馈) -->
  <!-- N2 到 向量索引 -->
  <path d="M 360 152 L 360 272" stroke="#8f959e" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <!-- N2 到 知识库 -->
  <path d="M 416 152 L 416 216 L 572 216 L 572 272" stroke="#8f959e" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- 向量索引 到 N3 -->
  <path d="M 388 280 L 388 248 L 528 248 L 528 160" stroke="#8f959e" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
  <!-- 知识库 到 N3 -->
  <path d="M 600 280 L 600 160" stroke="#8f959e" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />

  <!-- 连线标签 (含底板降噪) -->
  <!-- 用户提问 -->
  <rect x="91" y="110" width="32" height="20" fill="#ffffff" rx="2" />
  <text x="107" y="124" font-size="12" fill="#8f959e" text-anchor="middle">提问</text>

  <!-- N1 -> N2 -->
  <rect x="280" y="110" width="32" height="20" fill="#ffffff" rx="2" />
  <text x="296" y="124" font-size="12" fill="#8f959e" text-anchor="middle">查询</text>

  <!-- N3 -> N4 -->
  <rect x="648" y="110" width="32" height="20" fill="#ffffff" rx="2" />
  <text x="664" y="124" font-size="12" fill="#8f959e" text-anchor="middle">文档</text>

  <!-- N4 -> N5 -->
  <rect x="832" y="110" width="32" height="20" fill="#ffffff" rx="2" />
  <text x="848" y="124" font-size="12" fill="#8f959e" text-anchor="middle">文档</text>

  <!-- N5 -> N6 -->
  <rect x="1010" y="110" width="44" height="20" fill="#ffffff" rx="2" />
  <text x="1032" y="124" font-size="12" fill="#8f959e" text-anchor="middle">提示词</text>

  <!-- N6 -> N7 -->
  <rect x="1200" y="110" width="32" height="20" fill="#ffffff" rx="2" />
  <text x="1216" y="124" font-size="12" fill="#8f959e" text-anchor="middle">引用</text>

  <!-- N7 -> Output -->
  <rect x="1384" y="110" width="32" height="20" fill="#ffffff" rx="2" />
  <text x="1400" y="124" font-size="12" fill="#8f959e" text-anchor="middle">回答</text>

  <!-- N2 -> 向量索引 -->
  <rect x="344" y="206" width="32" height="20" fill="#ffffff" rx="2" />
  <text x="360" y="220" font-size="12" fill="#8f959e" text-anchor="middle">查询</text>

  <!-- N2 -> 知识库 -->
  <rect x="464" y="206" width="32" height="20" fill="#ffffff" rx="2" />
  <text x="480" y="220" font-size="12" fill="#8f959e" text-anchor="middle">查询</text>

  <!-- 向量索引 -> N3 -->
  <rect x="464" y="238" width="32" height="20" fill="#ffffff" rx="2" />
  <text x="480" y="252" font-size="12" fill="#8f959e" text-anchor="middle">文档</text>

  <!-- 知识库 -> N3 -->
  <rect x="584" y="206" width="32" height="20" fill="#ffffff" rx="2" />
  <text x="600" y="220" font-size="12" fill="#8f959e" text-anchor="middle">文档</text>


  <!-- 端点：用户节点 -->
  <rect x="30" y="104" width="52" height="32" rx="16" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="56" y="125" font-size="12" font-weight="bold" fill="#1f2329" text-anchor="middle">用户</text>

  <!-- N1: 查询改写 -->
  <rect x="140" y="88" width="128" height="64" rx="6" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
  <text x="204" y="112" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">查询改写</text>
  <text x="204" y="134" font-size="12" fill="#8f959e" text-anchor="middle">Query Rewrite</text>

  <!-- N2: 多路检索 -->
  <rect x="324" y="88" width="128" height="64" rx="6" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
  <text x="388" y="112" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">多路检索</text>
  <text x="388" y="134" font-size="12" fill="#8f959e" text-anchor="middle">Multi-way Retrieval</text>

  <!-- N3: 召回合并 -->
  <rect x="508" y="88" width="128" height="64" rx="6" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
  <text x="572" y="112" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">召回合并</text>
  <text x="572" y="134" font-size="12" fill="#8f959e" text-anchor="middle">Recall &amp; Merge</text>

  <!-- N4: 重排 -->
  <rect x="692" y="88" width="128" height="64" rx="6" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
  <text x="756" y="112" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">重排</text>
  <text x="756" y="134" font-size="12" fill="#8f959e" text-anchor="middle">Reranking</text>

  <!-- N5: 上下文构造 -->
  <rect x="876" y="88" width="128" height="64" rx="6" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
  <text x="940" y="112" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">上下文构造</text>
  <text x="940" y="134" font-size="12" fill="#8f959e" text-anchor="middle">Context Builder</text>

  <!-- N6: 模型生成 (强调组) -->
  <rect x="1060" y="88" width="128" height="64" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="1124" y="112" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">模型生成</text>
  <text x="1124" y="134" font-size="12" fill="#8f959e" text-anchor="middle">Model Generation</text>

  <!-- N7: 引用校验 (强调组) -->
  <rect x="1244" y="88" width="128" height="64" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
  <text x="1308" y="112" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">引用校验</text>
  <text x="1308" y="134" font-size="12" fill="#8f959e" text-anchor="middle">Citation Validation</text>

  <!-- 端点：输出节点 -->
  <rect x="1428" y="104" width="64" height="32" rx="16" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="1460" y="125" font-size="12" font-weight="bold" fill="#1f2329" text-anchor="middle">输出</text>

  <!-- 数据源 1: 向量索引 (绿底) -->
  <rect x="324" y="280" width="128" height="64" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="388" y="312" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">向量索引</text>
  <text x="388" y="334" font-size="12" fill="#8f959e" text-anchor="middle">Vector Index</text>

  <!-- 数据源 2: 知识库 (黄底) -->
  <rect x="508" y="280" width="128" height="64" rx="6" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="572" y="312" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">知识库</text>
  <text x="572" y="334" font-size="12" fill="#8f959e" text-anchor="middle">Knowledge Base</text>

</svg>
