<svg width="1140" height="700" viewBox="0 0 1140 700" xmlns="http://www.w3.org/2000/svg">
  <!-- Defs for Markers -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 Z" fill="#646a73" />
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="20" y="38" font-size="20" font-weight="bold" fill="#1f2329">Agent Handoff 核心路由工作流</text>
  <text x="20" y="58" font-size="14" fill="#8f959e">跨智能体交接与高风险人工接管的标准封装协议</text>

  <!-- Swimlane Grid Lines -->
  <line x1="20" y1="70" x2="1120" y2="70" stroke="#dee0e3" stroke-width="1.5" />
  <line x1="20" y1="190" x2="1120" y2="190" stroke="#dee0e3" stroke-width="1.5" />
  <line x1="20" y1="430" x2="1120" y2="430" stroke="#dee0e3" stroke-width="1.5" />
  <line x1="20" y1="550" x2="1120" y2="550" stroke="#dee0e3" stroke-width="1.5" />
  <line x1="20" y1="670" x2="1120" y2="670" stroke="#dee0e3" stroke-width="1.5" />

  <!-- Swimlane Headers -->
  <!-- Agent A (Blue) -->
  <rect x="20" y="80" width="110" height="100" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="75" y="125" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Agent A</text>
  <text x="75" y="145" font-size="12" fill="#5178c6" text-anchor="middle">(前端接待)</text>

  <!-- Orchestration Platform (Purple) -->
  <rect x="20" y="200" width="110" height="220" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="75" y="300" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">编排平台</text>
  <text x="75" y="320" font-size="12" fill="#8569cb" text-anchor="middle">(Orchestration)</text>

  <!-- Agent B (Green) -->
  <rect x="20" y="440" width="110" height="100" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="75" y="485" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">Agent B</text>
  <text x="75" y="505" font-size="12" fill="#509863" text-anchor="middle">(专业技能)</text>

  <!-- Human Expert (Red) -->
  <rect x="20" y="560" width="110" height="100" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
  <text x="75" y="605" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">人工专家</text>
  <text x="75" y="625" font-size="12" fill="#d25d5a" text-anchor="middle">(Human)</text>

  <!-- ================= Connections (Rendered below nodes to avoid overlap) ================= -->

  <!-- A1 -> A2 -->
  <line x1="280" y1="138" x2="303" y2="138" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- A2 -> O1 -->
  <line x1="375" y1="161" x2="375" y2="213" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- O1 -> O2 -->
  <line x1="440" y1="243" x2="463" y2="243" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- O2 -> O3 -->
  <line x1="640" y1="243" x2="653" y2="243" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <!-- O3 -> B1 (Normal Flow) -->
  <line x1="710" y1="268" x2="710" y2="463" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="720" y="370" font-size="12" fill="#646a73">常规意图 / 低风险</text>
  <!-- B1 -> B2 -->
  <line x1="780" y1="493" x2="823" y2="493" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="805" y="485" font-size="12" fill="#646a73" text-anchor="middle">状态同步</text>
  <!-- O3 -> H1 (High Risk Flow) -->
  <polyline points="760,243 1050,243 1050,583" fill="none" stroke="#646a73" stroke-width="1.5" marker-end="url(#arrow)" />
  <text x="905" y="235" font-size="12" fill="#d25d5a" text-anchor="middle">高风险或未决异常</text>

  <!-- O2 -> D1 Data Line (Dashed) -->
  <line x1="555" y1="266" x2="555" y2="285" stroke="#d4b45b" stroke-width="1.5" stroke-dasharray="4 2" />

  <!-- ================= Nodes ================= -->

  <!-- Lane 1: Agent A -->
  <!-- A1 -->
  <rect x="150" y="115" width="130" height="46" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="215" y="143" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">执行当前意图</text>
  <!-- A2 -->
  <rect x="310" y="115" width="130" height="46" rx="6" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="375" y="134" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">超出能力边界</text>
  <text x="375" y="152" font-size="12" fill="#d25d5a" text-anchor="middle">触发交接</text>

  <!-- Lane 2: Orchestration Platform -->
  <!-- O1 -->
  <rect x="310" y="220" width="130" height="46" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="375" y="248" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">接收交接请求</text>
  <!-- O2 -->
  <rect x="470" y="220" width="170" height="46" rx="6" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="555" y="248" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">封装上下文与未决事项</text>
  <!-- O3 (Router) -->
  <polygon points="710,218 760,243 710,268 660,243" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="710" y="247" font-size="12" fill="#1f2329" text-anchor="middle" font-weight="bold">风险路由</text>

  <!-- D1: Handoff Payload Card -->
  <rect x="475" y="285" width="160" height="135" rx="6" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <!-- Payload Icon manually drawn (replacing emoji) -->
  <rect x="488" y="300" width="12" height="14" rx="1.5" fill="none" stroke="#d4b45b" stroke-width="1.5" />
  <line x1="491" y1="305" x2="497" y2="305" stroke="#d4b45b" stroke-width="1" />
  <line x1="491" y1="309" x2="497" y2="309" stroke="#d4b45b" stroke-width="1" />
  <text x="506" y="312" font-size="14" fill="#1f2329" font-weight="bold">交接包 (Payload)</text>
  <line x1="475" y1="324" x2="635" y2="324" stroke="#d4b45b" stroke-width="1" stroke-dasharray="4 2" />
  <text x="490" y="348" font-size="12" fill="#1f2329">
    <tspan x="490" dy="0">• 上下文: ctx_98a2</tspan>
    <tspan x="490" dy="22">• 历史: 附带最近5轮</tspan>
    <tspan x="490" dy="22">• 未决: 需验证用户身份</tspan>
    <tspan x="490" dy="22" fill="#d48e5b">• 风险值: 待安全评估</tspan>
  </text>

  <!-- Lane 3: Agent B -->
  <!-- B1 -->
  <rect x="640" y="470" width="140" height="46" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="710" y="498" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">接收并确认交接包</text>
  <!-- B2 -->
  <rect x="830" y="470" width="140" height="46" rx="6" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="900" y="498" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">无缝继续处理</text>

  <!-- Lane 4: Human Expert -->
  <!-- H1 -->
  <rect x="980" y="590" width="140" height="46" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
  <text x="1050" y="618" font-size="14" fill="#1f2329" text-anchor="middle" font-weight="bold">转由人工介入处理</text>
</svg>
