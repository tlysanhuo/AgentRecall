<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="680" viewBox="0 0 1040 680" style="background-color: #ffffff;">
  <defs>
    <!-- 读链路蓝色箭头 -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#5178c6" />
    </marker>
    <!-- 写链路紫色箭头 -->
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#8569cb" />
    </marker>
    <!-- 异常补偿红色箭头 -->
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 Z" fill="#d25d5a" />
    </marker>
  </defs>

  <!-- ================= 读流程分区 (Read Flow) ================= -->
  <!-- 读泳道背景与边框 -->
  <rect x="40" y="40" width="960" height="280" rx="8" fill="#ffffff" stroke="#dee0e3" stroke-width="1.5" />

  <!-- 读泳道标题标签 -->
  <rect x="56" y="56" width="140" height="32" rx="16" fill="#f0f4fc" stroke="#5178c6" stroke-width="1" />
  <text x="126" y="77" font-size="14" font-weight="bold" fill="#5178c6" text-anchor="middle">读流程 (Read Flow)</text>

  <!-- 读流程节点定义 -->
  <!-- R1: 发起读请求 -->
  <rect x="80" y="132" width="144" height="56" rx="6" fill="#ffffff" stroke="#5178c6" stroke-width="1.5" />
  <text x="152" y="152" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">发起读请求</text>
  <text x="152" y="174" font-size="12" fill="#8f959e" text-anchor="middle">Client Request</text>

  <!-- R2: 查询缓存 -->
  <rect x="280" y="132" width="144" height="56" rx="6" fill="#ffffff" stroke="#5178c6" stroke-width="1.5" />
  <text x="352" y="152" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">查询缓存</text>
  <text x="352" y="174" font-size="12" fill="#8f959e" text-anchor="middle">Query Redis</text>

  <!-- R3: 缓存命中判断 (菱形) -->
  <polygon points="520,132 570,160 520,188 470,160" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="520" y="165" font-size="14" font-weight="bold" fill="#5178c6" text-anchor="middle">缓存命中?</text>

  <!-- R4: 直接返回数据 (命中分支) -->
  <rect x="660" y="68" width="144" height="56" rx="6" fill="#ffffff" stroke="#5178c6" stroke-width="1.5" />
  <text x="732" y="88" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">直接返回数据</text>
  <text x="732" y="110" font-size="12" fill="#8f959e" text-anchor="middle">Return Cache Data</text>

  <!-- R5: 查询数据库 (未命中分支) -->
  <rect x="660" y="132" width="144" height="56" rx="6" fill="#ffffff" stroke="#5178c6" stroke-width="1.5" />
  <text x="732" y="152" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">查询数据库</text>
  <text x="732" y="174" font-size="12" fill="#8f959e" text-anchor="middle">Query MySQL</text>

  <!-- R6: 返回真实数据 -->
  <rect x="860" y="132" width="144" height="56" rx="6" fill="#ffffff" stroke="#5178c6" stroke-width="1.5" />
  <text x="932" y="152" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">返回真实数据</text>
  <text x="932" y="174" font-size="12" fill="#8f959e" text-anchor="middle">Return DB Data</text>

  <!-- R7: 回填缓存 (下行反馈) -->
  <rect x="660" y="228" width="144" height="56" rx="6" fill="#ffffff" stroke="#5178c6" stroke-width="1.5" />
  <text x="732" y="248" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">回填缓存</text>
  <text x="732" y="270" font-size="12" fill="#8f959e" text-anchor="middle">Set Redis Cache</text>

  <!-- 读流程连线 -->
  <line x1="224" y1="160" x2="278" y2="160" stroke="#5178c6" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <line x1="424" y1="160" x2="468" y2="160" stroke="#5178c6" stroke-width="1.5" marker-end="url(#arrow-blue)" />

  <!-- 判断分支：命中 (Y) -->
  <polyline points="520,132 520,96 658,96" fill="none" stroke="#5178c6" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="560" y="88" font-size="12" font-weight="bold" fill="#5178c6">Y 命中</text>

  <!-- 判断分支：未命中 (N) -->
  <line x1="570" y1="160" x2="658" y2="160" stroke="#5178c6" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="615" y="152" font-size="12" font-weight="bold" fill="#5178c6">N 未命中</text>

  <!-- 数据库 -> 返回数据 -->
  <line x1="804" y1="160" x2="858" y2="160" stroke="#5178c6" stroke-width="1.5" marker-end="url(#arrow-blue)" />

  <!-- 数据库 -> 回填缓存 -->
  <line x1="732" y1="188" x2="732" y2="226" stroke="#5178c6" stroke-width="1.5" marker-end="url(#arrow-blue)" />

  <!-- 回填缓存 -> 反馈至查询缓存节点外侧通道 -->
  <polyline points="660,256 352,256 352,190" fill="none" stroke="#5178c6" stroke-width="1.5" marker-end="url(#arrow-blue)" />
  <text x="500" y="248" font-size="12" fill="#8f959e">异步/同步更新数据</text>


  <!-- ================= 写流程分区 (Write Flow) ================= -->
  <!-- 写泳道背景与边框 -->
  <rect x="40" y="340" width="960" height="280" rx="8" fill="#ffffff" stroke="#dee0e3" stroke-width="1.5" />

  <!-- 写泳道标题标签 -->
  <rect x="56" y="356" width="140" height="32" rx="16" fill="#eae2fe" stroke="#8569cb" stroke-width="1" />
  <text x="126" y="377" font-size="14" font-weight="bold" fill="#8569cb" text-anchor="middle">写流程 (Write Flow)</text>

  <!-- 写流程节点定义 -->
  <!-- W1: 发起写请求 -->
  <rect x="80" y="432" width="144" height="56" rx="6" fill="#ffffff" stroke="#8569cb" stroke-width="1.5" />
  <text x="152" y="452" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">发起写请求</text>
  <text x="152" y="474" font-size="12" fill="#8f959e" text-anchor="middle">Client Request</text>

  <!-- W2: 更新数据库 -->
  <rect x="280" y="432" width="144" height="56" rx="6" fill="#ffffff" stroke="#8569cb" stroke-width="1.5" />
  <text x="352" y="452" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">更新数据库</text>
  <text x="352" y="474" font-size="12" fill="#8f959e" text-anchor="middle">Update MySQL</text>

  <!-- W3: 操作缓存 -->
  <rect x="470" y="432" width="144" height="56" rx="6" fill="#ffffff" stroke="#8569cb" stroke-width="1.5" />
  <text x="542" y="452" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">操作缓存</text>
  <text x="542" y="474" font-size="12" fill="#8f959e" text-anchor="middle">Del / Set Redis</text>

  <!-- W4: 操作成功判断 (菱形) -->
  <polygon points="710,432 760,460 710,488 660,460" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="710" y="465" font-size="14" font-weight="bold" fill="#8569cb" text-anchor="middle">操作成功?</text>

  <!-- W5: 完成写入并返回 -->
  <rect x="860" y="432" width="144" height="56" rx="6" fill="#ffffff" stroke="#8569cb" stroke-width="1.5" />
  <text x="932" y="452" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">完成写入</text>
  <text x="932" y="474" font-size="12" fill="#8f959e" text-anchor="middle">Return Success</text>

  <!-- W6: 发送补偿消息 (异常机制 - 红色告警) -->
  <rect x="638" y="528" width="144" height="56" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
  <text x="710" y="548" font-size="14" font-weight="bold" fill="#d25d5a" text-anchor="middle">发送补偿消息</text>
  <text x="710" y="570" font-size="12" fill="#d25d5a" text-anchor="middle">Produce to MQ</text>

  <!-- W7: 异步重试/告警 -->
  <rect x="860" y="528" width="144" height="56" rx="6" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
  <text x="932" y="548" font-size="14" font-weight="bold" fill="#d25d5a" text-anchor="middle">异步重试 / 告警</text>
  <text x="932" y="570" font-size="12" fill="#d25d5a" text-anchor="middle">Consume &amp; Retry</text>

  <!-- 并发控制高亮注释区 -->
  <rect x="270" y="360" width="354" height="36" rx="4" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" stroke-dasharray="4,4" />
  <text x="447" y="383" font-size="12" font-weight="bold" fill="#d48e5b" text-anchor="middle">并发控制：推荐结合 延迟双删 或 分布式锁 防脏数据</text>
  <!-- 注释引导线 -->
  <line x1="447" y1="396" x2="447" y2="456" stroke="#d4b45b" stroke-width="1.5" stroke-dasharray="4,4" />
  <circle cx="447" cy="460" r="3" fill="#d4b45b" />

  <!-- 写流程连线 -->
  <line x1="224" y1="460" x2="278" y2="460" stroke="#8569cb" stroke-width="1.5" marker-end="url(#arrow-purple)" />
  <line x1="424" y1="460" x2="468" y2="460" stroke="#8569cb" stroke-width="1.5" marker-end="url(#arrow-purple)" />
  <line x1="614" y1="460" x2="658" y2="460" stroke="#8569cb" stroke-width="1.5" marker-end="url(#arrow-purple)" />

  <!-- 判断分支：成功 (Y) -->
  <line x1="760" y1="460" x2="858" y2="460" stroke="#8569cb" stroke-width="1.5" marker-end="url(#arrow-purple)" />
  <text x="810" y="452" font-size="12" font-weight="bold" fill="#8569cb">Y 成功</text>

  <!-- 判断分支：失败补偿 (N) -->
  <line x1="710" y1="488" x2="710" y2="526" stroke="#d25d5a" stroke-width="1.5" marker-end="url(#arrow-red)" />
  <text x="718" y="512" font-size="12" font-weight="bold" fill="#d25d5a">N 失败</text>

  <!-- 补偿机制节点间连线 -->
  <line x1="782" y1="556" x2="858" y2="556" stroke="#d25d5a" stroke-width="1.5" marker-end="url(#arrow-red)" />

  <!-- 异步重试回调 (走底部安全通道) -->
  <polyline points="932,584 932,610 542,610 542,490" fill="none" stroke="#d25d5a" stroke-width="1.5" marker-end="url(#arrow-red)" stroke-dasharray="6,4" />
  <text x="737" y="602" font-size="12" fill="#d25d5a" text-anchor="middle">MQ 触发最终一致性重试</text>
</svg>
