<svg width="1440" height="500" viewBox="0 0 1440 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 Z" fill="#8f959e" />
    </marker>
  </defs>

  <!-- ================= 背景层 ================= -->
  <!-- Col 1: 接入与预处理层 -->
  <rect x="40" y="100" width="580" height="340" rx="12" fill="#f5f5f5" stroke="#dee0e3" />
  <!-- Col 2: 计算处理层 -->
  <rect x="680" y="100" width="200" height="340" rx="12" fill="#f5f5f5" stroke="#dee0e3" />
  <!-- Col 3: 核心存储层 -->
  <rect x="940" y="100" width="200" height="340" rx="12" fill="#f5f5f5" stroke="#dee0e3" />
  <!-- Col 4: 数据应用层 -->
  <rect x="1200" y="100" width="200" height="340" rx="12" fill="#f5f5f5" stroke="#dee0e3" />

  <!-- ================= 栏目标题 ================= -->
  <g font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">
    <rect x="250" y="115" width="160" height="30" rx="15" fill="#ffffff" stroke="#bbbfc4" />
    <text x="330" y="135">接入与预处理层</text>

    <rect x="700" y="115" width="160" height="30" rx="15" fill="#ffffff" stroke="#bbbfc4" />
    <text x="780" y="135">计算处理层</text>

    <rect x="960" y="115" width="160" height="30" rx="15" fill="#ffffff" stroke="#bbbfc4" />
    <text x="1040" y="135">数据汇聚与存储</text>

    <rect x="1220" y="115" width="160" height="30" rx="15" fill="#ffffff" stroke="#bbbfc4" />
    <text x="1300" y="135">数据应用层</text>
  </g>

  <!-- ================= 预处理大容器 ================= -->
  <rect x="250" y="175" width="340" height="170" rx="12" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="265" y="200" font-size="12" font-weight="bold" fill="#5178c6">数据清洗与加工组</text>

  <!-- ================= 连线层 ================= -->
  <g stroke="#8f959e" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round">
    <!-- 源到预处理 -->
    <line x1="180" y1="260" x2="265" y2="260" marker-end="url(#arrow)" />
    <!-- 预处理内部 -->
    <line x1="350" y1="260" x2="375" y2="260" marker-end="url(#arrow)" />
    <line x1="460" y1="260" x2="485" y2="260" marker-end="url(#arrow)" />

    <!-- 预处理出到干线 -->
    <line x1="570" y1="260" x2="650" y2="260" />
    <!-- 干线分叉入计算层 -->
    <path fill="none" d="M 650 260 L 650 200 L 695 200" marker-end="url(#arrow)" />
    <path fill="none" d="M 650 260 L 650 320 L 695 320" marker-end="url(#arrow)" />

    <!-- 计算入汇聚干线 -->
    <line x1="860" y1="200" x2="910" y2="200" />
    <line x1="860" y1="320" x2="910" y2="320" />
    <line x1="910" y1="200" x2="910" y2="320" />
    <!-- 汇聚干线分发入存储层 -->
    <line x1="910" y1="200" x2="955" y2="200" marker-end="url(#arrow)" />
    <line x1="910" y1="320" x2="955" y2="320" marker-end="url(#arrow)" />

    <!-- 存储入应用干线 -->
    <line x1="1120" y1="200" x2="1170" y2="200" />
    <line x1="1120" y1="320" x2="1170" y2="320" />
    <line x1="1170" y1="200" x2="1170" y2="320" />
    <!-- 应用干线分发入应用层 -->
    <line x1="1170" y1="200" x2="1215" y2="200" marker-end="url(#arrow)" />
    <line x1="1170" y1="320" x2="1215" y2="320" marker-end="url(#arrow)" />
  </g>

  <!-- ================= 连线标签 (遮挡线段) ================= -->
  <g text-anchor="middle" font-size="12" fill="#646a73">
    <!-- 原始数据 -->
    <rect x="190" y="248" width="70" height="24" rx="4" fill="#ffffff" stroke="#bbbfc4" />
    <text x="225" y="264">原始数据</text>

    <!-- 标准数据 -->
    <rect x="575" y="248" width="70" height="24" rx="4" fill="#ffffff" stroke="#bbbfc4" />
    <text x="610" y="264">标准数据</text>

    <!-- 聚合数据 -->
    <rect x="1135" y="248" width="70" height="24" rx="4" fill="#ffffff" stroke="#bbbfc4" />
    <text x="1170" y="264">聚合数据</text>
  </g>

  <!-- ================= 节点实体 ================= -->

  <!-- 【数据源系统】堆叠卡片 -->
  <g>
    <rect x="64" y="226" width="120" height="80" rx="6" fill="#ffffff" stroke="#bbbfc4" />
    <rect x="62" y="223" width="120" height="80" rx="6" fill="#ffffff" stroke="#bbbfc4" />
    <rect x="60" y="220" width="120" height="80" rx="6" fill="#ffffff" stroke="#8f959e" stroke-width="1.5" />
    <text x="120" y="255" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">多源数据系统</text>
    <text x="120" y="275" font-size="12" fill="#646a73" text-anchor="middle">(DB, API, Log)</text>
  </g>

  <!-- 【预处理子模块】 -->
  <g text-anchor="middle">
    <!-- 数据采集 -->
    <rect x="270" y="230" width="80" height="80" rx="6" fill="#ffffff" stroke="#bbbfc4" />
    <circle cx="310" cy="246" r="4" fill="#5178c6" />
    <text x="310" y="268" font-size="14" font-weight="bold" fill="#1f2329">数据采集</text>
    <text x="310" y="288" font-size="12" fill="#8f959e">Ingestion</text>

    <!-- 数据清洗 -->
    <rect x="380" y="230" width="80" height="80" rx="6" fill="#ffffff" stroke="#bbbfc4" />
    <rect x="416" y="242" width="8" height="8" rx="2" fill="#5178c6" />
    <text x="420" y="268" font-size="14" font-weight="bold" fill="#1f2329">数据清洗</text>
    <text x="420" y="288" font-size="12" fill="#8f959e">Cleaning</text>

    <!-- 数据标准 -->
    <rect x="490" y="230" width="80" height="80" rx="6" fill="#ffffff" stroke="#bbbfc4" />
    <polygon points="530,242 534,250 526,250" fill="#5178c6" />
    <text x="530" y="268" font-size="14" font-weight="bold" fill="#1f2329">标准化</text>
    <text x="530" y="288" font-size="12" fill="#8f959e">Standard</text>
  </g>

  <!-- 【计算处理层】 -->
  <!-- 实时流处理 (第4组 绿色) -->
  <g>
    <rect x="700" y="160" width="160" height="80" rx="8" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
    <circle cx="715" cy="175" r="4" fill="#509863" />
    <text x="780" y="195" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">实时流处理</text>
    <text x="780" y="215" font-size="12" fill="#646a73" text-anchor="middle">高吞吐、低延迟计算</text>
  </g>
  <!-- 离线批处理 (第5组 黄色) -->
  <g>
    <rect x="700" y="280" width="160" height="80" rx="8" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
    <circle cx="715" cy="295" r="4" fill="#d4b45b" />
    <text x="780" y="315" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">离线批处理</text>
    <text x="780" y="335" font-size="12" fill="#646a73" text-anchor="middle">海量规模复杂计算</text>
  </g>

  <!-- 【核心存储层】 -->
  <!-- 数据湖 (第1组 紫色) -->
  <g>
    <rect x="960" y="160" width="160" height="80" rx="8" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
    <circle cx="975" cy="175" r="4" fill="#8569cb" />
    <text x="1040" y="195" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">数据湖 Data Lake</text>
    <text x="1040" y="215" font-size="12" fill="#646a73" text-anchor="middle">海量半结构化汇聚</text>
  </g>
  <!-- 数据仓库 (第3组 灰蓝) -->
  <g>
    <rect x="960" y="280" width="160" height="80" rx="8" fill="#d6dcf3" stroke="#5263a5" stroke-width="1.5" />
    <circle cx="975" cy="295" r="4" fill="#5263a5" />
    <text x="1040" y="315" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">数仓 Data Warehouse</text>
    <text x="1040" y="335" font-size="12" fill="#646a73" text-anchor="middle">结构化、高性能查询</text>
  </g>

  <!-- 【数据应用层】 -->
  <!-- 在线服务 (第6组 粉红) -->
  <g>
    <rect x="1220" y="160" width="160" height="80" rx="8" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
    <circle cx="1235" cy="175" r="4" fill="#d25d5a" />
    <text x="1300" y="195" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">在线服务系统</text>
    <text x="1300" y="215" font-size="12" fill="#646a73" text-anchor="middle">推荐、风控、API分发</text>
  </g>
  <!-- 分析报表 (第6组 粉红) -->
  <g>
    <rect x="1220" y="280" width="160" height="80" rx="8" fill="#fee3e2" stroke="#d25d5a" stroke-width="1.5" />
    <circle cx="1235" cy="295" r="4" fill="#d25d5a" />
    <text x="1300" y="315" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">分析与报表系统</text>
    <text x="1300" y="335" font-size="12" fill="#646a73" text-anchor="middle">BI 仪表盘与决策分析</text>
  </g>

</svg>
