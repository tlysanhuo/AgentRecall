<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 1 1 L 9 5 L 1 9" stroke="#000000" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="320" fill="#ffffff" />

  <!-- Global Title -->
  <text x="40" y="50" font-size="20" font-weight="bold" fill="#1f2329">系统实体关系图 (ER Diagram)</text>
  <text x="40" y="74" font-size="13" fill="#646a73">展示用户、项目、任务、执行记录与结果的数据从属与衍生关系</text>
  <line x1="40" y1="90" x2="1160" y2="90" stroke="#dee0e3" stroke-width="1" />

  <!-- ========================================== -->
  <!-- 1. 用户 (User) Table -->
  <!-- ========================================== -->
  <g>
    <!-- Table Container -->
    <rect x="40" y="120" width="160" height="32" rx="4" fill="#f5f5f5" />
    <rect x="40" y="136" width="160" height="16" fill="#f5f5f5" />
    <rect x="40" y="120" width="160" height="136" rx="4" fill="none" stroke="#000000" stroke-width="1.5" />

    <!-- Table Header Text -->
    <text x="120" y="141" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">用户 (User)</text>
    <line x1="40" y1="152" x2="200" y2="152" stroke="#000000" stroke-width="1.5" />

    <!-- Row Separators -->
    <line x1="40" y1="178" x2="200" y2="178" stroke="#dee0e3" stroke-width="1" />
    <line x1="40" y1="204" x2="200" y2="204" stroke="#dee0e3" stroke-width="1" />
    <line x1="40" y1="230" x2="200" y2="230" stroke="#dee0e3" stroke-width="1" />

    <!-- Row 1: id -->
    <rect x="52" y="158" width="24" height="14" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="64" y="168" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">PK</text>
    <text x="84" y="169" font-size="12" font-weight="bold" fill="#1f2329">id</text>
    <text x="188" y="169" font-size="11" fill="#8f959e" text-anchor="end">int</text>

    <!-- Row 2: username -->
    <circle cx="64" cy="191" r="2.5" fill="#bbbfc4" />
    <text x="84" y="195" font-size="12" fill="#1f2329">username</text>
    <text x="188" y="195" font-size="11" fill="#8f959e" text-anchor="end">varchar</text>

    <!-- Row 3: email -->
    <circle cx="64" cy="217" r="2.5" fill="#bbbfc4" />
    <text x="84" y="221" font-size="12" fill="#1f2329">email</text>
    <text x="188" y="221" font-size="11" fill="#8f959e" text-anchor="end">varchar</text>

    <!-- Row 4: status -->
    <circle cx="64" cy="243" r="2.5" fill="#bbbfc4" />
    <text x="84" y="247" font-size="12" fill="#1f2329">status</text>
    <text x="188" y="247" font-size="11" fill="#8f959e" text-anchor="end">tinyint</text>
  </g>

  <!-- ========================================== -->
  <!-- 2. 项目 (Project) Table -->
  <!-- ========================================== -->
  <g>
    <!-- Table Container -->
    <rect x="280" y="120" width="160" height="32" rx="4" fill="#f5f5f5" />
    <rect x="280" y="136" width="160" height="16" fill="#f5f5f5" />
    <rect x="280" y="120" width="160" height="136" rx="4" fill="none" stroke="#000000" stroke-width="1.5" />

    <!-- Table Header Text -->
    <text x="360" y="141" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">项目 (Project)</text>
    <line x1="280" y1="152" x2="440" y2="152" stroke="#000000" stroke-width="1.5" />

    <!-- Row Separators -->
    <line x1="280" y1="178" x2="440" y2="178" stroke="#dee0e3" stroke-width="1" />
    <line x1="280" y1="204" x2="440" y2="204" stroke="#dee0e3" stroke-width="1" />
    <line x1="280" y1="230" x2="440" y2="230" stroke="#dee0e3" stroke-width="1" />

    <!-- Row 1: id -->
    <rect x="292" y="158" width="24" height="14" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="304" y="168" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">PK</text>
    <text x="324" y="169" font-size="12" font-weight="bold" fill="#1f2329">id</text>
    <text x="428" y="169" font-size="11" fill="#8f959e" text-anchor="end">int</text>

    <!-- Row 2: user_id -->
    <rect x="292" y="184" width="24" height="14" rx="2" fill="#ffffff" stroke="#bbbfc4" stroke-width="1" />
    <text x="304" y="194" font-size="10" font-weight="bold" fill="#646a73" text-anchor="middle">FK</text>
    <text x="324" y="195" font-size="12" fill="#1f2329">user_id</text>
    <text x="428" y="195" font-size="11" fill="#8f959e" text-anchor="end">int</text>

    <!-- Row 3: name -->
    <circle cx="304" cy="217" r="2.5" fill="#bbbfc4" />
    <text x="324" y="221" font-size="12" fill="#1f2329">name</text>
    <text x="428" y="221" font-size="11" fill="#8f959e" text-anchor="end">varchar</text>

    <!-- Row 4: created_at -->
    <circle cx="304" cy="243" r="2.5" fill="#bbbfc4" />
    <text x="324" y="247" font-size="12" fill="#1f2329">created_at</text>
    <text x="428" y="247" font-size="11" fill="#8f959e" text-anchor="end">datetime</text>
  </g>

  <!-- ========================================== -->
  <!-- 3. 任务 (Task) Table -->
  <!-- ========================================== -->
  <g>
    <!-- Table Container -->
    <rect x="520" y="120" width="160" height="32" rx="4" fill="#f5f5f5" />
    <rect x="520" y="136" width="160" height="16" fill="#f5f5f5" />
    <rect x="520" y="120" width="160" height="136" rx="4" fill="none" stroke="#000000" stroke-width="1.5" />

    <!-- Table Header Text -->
    <text x="600" y="141" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">任务 (Task)</text>
    <line x1="520" y1="152" x2="680" y2="152" stroke="#000000" stroke-width="1.5" />

    <!-- Row Separators -->
    <line x1="520" y1="178" x2="680" y2="178" stroke="#dee0e3" stroke-width="1" />
    <line x1="520" y1="204" x2="680" y2="204" stroke="#dee0e3" stroke-width="1" />
    <line x1="520" y1="230" x2="680" y2="230" stroke="#dee0e3" stroke-width="1" />

    <!-- Row 1: id -->
    <rect x="532" y="158" width="24" height="14" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="544" y="168" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">PK</text>
    <text x="564" y="169" font-size="12" font-weight="bold" fill="#1f2329">id</text>
    <text x="668" y="169" font-size="11" fill="#8f959e" text-anchor="end">int</text>

    <!-- Row 2: project_id -->
    <rect x="532" y="184" width="24" height="14" rx="2" fill="#ffffff" stroke="#bbbfc4" stroke-width="1" />
    <text x="544" y="194" font-size="10" font-weight="bold" fill="#646a73" text-anchor="middle">FK</text>
    <text x="564" y="195" font-size="12" fill="#1f2329">project_id</text>
    <text x="668" y="195" font-size="11" fill="#8f959e" text-anchor="end">int</text>

    <!-- Row 3: title -->
    <circle cx="544" cy="217" r="2.5" fill="#bbbfc4" />
    <text x="564" y="221" font-size="12" fill="#1f2329">title</text>
    <text x="668" y="221" font-size="11" fill="#8f959e" text-anchor="end">varchar</text>

    <!-- Row 4: status -->
    <circle cx="544" cy="243" r="2.5" fill="#bbbfc4" />
    <text x="564" y="247" font-size="12" fill="#1f2329">status</text>
    <text x="668" y="247" font-size="11" fill="#8f959e" text-anchor="end">tinyint</text>
  </g>

  <!-- ========================================== -->
  <!-- 4. 执行记录 (Record) Table -->
  <!-- ========================================== -->
  <g>
    <!-- Table Container -->
    <rect x="760" y="120" width="160" height="32" rx="4" fill="#f5f5f5" />
    <rect x="760" y="136" width="160" height="16" fill="#f5f5f5" />
    <rect x="760" y="120" width="160" height="136" rx="4" fill="none" stroke="#000000" stroke-width="1.5" />

    <!-- Table Header Text -->
    <text x="840" y="141" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">执行记录 (Record)</text>
    <line x1="760" y1="152" x2="920" y2="152" stroke="#000000" stroke-width="1.5" />

    <!-- Row Separators -->
    <line x1="760" y1="178" x2="920" y2="178" stroke="#dee0e3" stroke-width="1" />
    <line x1="760" y1="204" x2="920" y2="204" stroke="#dee0e3" stroke-width="1" />
    <line x1="760" y1="230" x2="920" y2="230" stroke="#dee0e3" stroke-width="1" />

    <!-- Row 1: id -->
    <rect x="772" y="158" width="24" height="14" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="784" y="168" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">PK</text>
    <text x="804" y="169" font-size="12" font-weight="bold" fill="#1f2329">id</text>
    <text x="908" y="169" font-size="11" fill="#8f959e" text-anchor="end">int</text>

    <!-- Row 2: task_id -->
    <rect x="772" y="184" width="24" height="14" rx="2" fill="#ffffff" stroke="#bbbfc4" stroke-width="1" />
    <text x="784" y="194" font-size="10" font-weight="bold" fill="#646a73" text-anchor="middle">FK</text>
    <text x="804" y="195" font-size="12" fill="#1f2329">task_id</text>
    <text x="908" y="195" font-size="11" fill="#8f959e" text-anchor="end">int</text>

    <!-- Row 3: start_time -->
    <circle cx="784" cy="217" r="2.5" fill="#bbbfc4" />
    <text x="804" y="221" font-size="12" fill="#1f2329">start_time</text>
    <text x="908" y="221" font-size="11" fill="#8f959e" text-anchor="end">datetime</text>

    <!-- Row 4: end_time -->
    <circle cx="784" cy="243" r="2.5" fill="#bbbfc4" />
    <text x="804" y="247" font-size="12" fill="#1f2329">end_time</text>
    <text x="908" y="247" font-size="11" fill="#8f959e" text-anchor="end">datetime</text>
  </g>

  <!-- ========================================== -->
  <!-- 5. 结果 (Result) Table -->
  <!-- ========================================== -->
  <g>
    <!-- Table Container -->
    <rect x="1000" y="120" width="160" height="32" rx="4" fill="#f5f5f5" />
    <rect x="1000" y="136" width="160" height="16" fill="#f5f5f5" />
    <rect x="1000" y="120" width="160" height="136" rx="4" fill="none" stroke="#000000" stroke-width="1.5" />

    <!-- Table Header Text -->
    <text x="1080" y="141" font-size="14" font-weight="bold" fill="#1f2329" text-anchor="middle">结果 (Result)</text>
    <line x1="1000" y1="152" x2="1160" y2="152" stroke="#000000" stroke-width="1.5" />

    <!-- Row Separators -->
    <line x1="1000" y1="178" x2="1160" y2="178" stroke="#dee0e3" stroke-width="1" />
    <line x1="1000" y1="204" x2="1160" y2="204" stroke="#dee0e3" stroke-width="1" />
    <line x1="1000" y1="230" x2="1160" y2="230" stroke="#dee0e3" stroke-width="1" />

    <!-- Row 1: id -->
    <rect x="1012" y="158" width="24" height="14" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1" />
    <text x="1024" y="168" font-size="10" font-weight="bold" fill="#000000" text-anchor="middle">PK</text>
    <text x="1044" y="169" font-size="12" font-weight="bold" fill="#1f2329">id</text>
    <text x="1148" y="169" font-size="11" fill="#8f959e" text-anchor="end">int</text>

    <!-- Row 2: record_id -->
    <rect x="1012" y="184" width="24" height="14" rx="2" fill="#ffffff" stroke="#bbbfc4" stroke-width="1" />
    <text x="1024" y="194" font-size="10" font-weight="bold" fill="#646a73" text-anchor="middle">FK</text>
    <text x="1044" y="195" font-size="12" fill="#1f2329">record_id</text>
    <text x="1148" y="195" font-size="11" fill="#8f959e" text-anchor="end">int</text>

    <!-- Row 3: output_data -->
    <circle cx="1024" cy="217" r="2.5" fill="#bbbfc4" />
    <text x="1044" y="221" font-size="12" fill="#1f2329">output_data</text>
    <text x="1148" y="221" font-size="11" fill="#8f959e" text-anchor="end">json</text>

    <!-- Row 4: success -->
    <circle cx="1024" cy="243" r="2.5" fill="#bbbfc4" />
    <text x="1044" y="247" font-size="12" fill="#1f2329">success</text>
    <text x="1148" y="247" font-size="11" fill="#8f959e" text-anchor="end">boolean</text>
  </g>

  <!-- ========================================== -->
  <!-- Connection Lines (Orthogonal with markers) -->
  <!-- ========================================== -->
  <g>
    <!-- 1:N User to Project -->
    <path d="M 200 165 L 240 165 L 240 191 L 280 191" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
    <rect x="204" y="148" width="16" height="16" fill="#ffffff" />
    <text x="212" y="160" font-size="12" fill="#1f2329" font-weight="bold" text-anchor="middle">1</text>
    <rect x="260" y="174" width="16" height="16" fill="#ffffff" />
    <text x="268" y="186" font-size="12" fill="#1f2329" font-weight="bold" text-anchor="middle">N</text>

    <!-- 1:N Project to Task -->
    <path d="M 440 165 L 480 165 L 480 191 L 520 191" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
    <rect x="444" y="148" width="16" height="16" fill="#ffffff" />
    <text x="452" y="160" font-size="12" fill="#1f2329" font-weight="bold" text-anchor="middle">1</text>
    <rect x="500" y="174" width="16" height="16" fill="#ffffff" />
    <text x="508" y="186" font-size="12" fill="#1f2329" font-weight="bold" text-anchor="middle">N</text>

    <!-- 1:N Task to Exec Record -->
    <path d="M 680 165 L 720 165 L 720 191 L 760 191" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
    <rect x="684" y="148" width="16" height="16" fill="#ffffff" />
    <text x="692" y="160" font-size="12" fill="#1f2329" font-weight="bold" text-anchor="middle">1</text>
    <rect x="740" y="174" width="16" height="16" fill="#ffffff" />
    <text x="748" y="186" font-size="12" fill="#1f2329" font-weight="bold" text-anchor="middle">N</text>

    <!-- 1:1 Exec Record to Result -->
    <path d="M 920 165 L 960 165 L 960 191 L 1000 191" stroke="#000000" stroke-width="1.5" fill="none" marker-end="url(#arrow)" />
    <rect x="924" y="148" width="16" height="16" fill="#ffffff" />
    <text x="932" y="160" font-size="12" fill="#1f2329" font-weight="bold" text-anchor="middle">1</text>
    <rect x="980" y="174" width="16" height="16" fill="#ffffff" />
    <text x="988" y="186" font-size="12" fill="#1f2329" font-weight="bold" text-anchor="middle">1</text>
  </g>

</svg>
