<svg width="1440" height="420" viewBox="0 0 1440 420" xmlns="http://www.w3.org/2000/svg">
  <!-- Defs for Markers -->
  <defs>
    <marker id="arrow-main" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#bbbfc4" />
    </marker>
    <marker id="arrow-back" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#d25d5a" />
    </marker>
  </defs>

  <!-- Title Area -->
  <text x="60" y="60" font-size="24" font-weight="bold" fill="#1f2329">Prompt 开发与评测迭代闭环</text>
  <text x="60" y="86" font-size="14" fill="#8f959e">标准化的模板编写、测试验证、自动化数据对比与人工 Review 流程</text>

  <!-- Flow Lines (Draw first to be in background) -->
  <!-- Main flow -->
  <line x1="240" y1="220" x2="282" y2="220" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow-main)" />
  <line x1="470" y1="220" x2="512" y2="220" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow-main)" />
  <line x1="700" y1="220" x2="742" y2="220" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow-main)" />
  <line x1="930" y1="220" x2="972" y2="220" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow-main)" />
  <line x1="1160" y1="220" x2="1202" y2="220" stroke="#bbbfc4" stroke-width="2" marker-end="url(#arrow-main)" />

  <!-- Flow back lines -->
  <polyline points="1070,260 1070,340 150,340 150,268" fill="none" stroke="#d25d5a" stroke-width="1.5" marker-end="url(#arrow-back)" />
  <line x1="840" y1="260" x2="840" y2="340" stroke="#d25d5a" stroke-width="1.5" />

  <!-- Top Labels Dashed Connecting Lines -->
  <line x1="150" y1="146" x2="150" y2="180" stroke="#dee0e3" stroke-dasharray="4 4" stroke-width="1.5" />
  <line x1="610" y1="146" x2="610" y2="180" stroke="#dee0e3" stroke-dasharray="4 4" stroke-width="1.5" />
  <line x1="1300" y1="146" x2="1300" y2="180" stroke="#dee0e3" stroke-dasharray="4 4" stroke-width="1.5" />

  <!-- Flow Labels (Covering lines) -->
  <!-- Feedback Label 1: Indicator Down -->
  <rect x="804" y="278" width="72" height="24" rx="4" fill="#ffffff" stroke="#fee3e2" stroke-width="1" />
  <text x="840" y="294" font-size="12" fill="#d25d5a" text-anchor="middle">指标下降</text>

  <!-- Feedback Label 2: Review Failed -->
  <rect x="1015" y="278" width="110" height="24" rx="4" fill="#ffffff" stroke="#fee3e2" stroke-width="1" />
  <text x="1070" y="294" font-size="12" fill="#d25d5a" text-anchor="middle">Review 不通过</text>

  <!-- Feedback Main Label -->
  <rect x="500" y="324" width="220" height="32" rx="16" fill="#fee3e2" />
  <text x="610" y="345" font-size="14" font-weight="bold" fill="#d25d5a" text-anchor="middle">修改 Prompt 并重新评测</text>

  <!-- Main Nodes (Cards) -->
  <!-- N1: 编写模板 -->
  <rect x="60" y="180" width="180" height="80" rx="8" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="150" y="214" font-size="15" font-weight="bold" fill="#1f2329" text-anchor="middle">编写 / 修改模板</text>
  <text x="150" y="240" font-size="13" fill="#646a73" text-anchor="middle">Prompt 设定与调优</text>

  <!-- N2: 样例测试 -->
  <rect x="290" y="180" width="180" height="80" rx="8" fill="#f0f4fc" stroke="#5178c6" stroke-width="1.5" />
  <text x="380" y="214" font-size="15" font-weight="bold" fill="#1f2329" text-anchor="middle">样例测试</text>
  <text x="380" y="240" font-size="13" fill="#646a73" text-anchor="middle">单样本初步验证</text>

  <!-- N3: 固定评测集批量运行 -->
  <rect x="520" y="180" width="180" height="80" rx="8" fill="#eae2fe" stroke="#8569cb" stroke-width="1.5" />
  <text x="610" y="214" font-size="15" font-weight="bold" fill="#1f2329" text-anchor="middle">固定评测集批量运行</text>
  <text x="610" y="240" font-size="13" fill="#646a73" text-anchor="middle">自动化数据验证</text>

  <!-- N4: 与基线对比 -->
  <rect x="750" y="180" width="180" height="80" rx="8" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="840" y="214" font-size="15" font-weight="bold" fill="#1f2329" text-anchor="middle">与基线对比</text>
  <text x="840" y="240" font-size="13" fill="#646a73" text-anchor="middle">核心指标评估分析</text>

  <!-- N5: 人工 Review -->
  <rect x="980" y="180" width="180" height="80" rx="8" fill="#fef1ce" stroke="#d4b45b" stroke-width="1.5" />
  <text x="1070" y="214" font-size="15" font-weight="bold" fill="#1f2329" text-anchor="middle">人工 Review</text>
  <text x="1070" y="240" font-size="13" fill="#646a73" text-anchor="middle">边缘 Case 与体感审查</text>

  <!-- N6: 版本发布 -->
  <rect x="1210" y="180" width="180" height="80" rx="8" fill="#dff5e5" stroke="#509863" stroke-width="1.5" />
  <text x="1300" y="214" font-size="15" font-weight="bold" fill="#1f2329" text-anchor="middle">版本发布</text>
  <text x="1300" y="240" font-size="13" fill="#646a73" text-anchor="middle">基线更替与对外输出</text>

  <!-- Top Hanging Labels -->
  <!-- Label 1: Prompt 版本 -->
  <rect x="95" y="120" width="110" height="26" rx="13" fill="#ffffff" stroke="#dee0e3" stroke-width="1" />
  <circle cx="109" cy="133" r="4" fill="#5178c6" />
  <text x="121" y="137" font-size="12" font-weight="bold" fill="#646a73">Prompt 版本</text>

  <!-- Label 2: 评测集版本 -->
  <rect x="552" y="120" width="116" height="26" rx="13" fill="#ffffff" stroke="#dee0e3" stroke-width="1" />
  <circle cx="566" cy="133" r="4" fill="#8569cb" />
  <text x="578" y="137" font-size="12" font-weight="bold" fill="#646a73">评测集版本</text>

  <!-- Label 3: 线上版本 -->
  <rect x="1245" y="120" width="110" height="26" rx="13" fill="#ffffff" stroke="#dee0e3" stroke-width="1" />
  <circle cx="1259" cy="133" r="4" fill="#509863" />
  <text x="1271" y="137" font-size="12" font-weight="bold" fill="#646a73">线上版本</text>
</svg>
